<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鬼哭の花契り — プロローグ 第1場面</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11191b;color:#fff4df;font:16px system-ui;display:grid;place-items:center;min-height:100svh}main{width:min(100%,1100px);padding:12px}video{display:block;width:100%;max-height:78svh;aspect-ratio:16/9;background:#111;object-fit:contain}h1{font-size:18px;margin:4px 0 12px}p{font-size:13px;color:#d5d1c3}a{color:#ffdaa2}button{font:inherit;padding:10px 20px;border-radius:6px;border:1px solid #ffe6ad;background:#395c57;color:white;margin-top:12px}</style>
<main><h1>花咲く鬼灯の里の日常</h1><video id="movie" controls playsinline preload="metadata" poster="assets/prologue/scene01/layers/background.png" src="assets/prologue/scene01/scene01.mp4"></video><button id="play">音声付きで再生</button><p id="status">第1場面・26秒。プロローグ全編は制作中です。</p><p><a href="index.html">ゲームへ戻る</a></p></main>
<script>const v=document.getElementById('movie'),s=document.getElementById('status');document.getElementById('play').onclick=async()=>{try{v.currentTime=0;v.muted=false;await v.play();s.textContent='再生中';}catch(e){s.textContent='再生ボタンを押してください。再生できない場合は回線と音量をご確認ください。'}};v.onended=()=>s.textContent='第1場面の再生が終了しました。';v.onerror=()=>s.textContent='映像を読み込めません。時間をおいて再読み込みしてください。';</script></html>
