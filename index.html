<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1020">
<title>夜叉姫の花結び奇譚 β15.57.2</title>
<link rel="stylesheet" href="css/game.css?v=15.57.2">
</head>
<body>
<canvas id="worldTerrain" width="1536" height="1536" hidden aria-hidden="true"></canvas>
<div id="app">
  <header>
    <div class="brand">夜叉姫の花結び奇譚 <small>β15.57.2</small></div>
    <div class="topBtns">
      <button id="worldBtn">地図</button><button id="bookBtn">つよさ</button><button id="saveBtn">記録</button><button id="settingsBtn">設定</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" width="768" height="768" aria-label="ゲーム画面"></canvas>
    <div id="hud"></div>
    <div id="objective"></div>
    <div id="message"></div>
<div id="dialog" class="overlay" role="dialog" aria-labelledby="speaker"><div class="dialogWindow"><canvas id="dialogPortrait" width="180" height="180" aria-label="夜叉姫" style="display:none"></canvas><div id="speaker"></div><div id="dialogText"></div><button id="dialogNext">次へ</button></div></div>
  </main>

  <section id="pad" aria-label="ゲーム操作">
    <div class="dpad" aria-label="8方向移動">
      <button id="upLeft" class="dir diagonal" aria-label="左上">↖</button>
      <button id="upRight" class="dir diagonal" aria-label="右上">↗</button>
      <button id="downLeft" class="dir diagonal" aria-label="左下">↙</button>
      <button id="downRight" class="dir diagonal" aria-label="右下">↘</button>
      <button id="up" class="dir">▲</button>
      <button id="left" class="dir">◀</button>
      <button id="right" class="dir">▶</button>
      <button id="down" class="dir">▼</button>
    </div>
    <button id="cancel" class="round sub" aria-label="B 戻る">B<small>戻る</small></button>
    <button id="ok" class="round main" aria-label="A 決定 話す 調べる">A<small>決定</small></button>
  </section>
</div>

<div id="title" class="overlay show">
  <div class="titleArt" aria-hidden="true">
    <div class="titleBackdrop"></div>
    <img class="titleLogo" src="assets/ui/title-logo.webp" alt="">
    <div class="titleShade"></div>
  </div>
  <div class="titlebox">
    <div class="subtitle">— 鬼と花と、忘れられた約束 —</div>
    <button id="newGame" class="primary" type="button" onclick="window.__YK_BOOT_START&&window.__YK_BOOT_START()">はじめから</button>
    <button id="continueGame">つづきから</button>
    <button id="debugMap" type="button" style="font-size:14px;opacity:.82">DEBUG MAP</button>
    <div class="version">BETA 15.57.2</div><div id="bootError" style="font-size:12px;min-height:18px"></div>
  </div>
  <script>
  // Boot-safe title control. This deliberately does not depend on game.js/YK_INPUT.
  // It is replaced by the full handler once the game scripts finish loading.
  window.__YK_BOOT_START=function(){
    try{
      if(window.YK_SAVE){
        window.gameState=YK_SAVE.fresh();
      }
      document.getElementById("title")?.classList.remove("show");
      window.dispatchEvent(new CustomEvent("yk-boot-start"));
    }catch(e){
      document.getElementById("bootError").textContent="起動エラー: "+(e&&e.message?e.message:e);
    }
  };
  </script>
</div>

<div id="hotSpring" class="overlay"><div class="window hotWindow"><h2>月見の湯</h2><canvas id="hotSpringCanvas" width="768" height="430"></canvas><p id="hotSpringText">湯気の向こうで、花びらが静かに揺れている。</p><div class="hotChoices"><button data-hot="bath">入浴する</button><button data-hot="overheat">のぼせる</button><button data-hot="leave">やめる</button></div></div></div><div id="worldMap" class="overlay"><div class="window worldWindow">
<h2>世界地図</h2><canvas id="worldCanvas" width="720" height="720"></canvas>
<p id="worldStatus" class="mapHint"></p><div id="worldPlaces" class="worldPlaces"></div><p class="mapHint">地名を選ぶと目的地の印を付けられます。目的地の入口付近で A を押して入ります。</p>
<button data-close="worldMap">閉じる</button></div></div>


<div id="battle" class="overlay" aria-label="戦闘">
  <div class="battleTop"><span id="enemyName"></span><span>体 <b id="enemyHp"></b></span></div>
  <canvas id="battleCanvas" width="768" height="430" aria-label="夜叉姫と敵の戦闘"></canvas>
  <div class="battleVitals"><strong>夜叉姫 <span id="battleLevel"></span>段</strong><span>体 <b id="battleHp"></b></span><span>技 <b id="battleMp"></b></span></div>
  <div class="battleMeters"><div><i id="battleHpBar"></i></div><div><i id="battleMpBar"></i></div></div>
  <div class="battleInfo"><span id="battleText" role="status" aria-live="polite">どうする？</span></div>
  <div id="battleCommands" class="battleCommands" aria-label="戦闘コマンド">
    <button data-cmd="attack">戦う</button><button data-cmd="skill">術</button>
    <button data-cmd="item">道具</button><button data-cmd="guard">守る</button>
    <button data-cmd="escape">逃げる</button><button data-cmd="back">戻る</button>
  </div>
  <p id="battleHelp" class="battleHelp">十字キー：選択 ／ A：決定 ／ B：戻る</p>
</div>

<div id="menu" class="overlay"><div class="window">
  <h2>つよさ</h2><div id="statusPanel"></div>
  <h3>装備</h3><div id="equipmentPanel"></div>
  <h3>道具・お守り</h3><div id="itemsPanel"></div>
  <h3>おまけの衣装</h3><div id="outfits" class="choices"></div>
  <p class="menuHelp">A：話す・調べる・決定　B：戻る<br>段＝成長の段階　体＝体力　技＝術の力　心の数＝成長に必要な経験</p>
  <h3>旅の足あと</h3><div id="recordPanel"></div>
  <button data-close="menu">閉じる</button>
</div></div>

<div id="shop" class="overlay"><div class="window"><h2>鬼灯の里・兵具屋</h2><p id="shopGold"></p><p id="shopNotice" role="status" aria-live="polite"></p><div id="shopTabs" class="choices"><button data-shop-tab="buy">買う</button><button data-shop-tab="sell">売る</button></div><div id="shopItems"></div><button data-close="shop">店を出る</button></div></div>

<div id="saveMenu" class="overlay"><div class="window">
  <h2>旅の記録</h2><div id="slots"></div><button data-close="saveMenu">閉じる</button>
</div></div>

<div id="settings" class="overlay"><div class="window">
  <h2>設定</h2>
  <label class="toggle"><span>効果音</span><input id="soundToggle" type="checkbox" checked></label>
  <label class="toggle"><span>移動速度</span><select id="speedSelect"><option value="1">標準</option><option value="1.35">速い</option></select></label>
  <button id="resetBtn" class="danger">セーブデータ初期化</button>
  <button data-close="settings">閉じる</button>
</div></div>

<div id="gameover" class="overlay"><div class="titlebox"><h2>力尽きた……</h2><p>最後の自動保存から再開できます。</p><button id="retryBtn" class="primary">再開する</button><button id="goTitleBtn">タイトルへ</button></div></div>

<script src="js/data.js?v=15.57.2"></script>
<script src="js/equipment.js?v=15.57.2"></script>
<script src="js/world.js?v=15.57.2"></script>
<script src="js/save.js?v=15.57.2"></script>
<script src="js/audio.js?v=15.57.2"></script>
<script src="js/input.js?v=15.57.2"></script>
<script src="js/autotile.js?v=15.57.2"></script>
<script src="js/landscape.js?v=15.57.2"></script>
<script src="js/settlement.js?v=15.57.2"></script>
<script src="js/game.js?v=15.57.2"></script>



</body></html>
