<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜叉姫 β15.28 攻撃・被弾確認</title>
<style>body{background:#17212c;color:#f4efe8;font:16px system-ui;margin:0;padding:20px}main{max-width:768px;margin:auto}h1{font-size:23px}button,select{font:inherit;padding:10px;margin:4px;border-radius:8px}canvas{width:100%;background:#9ca4aa;border-radius:12px}a{color:#a6d9ff}p{line-height:1.7}</style>
<main><h1>夜叉姫・攻撃／被弾 β15.28</h1><p>全6衣装の専用ポーズ。通常攻撃・花結びで攻撃姿勢、敵の攻撃で被弾姿勢になります。</p><select id="outfit" aria-label="衣装"><option value="normal">花守り装束</option><option value="light">軽装・薄紅</option><option value="white">水辺の白装束</option><option value="navy">水辺の藍装束</option><option value="yukata">宵桜の浴衣</option><option value="demon">小鬼の戯れ着</option></select><button id="play">停止</button><button data-pose="idle">構え</button><button data-pose="attack">攻撃</button><button data-pose="hit">被弾</button><canvas id="c" width="768" height="430"></canvas><p id="status" role="status">読込中…</p><p><a href="sprite-preview.html">歩行・ベース比較</a> ／ <a href="index.html">ゲームへ</a></p></main>
<script>
const $=id=>document.getElementById(id),ctx=$('c').getContext('2d'),sets={};let ready=0,failed=0,playing=true,pose='idle',start=0;
for(const outfit of ['normal','light','white','navy','yukata','demon']){sets[outfit]={};for(const p of ['idle','attack','hit']){const im=new Image();im.onload=()=>{ready++;draw()};im.onerror=()=>{failed++;draw()};im.src=p==='idle'?`assets/characters/yashahime/${outfit}-v9/right-neutral.png`:`assets/characters/yashahime/battle-v9/${outfit}-${p}.png`;sets[outfit][p]=im;}}
function draw(){ctx.clearRect(0,0,768,430);ctx.fillStyle='#283948';ctx.font='22px system-ui';ctx.fillText({idle:'構え',attack:'攻撃',hit:'被弾'}[pose],25,35);ctx.strokeStyle='#758590';ctx.beginPath();ctx.moveTo(20,360);ctx.lineTo(748,360);ctx.stroke();const im=sets[$('outfit').value]?.[pose];if(im?.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const x=pose==='attack'?340:285;if(pose==='idle')ctx.drawImage(im,x-314,360-480,512,512);else ctx.drawImage(im,x-384,360-480,768,512);}$('status').textContent=failed?`${failed}枚の読み込み失敗`:`${ready}/18枚 読み込み済み`;}
$('outfit').onchange=draw;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'停止':'再生';start=0};document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{playing=false;$('play').textContent='再生';pose=b.dataset.pose;draw()});function tick(t){if(playing){if(!start)start=t;const n=(t-start)%1600;pose=n<400?'idle':n<720?'attack':n<880?'idle':n<1300?'hit':'idle';draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
