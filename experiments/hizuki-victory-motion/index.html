<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>緋月 勝利・レベルアップ動作試作</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121729;color:#f7e9d5;font-family:system-ui,-apple-system,sans-serif}main{max-width:780px;margin:auto;padding:16px}h1{font-size:20px;margin:8px 0}p{font-size:13px;color:#c7cad8;line-height:1.6}.stage{position:relative;height:min(69vh,540px);min-height:340px;overflow:hidden;border:1px solid #61587b;border-radius:12px;background:radial-gradient(ellipse at 70% 35%,#574367 0%,#292e53 45%,#151a30 100%)}.floor{position:absolute;inset:65% -15% -25%;background:radial-gradient(ellipse,#5a5471 0%,transparent 65%);transform:perspective(400px) rotateX(65deg)}.character{position:absolute;bottom:-26%;left:50%;height:125%;width:auto;max-width:none;object-fit:contain;transform:translateX(-50%);transform-origin:50% 75%;filter:drop-shadow(0 10px 10px #0009);will-change:transform}.stage.victory .character{animation:victory 3.3s ease-in-out infinite}.stage.levelup .character{animation:levelup 3.3s ease-in-out infinite}.stage.levelup .glow{opacity:1}.glow{pointer-events:none;position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 45%,#ffe3a02d,transparent 60%);animation:pulse 2s ease-in-out infinite}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff0ba;box-shadow:0 0 10px #fff0ba;opacity:0}.stage.levelup .spark{animation:spark 2.8s ease-out infinite}.spark:nth-of-type(1){left:20%;top:70%;animation-delay:0s!important}.spark:nth-of-type(2){left:38%;top:80%;animation-delay:.5s!important}.spark:nth-of-type(3){left:68%;top:75%;animation-delay:1s!important}.spark:nth-of-type(4){left:83%;top:65%;animation-delay:1.5s!important}.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button{background:#3b3c61;border:1px solid #8682a9;color:white;padding:12px 16px;border-radius:9px;font-size:15px}button[aria-pressed=true]{background:#7766a2;border-color:#e3c9ff}.tag{position:absolute;top:12px;left:12px;background:#101526a8;border-radius:8px;padding:8px 12px;font-size:13px}@keyframes victory{0%,100%{transform:translateX(-50%) rotate(-1deg) scale(1)}15%{transform:translateX(-50%) translateY(-8px) rotate(2deg) scale(1.025)}32%{transform:translateX(-50%) translateY(-18px) rotate(-2deg) scale(1.04)}48%{transform:translateX(-50%) translateY(-5px) rotate(1deg) scale(1.015)}65%{transform:translateX(-50%) rotate(-1deg) scale(1)}}@keyframes levelup{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}20%{transform:translateX(-50%) translateY(10px) scale(.99)}45%{transform:translateX(-50%) translateY(-30px) scale(1.07)}65%{transform:translateX(-50%) translateY(-22px) scale(1.055)}85%{transform:translateX(-50%) translateY(-5px) scale(1.015)}}@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.9}}@keyframes spark{0%{transform:translateY(25px) scale(.2);opacity:0}25%{opacity:1}80%{opacity:.8}100%{transform:translateY(-210px) scale(.1);opacity:0}}@media(prefers-reduced-motion:reduce){.character,.glow,.spark{animation:none!important}}
</style></head><body><main><h1>緋月｜勝利・レベルアップ 動作試作</h1><p>採用済み透過PNGをそのまま使用。Live2D本体ではなく、一枚絵を使った揺れ・拡縮・浮遊・光の試作です。ゲーム本編には未適用。</p><div class="controls"><button id="victory" aria-pressed="true">勝利ポーズ</button><button id="levelup" aria-pressed="false">レベルアップ</button></div><div id="stage" class="stage victory"><div class="floor"></div><div class="glow"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><img id="art" class="character" src="../../assets/characters/hizuki/battle-expressions-v1/battle-end.png?v=15.57.220" alt="緋月の勝利ポーズ"><div class="tag" id="label">勝利モーション</div></div><p>腕や髪を別々に動かす本格Live2D化には、原画のパーツ分離と変形モデル制作が必要です。</p></main><script>const stage=document.getElementById('stage'),art=document.getElementById('art'),label=document.getElementById('label');for(const type of ['victory','levelup'])document.getElementById(type).addEventListener('click',()=>{stage.className='stage '+type;art.src='../../assets/characters/hizuki/battle-expressions-v1/'+(type==='victory'?'battle-end':'level-up')+'.png?v=15.57.220';art.alt=type==='victory'?'緋月の勝利ポーズ':'緋月のレベルアップ絵';label.textContent=type==='victory'?'勝利モーション':'レベルアップモーション';for(const t of ['victory','levelup'])document.getElementById(t).setAttribute('aria-pressed',String(type===t));});</script><style>
.motion-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.motion-controls label{font-size:13px;background:#252a43;border-radius:8px;padding:10px;display:flex;gap:6px;flex-direction:column}.motion-controls input{width:100%}.part{pointer-events:none;position:absolute;inset:0;overflow:hidden}.part img{position:absolute;bottom:-26%;left:50%;height:125%;max-width:none;width:auto;object-fit:contain;transform:translateX(-50%);transform-origin:50% 75%;filter:drop-shadow(0 0 0 transparent)}.stage.levelup .part.hair img{animation:hairSway 2.3s ease-in-out infinite}.stage.levelup .part.chest img{animation:chestBreathe 2.8s ease-in-out infinite}.stage.levelup .part.face img{animation:faceBlink 4.2s ease-in-out infinite}.stage.victory .part{display:none}.part.hair{clip-path:polygon(25% 5%,75% 5%,75% 42%,25% 42%)}.part.chest{clip-path:polygon(25% 38%,75% 38%,75% 76%,25% 76%)}.part.face{clip-path:polygon(37% 19%,64% 19%,64% 39%,37% 39%)}@keyframes hairSway{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(calc(-50% + 5px)) rotate(1deg)}}@keyframes chestBreathe{0%,100%{transform:translateX(-50%) scaleX(1) scaleY(1)}50%{transform:translateX(-50%) scaleX(1.014) scaleY(1.008)}}@keyframes faceBlink{0%,43%,47%,100%{transform:translateX(-50%) scaleY(1)}45%{transform:translateX(-50%) scaleY(.975)}}@media(max-width:460px){.motion-controls{grid-template-columns:1fr 1fr}}
</style><div class="motion-controls" id="partsControls"><label>髪の揺れ <input id="hairToggle" type="checkbox" checked></label><label>胸元の呼吸 <input id="chestToggle" type="checkbox" checked></label><label>表情の微変化 <input id="faceToggle" type="checkbox" checked></label></div><p>部分変形の技術検証です。元の一枚絵の一部を重ねて動かしているため、髪・胸元・顔の境界にズレが出る可能性があります。まばたきや口の開閉を正確に再現するには目・口の独立レイヤーが必要です。</p><script>
(function(){const stage=document.getElementById('stage'),art=document.getElementById('art');for(const part of ['hair','chest','face']){const layer=document.createElement('div');layer.className='part '+part;const img=document.createElement('img');img.alt='';img.setAttribute('aria-hidden','true');layer.appendChild(img);stage.insertBefore(layer,document.getElementById('label'));const sync=()=>{img.src=art.src;const base=art.getBoundingClientRect(),box=stage.getBoundingClientRect();img.style.height=base.height+'px';img.style.width=base.width+'px';img.style.bottom=(box.bottom-base.bottom)+'px';img.style.left=(base.left-box.left+base.width/2)+'px'};art.addEventListener('load',sync);window.addEventListener('resize',sync);setTimeout(sync,50);document.getElementById(part+'Toggle').addEventListener('change',e=>{layer.style.display=e.target.checked?'':'none'});}}
)();
</script></body></html>
