<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>緋月 Live2D 顔パーツ検査</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#141827;color:#f8f3f8;font-family:system-ui,-apple-system,sans-serif}main{max-width:780px;margin:auto;padding:16px}h1{font-size:20px}p{line-height:1.55;color:#ccd1df;font-size:14px}.stage{position:relative;width:100%;aspect-ratio:1024/1536;max-height:70vh;overflow:hidden;border:1px solid #666;border-radius:12px;background:repeating-conic-gradient(#4a4d59 0 25%,#737684 0 50%) 0 0/22px 22px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.part{pointer-events:none;position:absolute;inset:0;overflow:hidden}.part img{width:100%;height:100%}.part.eye{clip-path:ellipse(8% 5% at 42% 28%)}.part.wink{clip-path:ellipse(8% 5% at 58% 28%)}.part.mouth{clip-path:ellipse(9% 6% at 51% 36%)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.controls label{display:flex;align-items:center;gap:5px}.controls button{padding:10px;border-radius:8px;border:1px solid #9694ae;background:#343956;color:white}.note{border-left:3px solid #f0bd71;padding:8px 12px;background:#292b3c}input[type=range]{width:100%}</style></head><body><main><h1>緋月｜顔パーツ検査（Safari対応）</h1><p>GitHub登録済みのレベルアップ原画を直接表示します。顔領域の位置と、独立パーツ化に必要な範囲を確認するための公開検査ページです。</p><div class="controls"><label><input type="checkbox" id="eye" checked>目の領域</label><label><input type="checkbox" id="wink" checked>反対側の目</label><label><input type="checkbox" id="mouth" checked>口の領域</label><button id="reset">表示を戻す</button></div><label>元絵との比較位置 <input type="range" id="compare" min="0" max="100" value="50"></label><div class="stage" id="stage"><img id="base" src="../../assets/characters/hizuki/battle-expressions-v1/level-up.png?v=15.57.222" alt="採用済みレベルアップ原画"><div class="part eye" id="eyeLayer"><img src="../../assets/characters/hizuki/battle-expressions-v1/level-up.png?v=15.57.222" alt=""></div><div class="part wink" id="winkLayer"><img src="../../assets/characters/hizuki/battle-expressions-v1/level-up.png?v=15.57.222" alt=""></div><div class="part mouth" id="mouthLayer"><img src="../../assets/characters/hizuki/battle-expressions-v1/level-up.png?v=15.57.222" alt=""></div><div id="line" style="position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #ffe09a;pointer-events:none"></div></div><p class="note">これは実画像の公開確認と顔領域の監査用です。以前のv4 ZIPの補完済み顔パーツをGitHubに転送したものではありません。目や口を独立して動かすLive2Dモデルも未完成です。</p></main><script>const stage=document.getElementById('stage');for(const id of ['eye','wink','mouth'])document.getElementById(id).addEventListener('change',e=>document.getElementById(id+'Layer').style.display=e.target.checked?'':'none');const slider=document.getElementById('compare');slider.addEventListener('input',e=>{const n=Number(e.target.value);document.getElementById('line').style.left=n+'%';for(const el of document.querySelectorAll('.part'))el.style.clipPath='inset(0 0 0 '+n+'%)'});document.getElementById('reset').addEventListener('click',()=>{slider.value=50;slider.dispatchEvent(new Event('input'));for(const id of ['eye','wink','mouth']){document.getElementById(id).checked=true;document.getElementById(id+'Layer').style.display=''}});slider.dispatchEvent(new Event('input'));</script></body></html>
