<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>高低差の検証 · 鬼哭の花契り</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102a35;color:#f7efdb;font:15px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:4px 0}a{color:#c4dcd0}p{line-height:1.6;margin:8px 0 12px}.muted{color:#bfd0cd;font-size:13px}canvas{display:block;width:100%;height:auto;background:#4c929c;image-rendering:pixelated;border-radius:8px}section{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}label{display:flex;align-items:center;gap:7px}select,button{font:inherit;color:#fff3d8;background:#234957;border:1px solid #638389;border-radius:7px;min-height:44px;padding:8px 12px}button{cursor:pointer;touch-action:none}button:active{background:#477d72}button:disabled{opacity:.5}#status{min-height:24px;color:#f4d38e}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:0}.pad button{height:48px;font-size:20px}.controls{justify-content:space-between}footer{font-size:12px;color:#a9c2c1;margin-top:14px}input{width:20px;height:20px}</style></head>
<body><main><header><h1>天妖の社を歩いて確認</h1><a href="index.html">本編へ</a></header>
<p class="muted">天妖の社v3構造案を、遠近効果のない固定倍率の平面カメラで検査します。移動判定はゲームと共通です。保存データには影響しません。</p>
<canvas id="terrain" width="640" height="544" aria-label="草・砂・雪の段丘と坂道。緋月を十字キーで操作できます。"></canvas>
<section><label>地表<select id="material"><option value="mixed">草・砂・雪を並べる</option><option value="grass">草地</option><option value="sand">砂地</option><option value="snow">雪原</option></select></label><label>崖面<select id="cliff"><option value="rock">岩</option><option value="sand">土（仮）</option><option value="snow">雪（仮）</option></select></label><label>崖の角<select id="corners"><option value="0">直角（比較）</option><option value="8">斜め・小</option><option value="12">斜め・中</option><option value="24">斜め・大</option><option value="30" selected>斜め・約45%</option></select></label><label>段差<select id="rise"><option value="16">低め</option><option value="20" selected>標準</option><option value="28">高め</option></select></label><label><input id="grid" type="checkbox">マス目・侵入不可</label></section>
<div id="status" role="status" aria-live="polite">素材を読み込んでいます…</div>
<section><label>建築物を確認<select id="focus"><option value="">入口付近</option><option value="main_shrine">本殿</option><option value="left_auxiliary">左社殿</option><option value="right_auxiliary">右社殿</option><option value="torii">鳥居</option><option value="west_bridge">西橋</option><option value="east_bridge">東橋</option></select></label></section><section class="controls"><div class="pad" aria-label="移動"><span></span><button data-dir="u" aria-label="上へ">↑</button><span></span><button data-dir="l" aria-label="左へ">←</button><button id="reset" aria-label="入口に戻る">戻</button><button data-dir="r" aria-label="右へ">→</button><span></span><button data-dir="d" aria-label="下へ">↓</button></div><button id="tour" disabled>本殿まで往復</button></section>
<p>仮配置の48×48マップです。上下の石段を通り、本殿前まで移動できます。建物・鳥居・橋は専用の暫定描画です。完成イメージに合わせた美術調整は未完了です。</p>
<footer>天妖の社・検証用。実機Safariと完成画像の検査は別工程です。</footer>
</main><script src="js/landscape.js?v=16.0.118"></script><script src="js/elevation-model.js?v=16.0.118"></script><script src="js/elevation-view.js?v=tenyo-flat-1"></script><script src="qa/tenyo-elevation-check/tenyo-v3-data.js?v=1"></script><script src="js/tenyo-elevation-lab.js?v=tenyo-flat-1"></script></body></html>
