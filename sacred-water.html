<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>水鏡の聖域・独立試作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071e26;color:#f4e7c7;font:14px system-ui;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}header{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;text-shadow:0 2px 4px #000}h1{font:20px serif;letter-spacing:.18em;margin:0 0 5px}small{opacity:.8}nav{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px}button{border:1px solid #b8c6ae88;background:#102e36de;color:#f4e7c7;border-radius:10px;padding:10px;touch-action:none}#pad{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:18px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:3px}#pad button{font-size:22px;padding:0}#u{grid-area:1/2}#l{grid-area:2/1}#d{grid-area:3/2}#r{grid-area:2/3}#status{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:16px;max-width:48%;font-size:12px;text-shadow:0 2px 3px #000}#load{position:fixed;inset:0;background:#071e26;display:grid;place-content:center}</style>
<canvas id="scene"></canvas><header><h1>水鏡の聖域</h1><small>既存素材による独立試作 · 32pxグリッド</small></header><nav><button id="view">全景</button><button id="grid">判定</button><button id="home">入口へ</button></nav><div id="pad"><button id="u" data-d="0,-1">↑</button><button id="l" data-d="-1,0">←</button><button id="d" data-d="0,1">↓</button><button id="r" data-d="1,0">→</button></div><div id="status">浅瀬の参道を歩けます</div><div id="load">聖域を読み込んでいます…</div>
<script src="js/elevation-model.js"></script><script src="js/settlement-map/catalog.js"></script><script src="js/settlement-map/autotile.js"></script><script src="js/settlement-map/model.js"></script><script src="js/settlement-map/render.js"></script><script src="js/sacred-water.js"></script></html>
