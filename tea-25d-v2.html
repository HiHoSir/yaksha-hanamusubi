<script type="module">

renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(768,768,false);renderer.setClearColor(0x2a1e18);renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';stage.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x2a1e18);
const camera=new T.OrthographicCamera(-6.5,6.5,6.5,-6.5,.1,100);let bird=false;

const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.97});const wood=mat(0x865636),dark=mat(0x442b20),wall=mat(0xe0c59a),tatami=mat(0xaaa978),edging=mat(0x586348),cushion=mat(0x2c456e),light=new T.MeshBasicMaterial({color:0xffd78d}),fire=new T.MeshBasicMaterial({color:0xed7a35});

for(let i=0;i<6;i++)for(let j=0;j<5;j++){let x=-5.55+i*2.22,z=-4.5+j*2.16;box(x,.015,z,2.04,.036,1.99,tatami);box(x,.043,z-.98,2.07,.022,.06,edging);box(x-1.01,.044,z,.06,.022,1.99,edging)}

let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;let dx=+active.has('right')-+active.has('left')+ +active.has('ur')+ +active.has('dr')- +active.has('ul')- +active.has('dl'),dz=+active.has('down')-+active.has('up')+ +active.has('dr')+ +active.has('dl')- +active.has('ur')- +active.has('ul'),n=Math.hypot(dx,dz);if(n){dx/=n;dz/=n;const x=T.MathUtils.clamp(loc.x+dx*dt*2.2,-5.7,5.7),z=T.MathUtils.clamp(loc.z+dz*dt*2.2,-4.8,5.1);if(!blocked(x,loc.z))loc.x=x;if(!blocked(loc.x,z))loc.z=z;update()}renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
