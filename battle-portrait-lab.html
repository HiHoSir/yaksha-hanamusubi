<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>縦画面・戦闘UI検証</title><style>
*{box-sizing:border-box}body{margin:0;background:#081522;color:#f5e4c5;font-family:system-ui,sans-serif}main{max-width:500px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}a{color:#edcc87}small{color:#b9c5cb}.arena{position:relative;height:min(47dvh,440px);min-height:270px;border:2px solid #b99a62;border-radius:12px;overflow:hidden;background:#263d50 url("assets/scenes/battle-grass-v1.png") center center / cover no-repeat}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#07101d8a)}.hero,.enemy{position:absolute;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 4px 3px #0008)}.hero{z-index:2;left:-5%;bottom:-4%;width:61%;height:88%;object-position:bottom left}.enemy{z-index:1;right:2%;top:12%;width:51%;height:68%}.target{position:absolute;z-index:3;top:8px;right:8px;border:1px solid #d7b77b;background:#15283edc;padding:6px 9px;border-radius:7px}.target[hidden]{display:none}.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}.member{border:1px solid #a98f65;background:#172b40;border-radius:7px;padding:6px 4px;font-size:12px;min-height:66px}.member strong{display:block}.member small{font-size:11px}.empty{opacity:.4}.bar{height:5px;background:#536272;border-radius:4px;margin-top:4px}.bar i{display:block;width:80%;height:100%;background:#a4d3a5}.log{margin:8px 0;border:1px solid #b99a62;border-radius:8px;background:#11263c;padding:10px;min-height:42px}.commands{display:grid;grid-template-columns:1fr 1fr;gap:8px}.commands button{min-height:51px;border:1px solid #c8a775;border-radius:8px;background:#29445f;color:#fff2d6;font-size:17px;font-weight:700}.commands button.selected{background:#70455d;outline:2px solid #e9c980}.note{font-size:12px;line-height:1.5;color:#b9c5cb;margin-top:12px}@media(max-height:700px){.arena{height:39dvh;min-height:220px}.member{min-height:54px}.commands button{min-height:44px}}
@media(orientation:landscape){main{max-width:980px}.arena{height:65dvh;min-height:190px}.hero{width:39%;height:94%}.enemy{width:39%;height:80%}.commands{grid-template-columns:repeat(6,minmax(0,1fr))}.party{max-width:760px;margin-left:auto;margin-right:auto}} 
/* Floating translucent HUD prototype: portrait/landscape share a continuous battlefield. */
main{max-width:100%;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
header{position:relative;z-index:5;flex:none;margin-bottom:5px}
.arena{flex:1;height:auto;min-height:410px;max-height:none;border:0;border-radius:10px;background-position:center center}
.party{position:relative;z-index:4;margin:-75px 8px 0;max-width:none;gap:5px}
.member{background:rgba(10,25,44,.54);border-color:#ddc18e8c;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 2px 8px #0005}
.log{position:relative;z-index:4;margin:5px 8px;background:rgba(9,26,46,.62);border-color:#dfc18b99;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.commands{position:relative;z-index:4;margin:0 8px;gap:6px}
.commands button{background:rgba(23,47,72,.68);border-color:#e3c38e9c;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.commands button.selected{background:rgba(118,64,95,.78)}
.commands.acting{visibility:hidden;pointer-events:none}
.note{font-size:11px;margin:7px 9px 0}
.enemy{cursor:pointer;touch-action:manipulation}
.enemy.targeted{filter:drop-shadow(0 0 10px #fff0a9) drop-shadow(4px 4px 3px #0008)}
.arena .target{background:#10253fc4;backdrop-filter:blur(4px)}
@media(orientation:portrait){.arena{min-height:52dvh}.hero{height:84%;width:59%;bottom:1%}.enemy{top:17%;height:59%}.party{margin-top:-66px}.member{min-height:55px}.commands button{min-height:46px}}
@media(orientation:landscape){main{max-width:none;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,21%);grid-template-rows:auto minmax(0,1fr) auto;gap:5px}.arena{grid-column:1/3;grid-row:2/4;min-height:0;height:auto}.hero{width:37%;height:90%;bottom:-4%}.enemy{width:37%;height:75%;top:12%}.party{grid-column:1/3;grid-row:3;align-self:end;margin:0 8px 4px;padding-right:22%}.member{min-height:45px}.log{grid-column:1;grid-row:2;align-self:end;margin:0 8px 73px}.commands{grid-column:2;grid-row:2;align-self:stretch;display:flex;flex-direction:column;margin:5px 8px 75px 0}.commands button{flex:1;min-height:32px}.note{display:none}header{grid-column:1/3;grid-row:1}}

/* More transparent command surfaces, including selected state. */
.commands button{background:rgba(12,31,52,.36);border:1px solid rgba(232,207,164,.62);box-shadow:inset 0 1px 0 #ffffff12;color:#fff4dd;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.commands button.selected{background:rgba(114,56,83,.47);outline:1px solid rgba(248,213,154,.85)}
.commands button:active{background:rgba(177,132,91,.52)}
</style></head><body><main><header><div><b>草原戦闘背景・縦横検証</b><br><small>草原背景候補／本編には未適用</small></div><a href="index.html">ゲームへ</a></header><div class="arena"><img class="hero" src="assets/characters/hizuki/battle-v1/idle-rear-pixel.png" alt="緋月の戦闘待機姿"><img role="button" tabindex="0" aria-label="鬼を選択" class="enemy" src="assets/enemies/hd512/oni-intact-512.png" alt="鬼"><div id="target" class="target" hidden>鬼　体 36/36</div></div><div class="party"><div class="member"><strong>緋月</strong><small>体 44/55<br>技 12/20</small><div class="bar"><i></i></div></div><div class="member empty"><strong>仲間2</strong><small>未加入</small></div><div class="member empty"><strong>仲間3</strong><small>未加入</small></div><div class="member empty"><strong>仲間4</strong><small>未加入</small></div></div><div id="log" class="log">どうする？</div><div class="commands" id="commands"><button data-cmd="戦う" class="selected">戦う</button><button data-cmd="術">術</button><button data-cmd="道具">道具</button><button data-cmd="守る">守る</button><button data-cmd="逃げる">逃げる</button><button data-cmd="戻る">戻る</button></div><p class="note">コマンドをタップすると選択表示が変わります。戦闘・セーブ・報酬は動作しません。攻撃・被弾は表示演出のみです。新しい正方形の草原背景と既存の緋月・敵のPNGを使用しています。</p></main><script>
const buttons=[...document.querySelectorAll('[data-cmd]')],log=document.getElementById('log'),target=document.getElementById('target'),enemy=document.querySelector('.enemy'),commands=document.getElementById('commands');let acting=false,selected=false;
function selectEnemy(){if(acting)return;selected=true;enemy.classList.add('targeted');target.hidden=false;log.textContent='鬼を選択中　「戦う」で攻撃演出';}
function action(){if(acting)return;acting=true;commands.classList.add('acting');log.textContent='緋月の攻撃！';enemy.style.transition='transform 140ms';enemy.style.transform='translateX(9px)';setTimeout(()=>{enemy.style.transform='translateX(-7px)';log.textContent='鬼にダメージ！';},420);setTimeout(()=>{enemy.style.transform='';commands.classList.remove('acting');log.textContent='どうする？';acting=false;selected=false;enemy.classList.remove('targeted');target.hidden=true;},1200)}
buttons.forEach(b=>b.addEventListener('click',()=>{if(acting)return;buttons.forEach(x=>x.classList.toggle('selected',x===b));const a=b.dataset.cmd;if(a==='戦う'){if(selected)action();else selectEnemy()}else{selected=false;enemy.classList.remove('targeted');target.hidden=true;log.textContent=a==='戻る'?'どうする？':a+'を選択';}}));enemy.addEventListener('click',selectEnemy);enemy.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectEnemy()}});
</script></body></html>
