<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>縦画面・戦闘UI検証</title><style>
*{box-sizing:border-box}body{margin:0;background:#081522;color:#f5e4c5;font-family:system-ui,sans-serif}main{max-width:500px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}a{color:#edcc87}small{color:#b9c5cb}.arena{position:relative;height:min(47dvh,440px);min-height:270px;border:2px solid #b99a62;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 55% 25%,#637d77,#203d4b 58%,#102033)}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#07101d8a)}.hero,.enemy{position:absolute;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 4px 3px #0008)}.hero{z-index:2;left:-5%;bottom:-4%;width:61%;height:88%;object-position:bottom left}.enemy{z-index:1;right:2%;top:12%;width:51%;height:68%}.target{position:absolute;z-index:3;top:8px;right:8px;border:1px solid #d7b77b;background:#15283edc;padding:6px 9px;border-radius:7px}.target[hidden]{display:none}.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}.member{border:1px solid #a98f65;background:#172b40;border-radius:7px;padding:6px 4px;font-size:12px;min-height:66px}.member strong{display:block}.member small{font-size:11px}.empty{opacity:.4}.bar{height:5px;background:#536272;border-radius:4px;margin-top:4px}.bar i{display:block;width:80%;height:100%;background:#a4d3a5}.log{margin:8px 0;border:1px solid #b99a62;border-radius:8px;background:#11263c;padding:10px;min-height:42px}.commands{display:grid;grid-template-columns:1fr 1fr;gap:8px}.commands button{min-height:51px;border:1px solid #c8a775;border-radius:8px;background:#29445f;color:#fff2d6;font-size:17px;font-weight:700}.commands button.selected{background:#70455d;outline:2px solid #e9c980}.note{font-size:12px;line-height:1.5;color:#b9c5cb;margin-top:12px}@media(max-height:700px){.arena{height:39dvh;min-height:220px}.member{min-height:54px}.commands button{min-height:44px}}
</style></head><body><main><header><div><b>戦闘UI・縦画面試作</b><br><small>本編とは独立した検証ページ</small></div><a href="index.html">ゲームへ</a></header><div class="arena"><img class="hero" src="assets/characters/hizuki/battle-v1/idle-rear-pixel.png" alt="緋月の戦闘待機姿"><img class="enemy" src="assets/enemies/hd512/oni-intact-512.png" alt="鬼"><div id="target" class="target" hidden>鬼　体 36/36</div></div><div class="party"><div class="member"><strong>緋月</strong><small>体 44/55<br>技 12/20</small><div class="bar"><i></i></div></div><div class="member empty"><strong>仲間2</strong><small>未加入</small></div><div class="member empty"><strong>仲間3</strong><small>未加入</small></div><div class="member empty"><strong>仲間4</strong><small>未加入</small></div></div><div id="log" class="log">どうする？</div><div class="commands" id="commands"><button data-cmd="戦う" class="selected">戦う</button><button data-cmd="術">術</button><button data-cmd="道具">道具</button><button data-cmd="守る">守る</button><button data-cmd="逃げる">逃げる</button><button data-cmd="戻る">戻る</button></div><p class="note">コマンドをタップすると選択表示が変わります。戦闘・セーブ・報酬は動作しません。実際の緋月・敵のPNGを使用しています。</p></main><script>document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-cmd]').forEach(x=>x.classList.toggle('selected',x===b));let a=b.dataset.cmd;document.getElementById('target').hidden=a!=='戦う';document.getElementById('log').textContent=a==='戦う'?'攻撃する敵を選ぶ':a==='戻る'?'どうする？':a+'を選択';}));</script></body></html>
