<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鬼哭の花契り｜OP映像試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#f8e9df;font-family:serif;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100dvh;padding:12px;gap:14px}h1{font-size:clamp(17px,4vw,27px);margin:0}#stage{width:min(98vw,1100px);aspect-ratio:16/9;position:relative;overflow:hidden;background:#152e4c;border:1px solid #705d70;border-radius:6px}.scene{position:absolute;inset:0;opacity:0;transition:opacity 1s;overflow:hidden}.scene.on{opacity:1}.sky{position:absolute;inset:-8%;background:linear-gradient(#316088,#b8c9ca 60%,#d7b6a4);animation:pan 12s ease-in-out infinite alternate}.dusk{background:linear-gradient(#0e1c39,#a65b83 60%,#edc19c)}.hill{position:absolute;inset:30% -10% -15%;background:linear-gradient(#58737b,#213e4d);clip-path:polygon(0 80%,13% 42%,25% 68%,42% 12%,58% 70%,72% 31%,85% 66%,100% 27%,100% 100%,0 100%);animation:pan 13s ease-in-out infinite alternate-reverse}.front{top:52%;background:linear-gradient(#476f5c,#152f36);transform:scaleX(-1)}.sun{position:absolute;top:21%;left:71%;width:12%;aspect-ratio:1;background:#ffe9c1;border-radius:50%;box-shadow:0 0 60px 20px #f9d4b477}.ground{position:absolute;inset:72% 0 0;background:#42624f}.path{position:absolute;inset:68% 39% -15%;background:#c4a886;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%)}.house{position:absolute;left:12%;bottom:20%;width:18%;height:20%;background:#987c66;border:3px solid #493d40}.house:before{content:"";position:absolute;bottom:100%;left:-15%;width:130%;height:60%;background:#323a48;clip-path:polygon(0 100%,50% 0,100% 100%)}.house.two{left:70%;transform:scale(.8)}.river{position:absolute;inset:57% -10% -10%;background:repeating-linear-gradient(173deg,#8ec7ce 0 10px,#4c859b 12px 22px);transform:skewY(-7deg);animation:water 10s linear infinite}.bell{position:absolute;left:46%;top:15%;width:8%;height:28%;background:linear-gradient(90deg,#806751,#e6c99c,#705643);clip-path:polygon(20% 0,80% 0,90% 75%,100% 90%,0 90%,10% 75%);animation:sway 4s ease-in-out}.bell:after{content:"";position:absolute;top:80%;left:47%;height:75%;width:5px;background:#bc5063}.tag{position:absolute;left:43%;top:25%;width:14%;height:42%;background:linear-gradient(145deg,#f9dfac,#b58060);border:5px double #8d5c46;border-radius:9px;box-shadow:0 0 55px #ffbd90a8;transform:rotate(-12deg);display:grid;place-items:center;font-size:clamp(30px,7vw,70px);color:#9b394d;animation:pulse 3s infinite alternate}.fox{position:absolute;left:35%;top:16%;width:30%;height:53%;border-radius:55% 55% 45% 45%;background:radial-gradient(#f6fbff,#bddbea 60%,#ffffff00 75%);filter:drop-shadow(0 0 35px #b8e7ff);animation:pulse 4s infinite alternate}.fox:before,.fox:after{content:"";position:absolute;top:-20%;width:40%;height:48%;background:#e7f5ff;clip-path:polygon(0 100%,50% 0,100% 100%)}.fox:before{left:0}.fox:after{right:0}.hero{position:absolute;width:256px;height:256px;left:calc(50% - 128px);bottom:7%;background-image:url('assets/characters/hizuki/bluebob-v1/walk-atlas-256.png');background-size:768px 1024px;background-position:-256px 0;transform:scale(1.3);filter:drop-shadow(0 12px 14px #0008);animation:bob 2.5s ease-in-out infinite}.hero.back{background-position:-256px -256px}.hero.side{background-position:-256px -512px}.hero.large{left:calc(63% - 128px);bottom:-8%;transform:scale(2.4)}.caption{position:absolute;bottom:8%;left:7%;right:7%;font-size:clamp(15px,2.8vw,29px);letter-spacing:.08em;text-shadow:0 2px 12px #000,0 2px 25px #000}.logo{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(30px,7vw,78px);text-shadow:0 0 25px #d7859f,0 6px 14px #000;letter-spacing:.12em}.petal{position:absolute;top:-12%;left:var(--x);width:10px;height:7px;border-radius:100% 0 100% 0;background:#f6b0c8;animation:fall var(--d) linear infinite;animation-delay:var(--delay);pointer-events:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 65%,#05091480)}#controls{display:flex;gap:12px;align-items:center;width:min(98vw,1100px)}button{padding:12px 17px;border:1px solid #b08ba1;background:#703d5c;color:white;border-radius:8px;font-size:15px}input{min-width:0;flex:1;accent-color:#c7869e}small{color:#c1b4c0;text-align:center;font-size:12px}@keyframes pan{to{transform:scale(1.08) translateX(-2%)}}@keyframes sway{25%{transform:rotate(10deg)}55%{transform:rotate(-6deg)}to{transform:none}}@keyframes pulse{to{filter:brightness(1.25)}}@keyframes bob{50%{translate:0 -5px}}@keyframes water{to{background-position:0 150px}}@keyframes fall{to{transform:translate(90px,700px) rotate(550deg)}}
.bell{background:none!important;clip-path:none!important;width:15%!important;height:49%!important;left:42.5%!important;top:8%!important;background-image:url('assets/opening/v1/bell.svg')!important;background-position:center!important;background-size:contain!important;background-repeat:no-repeat!important}.bell:after{display:none!important}.tag{border:0!important;background:url('assets/opening/v1/knot-tag.svg') center/contain no-repeat!important;box-shadow:none!important;width:24%!important;height:66%!important;left:38%!important;top:15%!important;font-size:0!important}.scene:nth-child(5) .hero.large{animation:closeup 8s ease-in-out both!important;transform-origin:50% 30%!important}.scene:nth-child(5):before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff00 44%,#d7f8ffb0 50%,#ffffff00 56%,transparent 70%);background-size:300% 100%;animation:eyeFlash 8s ease-out both}.scene:nth-child(5):after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:#080d1b;animation:blinkCurtain 8s ease-in-out both}.scene:nth-child(5) .caption{z-index:4}@keyframes closeup{0%{transform:scale(2.1) translateX(6%)}35%{transform:scale(2.4) translateX(3%)}65%{transform:scale(2.6)}100%{transform:scale(2.75)}}@keyframes blinkCurtain{0%,13%{opacity:1}19%,46%{opacity:0}49%{opacity:.8}53%,100%{opacity:0}}@keyframes eyeFlash{0%,45%{background-position:130% 0;opacity:0}53%{opacity:.9}70%,100%{background-position:-100% 0;opacity:0}}@media(prefers-reduced-motion:reduce){.scene:nth-child(5):after{animation:none;opacity:0}} </style></head><body><h1>鬼哭の花契り　オープニング試作</h1><div id="stage"><div id="scenes"></div><div id="petals"></div><div class="shade"></div></div><div id="controls"><button id="play">▶ 再生</button><input id="seek" type="range" min="0" max="90" step=".1" value="0"><span id="clock">0:00</span></div><small>90秒／12カット｜背景・人物・花びらを独立アニメーション｜音楽未収録｜正式緋月スプライト再利用</small><script>
const entries=[
[0,8,'<div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="hill front"></div><div class="ground"></div><div class="path"></div><div class="house"></div><div class="house two"></div><div class="caption">花の里に、いつもの朝が来る。</div>'],
[8,15,'<div class="sky"></div><div class="house" style="left:42%;bottom:5%;transform:scale(2)"></div><div class="bell"></div><div class="caption">その日、里の鈴が鳴らなくなった。</div>'],
[15,22,'<div class="sky"></div><div class="hill"></div><div class="ground"></div><div class="house"></div><div class="caption">見慣れた道を、誰も思い出せない。</div>'],
[22,30,'<div class="sky"></div><div class="hill"></div><div class="ground"></div><div class="hero side"></div><div class="caption">緋月――忘れられた縁を追う旅人。</div>'],
[30,38,'<div class="sky dusk"></div><div class="hero large"></div><div class="caption">「みんなの記憶まで変なのね……」</div>'],
[38,45,'<div class="sky dusk"></div><div class="tag">結</div><div class="caption">一本だけ途切れた、結び札の糸。</div>'],
[45,53,'<div class="sky"></div><div class="hill"></div><div class="ground"></div><div class="caption">白妙、潮平、旅の薬師、滝童。<br>出会いが記憶を結んでいく。</div>'],
[53,61,'<div class="sky dusk"></div><div class="hill"></div><div class="hero side" style="left:18%"></div><div class="caption">緋月は、自分の足で答えを探す。</div>'],
[61,69,'<div class="sky"></div><div class="hill"></div><div class="river"></div><div class="caption">天妖の社、海の入り江、忘れの森、龍神の滝。</div>'],
[69,77,'<div class="sky dusk"></div><div class="river"></div><div class="fox"></div><div class="caption">水鏡に映る、九本の尾を持つ白い影。</div>'],
[77,84,'<div class="sky dusk"></div><div class="sun"></div><div class="hill"></div><div class="hill front"></div><div class="hero back"></div><div class="caption">「知らないまま誰かを置いていくのは、もっと嫌だから。」</div>'],
[84,90,'<div class="sky dusk"></div><div class="sun"></div><div class="hill"></div><div class="logo">鬼哭の花契り</div>']
];const root=document.querySelector('#scenes');root.innerHTML=entries.map((e,i)=>'<div class="scene" id="s'+i+'">'+e[2]+'</div>').join('');const nodes=[...root.children],p=document.querySelector('#petals');for(let i=0;i<24;i++){const x=document.createElement('i');x.className='petal';x.style.setProperty('--x',i*43%100+'%');x.style.setProperty('--d',8+i%7+'s');x.style.setProperty('--delay',-i*1.5+'s');p.appendChild(x)}
let t=0,playing=false,last=0;const play=document.querySelector('#play'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock');function render(){const h=nodes[3].querySelector('.hero');if(h){h.classList.toggle('back',t<25.3);h.classList.toggle('side',t>=25.3&&t<27.2);if(t>=27.2){h.classList.remove('side','back');}h.style.transform='scale('+(1.15+Math.min(1,(t-22)/8)*.35)+')';}nodes.forEach((n,i)=>n.classList.toggle('on',t>=entries[i][0]&&t<entries[i][1]));seek.value=t;clock.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}function frame(now){if(playing){if(last)t+=(now-last)/1000;if(t>=90){t=0;playing=false;play.textContent='▶ 再生'}render()}last=now;requestAnimationFrame(frame)}play.onclick=()=>{playing=!playing;last=0;play.textContent=playing?'Ⅱ 停止':'▶ 再生'};seek.oninput=e=>{t=+e.target.value;render()};render();requestAnimationFrame(frame);
</script></body></html>
