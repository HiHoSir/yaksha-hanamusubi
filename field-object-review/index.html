<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フィールドオブジェクト一括検査</title><style>body{margin:0;background:#141c22;color:#f4f0e7;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:900px;margin:auto;padding:14px}h1{font-size:22px}section{border:1px solid #52616a;background:#24313a;border-radius:12px;padding:14px;margin:16px 0}img{max-width:100%;max-height:230px;object-fit:contain}.art{background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 50%/24px 24px;min-height:110px;display:flex;justify-content:center;align-items:center}select,textarea,button{font:16px -apple-system,sans-serif;border-radius:8px;padding:10px}select,textarea{width:100%;box-sizing:border-box}textarea{height:65px}button{background:#e6be76;border:0;font-weight:bold}small{color:#c9d2d7}nav{position:sticky;top:0;background:#141c22;padding:10px 0;z-index:2}#summary{font-weight:bold}.meta{font-size:13px;overflow-wrap:anywhere}h2{font-size:18px}</style></head><body><main><h1>フィールドオブジェクト一括目視検査</h1><p>既存のPNGを無加工で表示します。各画像を確認し、判定・コメントを入力してJSONを一括保存してください。村専用・旧素材は混ぜず、現行フィールド描画コードで参照されるv3画像を対象にしています。配置実態が未確定のものは「要確認」として扱います。</p><nav><div id="summary"></div><button id="export">全判定をJSON保存</button></nav><div id="items"></div><p><small>画像サイズは読み込んだPNGの実寸です。占有マスと当たり判定はPNGの大きさから逆算しません。判定は端末内に一時保存されます。ゲーム本体は変更しません。</small></p></main><script>
const items=[{"id":"newVillage","name":"鬼灯の里","path":"assets/field-map-objects-v3/village.png"},{"id":"newHouse","name":"家","path":"assets/field-map-objects-v3/house.png"},{"id":"newTorii","name":"鳥居","path":"assets/field-map-objects-v3/torii.png"},{"id":"newCaveLarge","name":"洞窟","path":"assets/field-map-objects-v3/cave-large.png"},{"id":"newFort","name":"砦","path":"assets/field-map-objects-v3/fort.png"},{"id":"newPagoda","name":"塔","path":"assets/field-map-objects-v3/pagoda.png"},{"id":"newTrees","name":"木","path":"assets/field-map-objects-v3/trees.png"},{"id":"newMountainSmall","name":"小山","path":"assets/field-map-objects-v3/mountain-small.png"},{"id":"newMountainLarge","name":"大山","path":"assets/field-map-objects-v3/mountain-large.png"},{"id":"stoneMonument","name":"石碑","path":"assets/field-map-objects-v3/stone-monument.png"},{"id":"sacredTree","name":"御神木","path":"assets/field-map-objects-v3/sacred-tree.png"},{"id":"castle","name":"城","path":"assets/field-map-objects-v3/castle.png"},{"id":"shrine","name":"社","path":"assets/field-map-objects-v3/shrine.png"}];const choices=["未判定","採用","修正","不要","村専用","旧素材"];const state={};try{Object.assign(state,JSON.parse(localStorage.getItem("field-object-review-v2")||"{}"))}catch(e){}
const root=document.getElementById("items");function save(){try{localStorage.setItem("field-object-review-v2",JSON.stringify(state))}catch(e){}document.getElementById("summary").textContent=items.filter(x=>state[x.id]?.decision&&state[x.id].decision!=="未判定").length+" / "+items.length+" 件判定済み";}
for(let i=0;i<items.length;i++){let x=items[i],s=state[x.id]||{};let el=document.createElement("section");el.innerHTML='<h2>'+(i+1)+'．'+x.name+'（'+x.id+'）</h2><div class="art"><img loading="lazy" alt="'+x.name+'"></div><p class="meta">'+x.path+'</p><p class="meta size">画像寸法：読込待ち</p><p class="meta">占有マス・接地位置・通行判定：コード上の整数マス指定を要確認（画像から逆算しない）</p><label>判定<select></select></label><label>メモ<textarea placeholder="接地位置・重複・用途など"></textarea></label>';root.appendChild(el);const img=el.querySelector("img");img.src="../"+x.path;img.onload=()=>{el.querySelector(".size").textContent="画像寸法："+img.naturalWidth+" × "+img.naturalHeight+" px";state[x.id]={...state[x.id],imageSize:{width:img.naturalWidth,height:img.naturalHeight}};save()};img.onerror=()=>el.querySelector(".size").textContent="画像読込失敗（要確認）";let select=el.querySelector("select");choices.forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;select.appendChild(o)});select.value=s.decision||"未判定";select.onchange=()=>{state[x.id]={...state[x.id],decision:select.value};save()};let ta=el.querySelector("textarea");ta.value=s.notes||"";ta.oninput=()=>{state[x.id]={...state[x.id],notes:ta.value};save()};}save();
document.getElementById("export").onclick=()=>{const payload={schema:"field-object-review-v2",repository:"HiHoSir/yaksha-hanamusubi",scope:"field-map-objects-v3 referenced by landscape.js",tileSize:32,exportedAt:new Date().toISOString(),reviews:items.map(x=>({...x,imageSize:state[x.id]?.imageSize||null,footprintCells:null,groundAnchorCells:null,collisionCells:null,decision:state[x.id]?.decision||"未判定",notes:state[x.id]?.notes||""}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="field-object-reviews.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
</script></body></html>
