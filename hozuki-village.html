<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17281d"><title>鬼灯村 — 緋月の歩行マップ</title><link rel="stylesheet" href="css/hozuki-village.css?v=hv-1"></head>
<body><main id="village"><header><div><h1>鬼灯村</h1><span class="subtitle">緋月の歩行マップ</span></div><nav aria-label="表示"><button id="follow" disabled>緋月へ</button><button id="overview" aria-pressed="false" disabled>全景</button><button id="settings" aria-expanded="false" disabled>設定</button></nav></header>
<div id="scene"><canvas id="map" aria-label="鬼灯村。地面をタップして移動" tabindex="0"></canvas><div id="loading" role="status">鬼灯村の旅支度中…</div><div id="hint" role="status" aria-live="polite"></div></div>
<section id="options" hidden aria-label="表示設定"><h2>表示と検査</h2><label><input id="grid" type="checkbox">マス目</label><label><input id="collision" type="checkbox">歩行判定</label><label><input id="markers" type="checkbox">入口</label><p id="position">読込中</p><p id="audit"></p><p>通常のカメラはフィールドの緋月と同じ表示サイズが基準です。「全景」で村全体を確認できます。</p><p>今回は村内の歩行マップです。屋内・フィールドへの遷移、NPC・イベントは未接続です。本編のセーブは変更しません。</p><small>BUILD hv-1 · 21×18マス · 32px</small><button id="closeSettings">閉じる</button></section>
<footer><div class="dpad" aria-label="十字キー"><button data-dir="u" aria-label="上へ" disabled>▲</button><button data-dir="l" aria-label="左へ" disabled>◀</button><span aria-hidden="true">✦</span><button data-dir="r" aria-label="右へ" disabled>▶</button><button data-dir="d" aria-label="下へ" disabled>▼</button></div><div class="actions"><p>タップで移動<br><span>十字キーは長押しできます</span></p><div><button id="reset" disabled>出発点へ</button><button id="inspect" disabled>調べる</button></div></div></footer>
</main><script src="js/settlement-map/catalog.js?v=hv-1"></script><script src="js/settlement-map/autotile.js?v=hv-1"></script><script src="js/settlement-map/model.js?v=hv-1"></script><script src="js/settlement-map/render.js?v=hv-1"></script><script src="js/settlement-map/walk.js?v=hv-1"></script><script src="js/hozuki-village-core.js?v=hv-1"></script><script src="js/hozuki-village.js?v=hv-1"></script></body></html>
