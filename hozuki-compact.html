<main><h1>鬼灯の里・トップビュー <span class="badge">配置比較 v2</span></h1><p>里専用の画像で構成。フィールド用タイル不使用。24×20マス・1マス32px。建物2×2〜3×2マス、小物・樹木1マス。緋月は可視全体を1マス内に配置。マップをタップして移動できます。</p><small>本編とは独立した素材・歩行検査です。会話・室内遷移・セーブには接続していません。</small>
<div class="panel controls"><button id="view">緋月を拡大</button><label><input id="grid" type="checkbox" checked>マス目</label><label><input id="collision" type="checkbox">通行不可</label><label><input id="centers" type="checkbox" checked>位置の目印</label><button id="reset">南入口へ</button></div>
<div class="panel"><canvas id="map" width="384" height="320" aria-label="鬼灯の里の検査マップ"></canvas><div id="readout" role="status">画像を読み込み中…</div></div>
<div class="panel controls"><select id="target" aria-label="経路検査の行き先"></select><button id="go">ここへ歩く</button><button id="place">ここに配置</button></div>
<div class="pad" aria-label="十字キー"><button style="grid-area:1/2" data-step="0,-1" aria-label="上">↑</button><button style="grid-area:2/1" data-step="-1,0" aria-label="左">←</button><button style="grid-area:2/3" data-step="1,0" aria-label="右">→</button><button style="grid-area:3/2" data-step="0,1" aria-label="下">↓</button></div>
<p><small>赤：通行不可セル／黄：緋月のセル中心／水色：可視の足元。物体との前後切替はありません。全景では緋月も縮小されます。「緋月を拡大」でマス目の実寸を確認できます。</small></p><p><a href="docs/hozuki-compact-review.md">仕様と検査記録</a></p></main>
