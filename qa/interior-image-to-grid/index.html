<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>間取り画像→32px配置案</title>
<style>body{font:15px system-ui;background:#142023;color:#f1f3ed;max-width:900px;margin:auto;padding:16px}button,input,select{font:inherit;padding:9px;margin:5px;background:#344548;color:white;border:1px solid #82928d;border-radius:7px}canvas{max-width:100%;image-rendering:pixelated;touch-action:none;background:#344}label{display:inline-block}pre{overflow:auto;white-space:pre-wrap;background:#233;padding:12px}a{color:#addfd0}</style>
<h1>画像→32px間取り配置案</h1><p>元画像を読み込み、32pxセル単位で床・壁を推定します。物体は手動で前景候補として指定します。推定は下書きであり、壁・家具の確定判定ではありません。セルをタップして修正できます。</p>
<label>画像 <input id="file" type="file" accept="image/*"></label><label>列 <input id="cols" type="number" value="10" min="2" max="64" style="width:70px"></label><label>行 <input id="rows" type="number" value="8" min="2" max="64" style="width:70px"></label>
<p>1. 元画像の「板の間」「土間」「壁」をそれぞれタップして色見本を登録します。2. 自動判別。3. セルを修正。4. JSON出力。</p>
<label>操作 <select id="mode"><option value="wood">板の間の色見本</option><option value="road">土間の色見本</option><option value="wall">壁の色見本</option><option value="paint-wood">板の間を塗る</option><option value="paint-road">土間を塗る</option><option value="paint-wall">壁を塗る</option><option value="paint-raised">上がり框を塗る</option><option value="paint-entrance">出入口を塗る</option><option value="paint-object">物体（前景候補）を塗る</option></select></label>
<button id="detect">色見本から自動推定</button><button id="export">配置JSONを保存</button><button id="suggest">レイヤー構成を提案</button><button id="pngs">透過PNGを一括保存</button><label>マップ種類 <select id="mapKind"><option value="interior">室内</option><option value="forest">森</option><option value="mountain">山</option><option value="cave">洞窟</option><option value="field">フィールド</option><option value="settlement">集落</option></select></label>
<p id="info">画像未選択。茶店の既存JSONを先に読み込んで検査できます。</p>
<canvas id="canvas" width="320" height="256"></canvas><pre id="summary"></pre><pre id="proposal"></pre>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let image=null,raw=null,tiles=[],samples={},w=10,h=8;
const labels={wood:'板の間',road:'土間',wall:'壁',raised:'上がり框',entrance:'出入口',object:'物体候補'};
function size(){w=Math.max(2,Math.min(64,+$('cols').value||10));h=Math.max(2,Math.min(64,+$('rows').value||8));canvas.width=w*32;canvas.height=h*32;if(tiles.length!==w*h)tiles=Array(w*h).fill('road');draw()}
function draw(){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);if(image)ctx.drawImage(image,0,0,canvas.width,canvas.height);
for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=tiles[y*w+x];ctx.fillStyle=({wood:'#c59b52',road:'#8d714d',wall:'#513727',raised:'#d7c092',entrance:'#6babb7',object:'#a84dca'})[t]+'88';ctx.fillRect(x*32,y*32,32,32);ctx.strokeStyle='#f0f0f088';ctx.strokeRect(x*32+.5,y*32+.5,31,31)}
$('summary').textContent=Object.entries(labels).map(([t,name])=>name+': '+tiles.filter(v=>v===t).length+'マス').join(' / ')+'\n色見本: '+Object.entries(samples).map(([k,v])=>k+'='+v.join(',')).join(' ; ')}
function pix(x,y){const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;const c=temp.getContext('2d',{willReadFrequently:true});c.drawImage(image,0,0,temp.width,temp.height);return [...c.getImageData(x,y,1,1).data].slice(0,3)}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=Math.min(w-1,Math.floor((e.clientX-r.left)/r.width*w)),y=Math.min(h-1,Math.floor((e.clientY-r.top)/r.height*h)),m=$('mode').value;
if(m.startsWith('paint-'))tiles[y*w+x]=m.slice(6);else if(image)samples[m]=pix(Math.round((e.clientX-r.left)/r.width*(w*32)),Math.round((e.clientY-r.top)/r.height*(h*32)));draw()});
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{image=im;URL.revokeObjectURL(url);tiles=[];size();$('info').textContent='画像を読み込みました。3種類の色見本をタップで登録してください。'};im.src=url};
for(const id of ['cols','rows'])$(id).onchange=size;
$('detect').onclick=()=>{if(!image||!['wood','road','wall'].every(t=>samples[t])){$('info').textContent='画像と3種類の色見本が必要です';return}
const t=document.createElement('canvas');t.width=w*32;t.height=h*32;const c=t.getContext('2d',{willReadFrequently:true});c.drawImage(image,0,0,t.width,t.height);const rgba=c.getImageData(0,0,t.width,t.height).data;
for(let y=0;y<h;y++)for(let x=0;x<w;x++){let r=0,g=0,b=0,n=0;for(let yy=8;yy<24;yy+=3)for(let xx=8;xx<24;xx+=3){const i=((y*32+yy)*t.width+x*32+xx)*4;r+=rgba[i];g+=rgba[i+1];b+=rgba[i+2];n++}const rgb=[r/n,g/n,b/n];tiles[y*w+x]=Object.keys(samples).reduce((best,k)=>{const d=samples[k].reduce((s,v,i)=>s+(v-rgb[i])**2,0);return d<best.d?{k,d}:best},{k:'road',d:Infinity}).k}
$('info').textContent='色に基づく仮配置を作成しました。見た目の陰影や家具で誤判定するため、必ず修正してください。';draw()};
$('export').onclick=()=>{const data={version:2,project:'yaksha-hanamusubi',room:'custom',tileSize:32,width:w,height:h,notes:'IMAGE_DRAFT: visual color classification; requires manual approval',tiles:Array.from({length:h},(_,y)=>tiles.slice(y*w,(y+1)*w))};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='room-layout-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
// Generic layered export: one coordinate system, transparent RGBA images, no independent cropping.
const presets={
 interior:{base:'床',structure:'壁・柱',foreground:'前景'},
 forest:{base:'地面',structure:'樹木・岩',foreground:'樹冠・前景'},
 mountain:{base:'地面',structure:'崖・岩',foreground:'高所前景'},
 cave:{base:'地面',structure:'洞窟壁',foreground:'暗部・前景'},
 field:{base:'地形',structure:'障害物',foreground:'前景'},
 settlement:{base:'地面',structure:'建築物',foreground:'前景'}
};
function proposed(){
 const kind=$('mapKind').value,p=presets[kind],counts={};
 for(const t of tiles)counts[t]=(counts[t]||0)+1;
 const layers=[{id:'base',label:p.base,cells:tiles.length-(counts.wall||0)-(counts.object||0)},{id:'structure',label:p.structure,cells:counts.wall||0},{id:'foreground',label:p.foreground,cells:counts.object||0}];
 const result={kind,tileSize:32,width:w,height:h,canvas:[w*32,h*32],origin:[0,0],layers,warning:'Color segmentation only. Object cells must be annotated manually. Background behind masked objects is NOT reconstructed. Collision and depth are unverified.'};
 $('proposal').textContent=JSON.stringify(result,null,2);return result
}
$('suggest').onclick=proposed;
function saveCanvas(c,name){return new Promise(resolve=>c.toBlob(blob=>{if(!blob){resolve(false);return}const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);resolve(true)},'image/png'))}
$('pngs').onclick=async()=>{
 const manifest=proposed();
 if(!image){$('info').textContent='画像を選択してください。茶店のJSONのみでは元絵の透過分離はできません。';return}
 const src=document.createElement('canvas');src.width=w*32;src.height=h*32;const sg=src.getContext('2d');sg.drawImage(image,0,0,src.width,src.height);
 const pixels=sg.getImageData(0,0,src.width,src.height);
 // Partition by approved cell category. Every source pixel goes to exactly one layer.
 // Foreground is empty until separately annotated; do not fabricate invisible content.
 const outputs={base:document.createElement('canvas'),structure:document.createElement('canvas'),foreground:document.createElement('canvas')};
 for(const [key,c] of Object.entries(outputs)){c.width=src.width;c.height=src.height;const d=new ImageData(new Uint8ClampedArray(pixels.data),src.width,src.height);
  for(let y=0;y<src.height;y++)for(let x=0;x<src.width;x++){
   const t=tiles[Math.floor(y/32)*w+Math.floor(x/32)],target=t==='wall'?'structure':t==='object'?'foreground':'base',i=(y*src.width+x)*4;
   if(target!==key)d.data[i+3]=0;
  }c.getContext('2d').putImageData(d,0,0);
 }
 for(const [key,c] of Object.entries(outputs))await saveCanvas(c,'map-'+key+'.png');
 const data={...manifest,tiles:Array.from({length:h},(_,y)=>tiles.slice(y*w,(y+1)*w)),method:'original-image cell masking; no reconstruction of hidden pixels',objects:tiles.flatMap((t,i)=>t==='object'?[{tileX:i%w,tileY:Math.floor(i/w),footprint:[[i%w,Math.floor(i/w)]],depthAnchor:null,collision:'unreviewed'}]:[])};
 const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='map-layer-manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
 $('info').textContent='3枚の共通サイズ透過PNGとマニフェストを出力しました。物体セルを塗った場合は前景に分離します。隠れた床は復元されません。';
};
size();fetch('../../data/interiors/teahouse-layout-10x8.json').then(r=>r.json()).then(d=>{if(image)return;tiles=d.tiles.flat().map(t=>['wood','table','cushion'].includes(t)?'wood':t==='wall'?'wall':t==='raised'?'raised':t==='entrance'?'entrance':'road');draw();$('info').textContent='茶店JSONの床・壁を初期表示しています。画像を選ぶと色見本による推定ができます。'}).catch(()=>{});
})();
</script></html>
