<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天妖の社・実移動モデル検査</title><style>body{font:15px system-ui;background:#172426;color:#eee;margin:0;padding:16px}main{max-width:850px;margin:auto}canvas{width:100%;max-width:768px;border:1px solid #657;touch-action:none}button{padding:12px;margin:5px;background:#e4d2ad;border:0;border-radius:6px}pre{white-space:pre-wrap;word-break:break-word}</style><main><h1>天妖の社・移動モデル検査</h1><p>v3構造JSONを読み込み、ゲーム本編と同じ <code>YK_ELEVATION.canMove</code> を使って入口から本殿前までの経路を検査します。色分けは地形データであり、完成画像ではありません。</p><input type="file" id="file" accept=".json,application/json"><button id="run">検査する</button><button id="step">経路を一歩進む</button><canvas id="map" width="768" height="768"></canvas><pre id="status">v3構造JSONを選択してください。</pre><script src="../../js/elevation-model.js"></script><script>
const $=id=>document.getElementById(id),c=$('map'),ctx=c.getContext('2d');let src=null,model=null,route=[],index=0;\n
$('file').onchange=async e=>{try{src=JSON.parse(await e.target.files[0].text());$('status').textContent='読み込み完了: '+src.name+' / '+src.width+'×'+src.height;run()}catch(err){$('status').textContent='JSON読み込み失敗: '+err.message}};
function makeModel(d){if(d.width!==48||d.height!==48||d.tileSize!==32||d.tiles.length!==48||d.elevation.length!==48)throw Error('48×48/32pxのv3形式が必要');const m=d.tiles.map(row=>{if(row.length!==48)throw Error('不正な行幅');return row.map(t=>t==='river'?'sea':t==='forest'?'forest':t==='grass'?'grass':'road')});m.heights=d.elevation;m.ramps=d.ramps;m.cornerCut=30;m.objects=d.objectContactCandidates;m.occupiedTiles=new Set();for(const o of m.objects){if(o.collision!=='blocked')continue;for(let y=o.y;y<o.y+o.height;y++)for(let x=o.x;x<o.x+o.width;x++)m.occupiedTiles.add(x+','+y)}YK_ELEVATION.prepare(m);return m}
const mid=([x,y])=>[x*32+16,y*32+16];
function search(m,start,end){const q=[start],seen=new Set([start.join(',')]),prev=new Map();for(let i=0;i<q.length;i++){const p=q[i];if(p[0]===end[0]&&p[1]===end[1]){let a=p,out=[p];while(prev.has(a.join(','))){a=prev.get(a.join(','));out.push(a)}return {route:out.reverse(),seen:seen.size}}for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){const n=[p[0]+dx,p[1]+dy],key=n.join(',');if(n[0]<0||n[1]<0||n[0]>=48||n[1]>=48||seen.has(key))continue;const [x,y]=mid(p),[nx,ny]=mid(n);if(YK_ELEVATION.canMove(m,x,y,nx,ny)){seen.add(key);prev.set(key,p);q.push(n)}}}return {route:[],seen:seen.size}}
function render(){if(!src)return;const colors={river:'#438bb6',forest:'#426d50',grass:'#92bb6e',stone:'#c6b594','stairs-upper':'#dfb47e','stairs-lower':'#c58b59'};for(let y=0;y<48;y++)for(let x=0;x<48;x++){ctx.fillStyle=colors[src.tiles[y][x]]||'#a49b80';ctx.fillRect(x*16,y*16,16,16);if(model.occupiedTiles.has(x+','+y)){ctx.fillStyle='#b9474e';ctx.fillRect(x*16,y*16,16,16)}}ctx.strokeStyle='#ffe38a';ctx.lineWidth=4;ctx.beginPath();route.forEach((p,i)=>{const x=p[0]*16+8,y=p[1]*16+8;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();if(route.length){const p=route[Math.min(index,route.length-1)];ctx.fillStyle='white';ctx.beginPath();ctx.arc(p[0]*16+8,p[1]*16+8,7,0,Math.PI*2);ctx.fill()}}
function run(){if(!src)return;try{model=makeModel(src);const problems=YK_ELEVATION.validate(model);const result=search(model,src.spawn,src.mainShrineApproach);route=result.route;index=0;render();$('status').textContent='本編 YK_ELEVATION.canMove 検査\n経路: '+(route.length?'接続':'不通')+'\n経路長: '+Math.max(0,route.length-1)+'歩\n到達検査マス: '+result.seen+'\n高さ・坂モデルエラー: '+problems.length+'件\n'+problems.slice(0,25).join('\n')+'\n※実機Safariでのプレイ・ゲーム画面への組込・カメラ表示は未検査';}catch(e){$('status').textContent='検査失敗: '+e.message}}
$('run').onclick=run;$('step').onclick=()=>{if(!route.length)return;index=(index+1)%route.length;render()};
</script></main></html>
