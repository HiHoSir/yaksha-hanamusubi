<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天妖の社｜既存絵を使った構造化試作</title>
<style>body{margin:0;background:#152222;color:#f3eee4;font:15px system-ui}main{max-width:920px;margin:auto;padding:15px}canvas{width:100%;max-width:768px;image-rendering:auto;touch-action:manipulation;border:1px solid #64706d}button{padding:10px;margin:4px;border-radius:7px;background:#e8d5ae;border:0}pre{white-space:pre-wrap;word-break:break-word;background:#263637;padding:10px}a{color:#a5e9de}label{display:inline-block;margin:5px}</style>
<main><h1>天妖の社｜既存マップからの構造化試作</h1><p>現行ゲームが使用している「天妖の社」の背景画像と通行ポリゴンをそのまま読み込みます。32pxグリッドに変換した結果を重ね、セルをタップして修正できます。新しい画像生成やゲーム本編の変更はしていません。</p>
<label><input type="checkbox" id="grid" checked>32pxグリッド</label><label><input type="checkbox" id="walk" checked>通行判定</label><label><input type="checkbox" id="markers" checked>NPC・開始地点</label><p><button id="edit">セル編集：オフ</button><button id="export">構造JSONを保存</button><button id="reset">元の通行判定に戻す</button><button id="objectMode">物体範囲：オフ</button><select id="objectType"><option value="shrine-building">社殿</option><option value="torii">鳥居</option><option value="stairs">石段</option><option value="tree">樹木</option><option value="lantern">灯籠</option><option value="other">その他</option></select><button id="clearObjects">物体範囲を消去</button></p>
<canvas id="canvas" width="768" height="768"></canvas><pre id="status">読み込み中</pre>
<p>この試作は既存イラストを32px単位の通行可能セルに変換したものです。鳥居・社殿・石段・桜などの輪郭を自動認識したものではありません。物体の矩形占有候補は手動指定できますが、輪郭・前後遮蔽・カメラ投影への移植は未対応です。物体範囲は開始セルと終了セルを順にタップしてください。</p>
<script src="../../js/destination-scenes.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),size=24,step=32,layout=YK_DESTINATION_SCENES.layouts.shrine;
const original=layout.floor,inside=(x,y)=>{let hit=false;for(let i=0,j=original.length-1;i<original.length;j=i++){const a=original[i],b=original[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])hit=!hit}return hit};
const create=()=>Array.from({length:size},(_,y)=>Array.from({length:size},(_,x)=>inside(x*step+16,y*step+16)?1:0));
let cells=create(),editing=false,objectMode=false,selection=null,objects=[],img=new Image(),loaded=false;
const markers=[{name:'開始位置',x:layout.spawn[0],y:layout.spawn[1],color:'#ffe38a'},{name:'白妙',x:515,y:370,color:'#e0a8fa'},{name:'社守',x:210,y:530,color:'#92d4fa'}];
function reachable(){const sx=Math.floor(layout.spawn[0]/32),sy=Math.floor(layout.spawn[1]/32),seen=new Set(),q=[];if(cells[sy]?.[sx]){seen.add(sx+','+sy);q.push([sx,sy])}for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(a>=0&&a<size&&b>=0&&b<size&&cells[b][a]&&!seen.has(k)){seen.add(k);q.push([a,b])}}}return seen}
function render(){ctx.clearRect(0,0,768,768);if(loaded)ctx.drawImage(img,0,0,768,768);else{ctx.fillStyle='#485654';ctx.fillRect(0,0,768,768)}
const seen=reachable();let total=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const open=cells[y][x];if(open)total++;if($('walk').checked){ctx.fillStyle=open?(seen.has(x+','+y)?'rgba(57,221,142,.16)':'rgba(255,170,40,.45)'):'rgba(206,52,52,.22)';ctx.fillRect(x*step,y*step,step,step)}if($('grid').checked){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=.65;ctx.strokeRect(x*step+.5,y*step+.5,step,step)}}
for(const o of objects){ctx.fillStyle='rgba(255,205,64,.20)';ctx.fillRect(o.x*32,o.y*32,o.width*32,o.height*32);ctx.strokeStyle='#ffd34a';ctx.lineWidth=3;ctx.strokeRect(o.x*32+1.5,o.y*32+1.5,o.width*32-3,o.height*32-3);ctx.fillStyle='#ffeab2';ctx.font='bold 14px system-ui';ctx.fillText(o.type,o.x*32+3,o.y*32+15)}
if(selection){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.strokeRect(selection.x*32+2,selection.y*32+2,28,28)}
if($('markers').checked)for(const m of markers){ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(m.x,m.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.stroke();ctx.font='bold 15px system-ui';ctx.strokeText(m.name,m.x+10,m.y-10);ctx.fillText(m.name,m.x+10,m.y-10)}
$('status').textContent='現行素材：assets/scenes/destinations-v1/shrine.webp\n原本通行領域：js/destination-scenes.js / shrine.floor\n32pxセル：24×24、通行可能 '+total+'、開始位置から到達可能 '+seen.size+'\n登録した物体範囲：'+objects.length+'件。画像から自動抽出した輪郭ではありません。\n※元の判定はピクセル単位の多角形です。グリッド変換で境界の形は変わります。';}
for(const id of ['grid','walk','markers'])$(id).onchange=render;
$('edit').onclick=()=>{editing=!editing;if(editing){objectMode=false;selection=null;$('objectMode').textContent='物体範囲：オフ'}$('edit').textContent='セル編集：'+(editing?'オン':'オフ')};
$('objectMode').onclick=()=>{objectMode=!objectMode;if(objectMode){editing=false;$('edit').textContent='セル編集：オフ'}selection=null;$('objectMode').textContent='物体範囲：'+(objectMode?'オン':'オフ');render()};
$('clearObjects').onclick=()=>{objects=[];selection=null;render()};
c.onclick=e=>{const rect=c.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left)/rect.width*size),y=Math.floor((e.clientY-rect.top)/rect.height*size);if(x<0||x>=size||y<0||y>=size)return;if(objectMode){if(!selection){selection={x,y}}else{const x0=Math.min(selection.x,x),y0=Math.min(selection.y,y),x1=Math.max(selection.x,x),y1=Math.max(selection.y,y);objects.push({id:'object-'+(objects.length+1),type:$('objectType').value,x:x0,y:y0,width:x1-x0+1,height:y1-y0+1,depthAnchor:null,collision:'unreviewed',mask:'not-extracted'});selection=null}render();return}if(!editing)return;if(cells[y]?.[x]!==undefined){cells[y][x]=1-cells[y][x];render()}};
$('reset').onclick=()=>{cells=create();render()};
$('export').onclick=()=>{const data={schema:'shrine-map-draft-v1',area:'shrine',name:'天妖の社',sourceImage:'assets/scenes/destinations-v1/shrine.webp',sourceCollision:'js/destination-scenes.js / shrine.floor',tileSize:32,width:24,height:24,walkable:cells,originalFloorPolygon:original,spawn:layout.spawn,objects,objectExtractionStatus:'manual bounding rectangles only; no alpha masks or depth anchors',npcs:markers.slice(1).map(({name,x,y})=>({name,x,y})),notes:['既存イラスト再利用','グリッド境界は近似','物体の占有と遮蔽は未検査']};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='tenyo-shrine-map-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
img.onload=()=>{loaded=true;render()};img.onerror=()=>{$('status').textContent='背景画像の読み込みに失敗しました';render()};img.src='../../assets/scenes/destinations-v1/shrine.webp';render();
})();
</script></main></html>
