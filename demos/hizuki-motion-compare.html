<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>緋月 戦闘モーション比較</title><style>*{box-sizing:border-box}body{margin:0;background:#121522;color:#f3f0eb;font-family:system-ui,sans-serif}header{padding:14px 18px}h1{font-size:18px;margin:0 0 7px}p{font-size:12px;color:#b9bdcb;margin:0}nav{display:flex;gap:8px;padding:10px 15px;flex-wrap:wrap}button{font-size:14px;color:white;background:#30374d;border:1px solid #59627c;border-radius:8px;padding:9px 13px}button[aria-pressed=true]{background:#586a9b}.stage{height:min(65vh,540px);min-height:300px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 75%,#4d5b5a,#222d39 65%,#151b29);border-top:1px solid #404b5e;border-bottom:1px solid #404b5e}.stage img{position:absolute;left:-12vw;bottom:-27vh;width:min(88vw,610px);height:105vh;object-fit:contain;object-position:left bottom;pointer-events:none;filter:drop-shadow(1px 2px 3px #12162499)}@media(orientation:landscape){.stage img{left:-4vw;bottom:-26vh;width:50vw;height:125vh}}.stage span{position:absolute;right:12px;top:12px;background:#141a27cc;padding:5px 9px;border-radius:6px;font-size:12px}footer{padding:12px 16px;font-size:12px;color:#b9bdcb}#error{color:#ffbdaf}</style><header><h1>緋月・戦闘モーション比較デモ</h1><p>既存原画3枚／本編と同じ表示サイズ指定／本編には未適用</p></header><nav><button id="attack" aria-pressed="true">攻撃</button><button id="skill" aria-pressed="false">術</button><button id="instant" aria-pressed="true">従来：瞬時切替</button><button id="smooth" aria-pressed="false">補間：75ms</button><button id="play">再生</button></nav><div class="stage"><img id="a" alt="緋月の戦闘動作"><img id="b" alt="" style="opacity:0"><span id="state">準備中</span></div><footer>※短いクロスフェードの比較です。関節・衣装のメッシュ変形は行いません。<div id="error"></div></footer><script>const files={attack:["attack-01.png","attack-02.png","attack-03.png"].map(x=>"../assets/characters/hizuki/battle-attack-v1/"+x),skill:["skill-01.PNG","skill-02.PNG","skill-03.png"].map(x=>"../assets/characters/hizuki/battle-skill-v1/"+x)};let kind="attack",smooth=false,playing=false;const A=document.querySelector("#a"),B=document.querySelector("#b"),state=document.querySelector("#state");const cache={};for(const [k,arr] of Object.entries(files)){cache[k]=arr.map(src=>{const im=new Image();im.src=src;im.onerror=()=>document.querySelector("#error").textContent="画像を読み込めません: "+src;return im})}function buttons(){for(const id of ["attack","skill","instant","smooth"])document.getElementById(id).setAttribute("aria-pressed",String(id===kind||(id==="smooth"&&smooth)||(id==="instant"&&!smooth)))}function show(n){A.src=files[kind][n];A.style.opacity=1;B.style.opacity=0;state.textContent=(kind==="attack"?"攻撃":"術")+" "+(n+1)+"/3"}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function run(){if(playing)return;playing=true;document.querySelector("#play").disabled=true;const k=kind,m=smooth;const frames=files[k];A.src=frames[0];A.style.opacity=1;B.style.opacity=0;state.textContent="1/3";await sleep(k==="attack"?340:220);for(let n=1;n<3;n++){B.src=frames[n];if(m){const start=performance.now();await new Promise(resolve=>{function tick(t){const x=Math.min(1,(t-start)/75),v=x*x*(3-2*x);A.style.opacity=1-v;B.style.opacity=v;if(x<1)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)})}A.src=frames[n];A.style.opacity=1;B.style.opacity=0;state.textContent=(n+1)+"/3";await sleep(k==="attack"?340:220)}await sleep(300);playing=false;document.querySelector("#play").disabled=false}document.querySelector("#attack").onclick=()=>{kind="attack";buttons();show(0)};document.querySelector("#skill").onclick=()=>{kind="skill";buttons();show(0)};document.querySelector("#instant").onclick=()=>{smooth=false;buttons()};document.querySelector("#smooth").onclick=()=>{smooth=true;buttons()};document.querySelector("#play").onclick=run;buttons();show(0);</script></html>
