<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>緋月・3コマ表示時間調整</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111522;color:#f4f0e8;font-family:system-ui,-apple-system,sans-serif}header{padding:14px 16px 8px}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#bfc5d4;margin:0}nav,.settings{display:flex;gap:8px;flex-wrap:wrap;padding:9px 14px}button{border:1px solid #63718c;background:#303b56;color:#fff;border-radius:8px;padding:10px 14px;font-size:14px}button[aria-pressed=true]{background:#637eae}button:disabled{opacity:.5}.settings{background:#1c2335;align-items:center}.setting{flex:1 1 90px;min-width:88px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:#d6d9e3}.setting input{width:100%;padding:9px;background:#111827;border:1px solid #5a6982;border-radius:7px;color:white;font-size:16px}.setting small{color:#aeb8cd}.stage{height:min(57vh,480px);min-height:290px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 75%,#4c5a59,#232e39 65%,#151b29);border-top:1px solid #465166;border-bottom:1px solid #465166}.stage img{position:absolute;left:-12vw;bottom:-27vh;width:min(88vw,610px);height:105vh;object-fit:contain;object-position:left bottom;pointer-events:none;filter:drop-shadow(1px 2px 3px #12162499)}@media(orientation:landscape){.stage img{left:-4vw;bottom:-26vh;width:50vw;height:125vh}}.state{position:absolute;right:10px;top:10px;background:#101827dd;border-radius:6px;padding:7px 10px;font-size:12px}footer{padding:12px 16px;color:#bac4d4;font-size:12px}#error{color:#ffb6a8}#total{font-weight:bold;color:#fff}
</style></head><body>
<header><h1>緋月・戦闘モーション時間調整デモ</h1><p>攻撃／術の両方に適用。既存の3枚をそのまま切り替え、補間・変形・拡大縮小なし。</p></header>
<nav><button id="attack" aria-pressed="true">攻撃</button><button id="skill" aria-pressed="false">術</button><button id="play">▶ 再生</button><button id="loop" aria-pressed="false">連続再生 OFF</button></nav>
<div class="settings">
<label class="setting">モーション① <small>構え</small><input id="t0" type="number" min="0.05" max="10" step="0.05" value="0.5">秒</label>
<label class="setting">モーション② <small>動作</small><input id="t1" type="number" min="0.05" max="10" step="0.05" value="0.3">秒</label>
<label class="setting">モーション③ <small>決め</small><input id="t2" type="number" min="0.05" max="10" step="0.05" value="0.7">秒</label>
<div class="setting"><span>合計 <span id="total">1.50秒</span></span><button id="reset">初期値に戻す</button></div>
</div>
<div class="stage"><img id="hero" alt="緋月の戦闘モーション"><span class="state" id="state">準備中</span></div>
<footer>再生中に数値を変更した場合は、次回の再生から反映されます。攻撃・術はそれぞれ独立した時間設定を保存します（このページを開いている間のみ）。<div id="error"></div></footer>
<script>
"use strict";
const sources={
 attack:["attack-01.png","attack-02.png","attack-03.png"].map(x=>"../assets/characters/hizuki/battle-attack-v1/"+x),
 skill:["skill-01.PNG","skill-02.PNG","skill-03.png"].map(x=>"../assets/characters/hizuki/battle-skill-v1/"+x)
};
const images={};for(const [kind,arr] of Object.entries(sources)){images[kind]=arr.map(src=>{const img=new Image();img.src=src;img.onerror=()=>document.getElementById("error").textContent="画像を読み込めません: "+src;return img})}
const settings={attack:[.5,.3,.7],skill:[.5,.3,.7]};
let kind="attack",running=false,loop=false;
const $=id=>document.getElementById(id),hero=$("hero");
function readTimes(){return [0,1,2].map(i=>{const n=Number($("t"+i).value);return Number.isFinite(n)?Math.min(10,Math.max(.05,n)):.05})}
function sync(){settings[kind]=readTimes();$("total").textContent=settings[kind].reduce((a,b)=>a+b,0).toFixed(2)+"秒"}
function update(){for(let i=0;i<3;i++)$("t"+i).value=settings[kind][i];sync();$("attack").setAttribute("aria-pressed",String(kind==="attack"));$("skill").setAttribute("aria-pressed",String(kind==="skill"));show(0)}
function show(i){hero.src=sources[kind][i];$("state").textContent=(kind==="attack"?"攻撃":"術")+" · モーション"+(i+1)+"/3"}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function play(){if(running)return;running=true;$("play").disabled=true;do{const k=kind,t=settings[k].slice(),frames=sources[k];for(let i=0;i<3;i++){hero.src=frames[i];$("state").textContent=(k==="attack"?"攻撃":"術")+" · モーション"+(i+1)+"/3";await sleep(t[i]*1000)}if(loop)await sleep(300)}while(loop);running=false;$("play").disabled=false}
for(let i=0;i<3;i++)$("t"+i).addEventListener("input",sync);
$("attack").onclick=()=>{if(running)return;kind="attack";update()};
$("skill").onclick=()=>{if(running)return;kind="skill";update()};
$("play").onclick=play;
$("loop").onclick=()=>{loop=!loop;$("loop").textContent="連続再生 "+(loop?"ON":"OFF");$("loop").setAttribute("aria-pressed",String(loop))};
$("reset").onclick=()=>{settings[kind]=[.5,.3,.7];update()};
update();
</script></body></html>
