<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>茶店・歩行検査</title><style>*{box-sizing:border-box;-webkit-touch-callout:none}body{margin:0;background:#182126;color:#f4eedf;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}main{max-width:1000px;margin:auto;padding:12px}h1{font-size:21px;margin:5px 0}p{line-height:1.6;margin:8px 0}.view{width:100%;background:#222;overflow:hidden;border-radius:8px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}button,input{font:inherit}button{background:#405356;border:1px solid #92a6a5;color:white;border-radius:9px;min-height:48px;touch-action:none;user-select:none;-webkit-user-select:none}.options{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.pad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:50px 50px;gap:5px;justify-content:center}.pad [data-dir=u]{grid-column:2}.pad [data-dir=l]{grid-row:2;grid-column:1}.pad [data-dir=d]{grid-row:2;grid-column:2}.pad [data-dir=r]{grid-row:2;grid-column:3}#status{font-size:14px;color:#d5e8de}.note{font-size:12px;color:#bdc6c7}</style><main><h1>茶店・マス目歩行検査</h1><p>赤＝通行不可 ／ 黄枠＝現在のマス ／ 水色の点＝ヒヅキの足元</p><div class="view"><canvas id="scene" width="768" height="512"></canvas></div><div class="options"><label><input id="grid" type="checkbox" checked> マス目</label><label><input id="collision" type="checkbox" checked> 歩行判定</label><button id="reset">入口へ戻す</button></div><div class="pad"><button data-dir="u">▲</button><button data-dir="l">◀</button><button data-dir="d">▼</button><button data-dir="r">▶</button></div><p id="status">画像を読み込み中</p><p class="note">十字キー・キーボード、または床をタップして移動できます。1マス32px、SDヒヅキ28px。停止時はグラフィック全体が1マス内に収まります。検査専用で、本編のセーブは使いません。家具の切り抜き輪郭と床の補修は仮仕上げです。</p></main><script src="js/cyamise-walk-rules.js?v=5"></script><script src="js/cyamise-walk-renderer.js?v=5"></script><script src="js/cyamise-walk-test.js?v=5"></script></html>
