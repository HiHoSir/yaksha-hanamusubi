name: Battle hero visibility
on:
  pull_request:
    paths: ['js/game.js', 'css/game.css', 'index.html', 'qa/battle-*.cjs', '.github/workflows/battle-hero-layout.yml']
  push:
    branches: [main]
    paths: ['js/game.js', 'css/game.css', 'index.html', 'qa/battle-*.cjs', '.github/workflows/battle-hero-layout.yml']
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install chromium
      - name: Japanese screenshot fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - run: node qa/battle-layout.cjs --hero-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-hero-visibility
          path: qa/results/autotile/hero-*.png
          if-no-files-found: ignore
