name: Deploy production and approved improvement previews
on:
  push:
    branches:
      - main
      - improve/pixel-editor-mobile-cursor
      - improve/suspend-location-field-anchor-20261108
      - improve/interior-map-editor-32px
      - improve/front-interaction
      - improve/field-grid-alignment
      - improve/tenyo-water-gate-asset
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Optional improve/* branch to publish as an additional preview'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-site
  cancel-in-progress: false
jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Assemble production and approved preview branches
        shell: bash
        env:
          REQUESTED_PREVIEW: ${{ inputs.source_branch || '' }}
        run: |
          set -euo pipefail
          mkdir -p site
          tar -C production --exclude=.git --exclude=.github -cf - . | tar -C site -xf -
          test -f site/index.html

          # An allowlist prevents unapproved improve/* branches from becoming public.
          declare -a branches=()
          while IFS= read -r branch || [[ -n "$branch" ]]; do
            [[ -z "$branch" || "$branch" == \#* ]] && continue
            branches+=("$branch")
          done < production/docs/pages-active-previews.txt

          # This unmerged save-regression preview is assembled only on its own
          # branch push. Main's production entry and approved preview set stay intact.
          if [[ "${GITHUB_REF_NAME:-}" == "improve/suspend-location-field-anchor-20261108" ]]; then
            branches+=("improve/suspend-location-field-anchor-20261108")
          fi

          if [[ -n "$REQUESTED_PREVIEW" ]]; then
            case "$REQUESTED_PREVIEW" in
              improve/hizuki-hana-walk-toggle|improve/battle-front-center-hizuki|improve/interior-map-editor-32px|improve/pixel-editor-touch-workspace|improve/pixel-editor-mobile-cursor|improve/natural-cave-tiles)
                branches+=("$REQUESTED_PREVIEW") ;;
              *) echo "::error::Only approved isolated previews are supported; historical game snapshots are prohibited: $REQUESTED_PREVIEW"; exit 1 ;;
            esac
          fi

          declare -A seen=()
          for branch in "${branches[@]}"; do
            [[ "$branch" =~ ^improve/[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Invalid preview branch $branch"; exit 1; }
            [[ -z "${seen[$branch]:-}" ]] || continue
            seen[$branch]=1
            slug="${branch#improve/}"
            mkdir -p "site/previews/$slug"
            git -C production fetch --no-tags --depth=1 origin "refs/heads/$branch"
            git -C production archive FETCH_HEAD | tar -C "site/previews/$slug" -xf -
            rm -rf "site/previews/$slug/.github"
            # Full historical game snapshots are prohibited. Editor branches
            # may retain their relative assets, but not unrelated heavyweight
            # game media, source references and test output.
                        # Minimal real-game regression preview: share published main assets
                      # but load only the candidate game.js and save.js in an isolated
                      # path and independently namespaced browser storage. Do not deploy
                      # an entire, unreviewed game snapshot.
                      if [[ "$slug" == "suspend-location-field-anchor-20261108" ]]; then
                        stage="$(mktemp -d)"
                        mv "site/previews/$slug" "$stage/branch"
                        preview_root="site/previews/$slug"
                        mkdir -p "$preview_root/js"
                        cp production/index.html "$preview_root/index.html"
                        cp "$stage/branch/js/game.js" "$preview_root/js/game.js"
                        cp "$stage/branch/js/save.js" "$preview_root/js/save.js"
                        SLUG="$slug" python3 - <<'PY'
          import os, pathlib
          slug=os.environ["SLUG"]
          root=pathlib.Path("site/previews")/slug
          html=(root/"index.html").read_text()
          game=(root/"js/game.js").read_text()
          save=(root/"js/save.js").read_text()
          def replace_once(text, old, new, scope):
              if text.count(old)!=1:
                  raise SystemExit(f"Expected one {scope} token: {old!r}; found {text.count(old)}")
              return text.replace(old,new,1)
          # Base makes all unmodified JS/CSS/art load from the production root, while
          # the two modified scripts load from the preview path after their rewrites.
          html=replace_once(html,"<head>","<head>\n<base href=\"../../\">","preview base")
          for name in ("game","save"):
              html=replace_once(html,"src=\"js/"+name+".js?v=","src=\"previews/"+slug+"/js/"+name+".js?v=","preview script")
          html=replace_once(html,'fetch("index.html?build-check="+Date.now(),{cache:"no-store"})','fetch("previews/'+slug+'/index.html?build-check="+Date.now(),{cache:"no-store"})',"preview update check")
          html=replace_once(html,"<body>","<body>\n<div style=\"position:fixed;z-index:99999;top:0;right:0;padding:3px 8px;background:#252c35;color:white;font:11px sans-serif;pointer-events:none\" aria-label=\"QAプレビュー\">PR #42・検証用</div>","preview identity")
          old='const AUTO="yaksha_beta_auto", LEGACY="yaksha_beta", BACKUP="yaksha_beta_auto_backup", VER=14;'
          new='const AUTO="yaksha_preview_'+slug+'_auto", LEGACY="yaksha_preview_'+slug+'_legacy", BACKUP="yaksha_preview_'+slug+'_auto_backup", VER=14;'
          save=replace_once(save,old,new,"checkpoint keys including backup")
          save=save.replace("yaksha_beta_slot","yaksha_preview_"+slug+"_slot")
          if "yaksha_preview_"+slug+"_slot" not in save: raise SystemExit("Save slot namespace missing")
          for key in ("yaksha_hana_walk_field_variant_v1","yaksha_hana_walk_settlement_variant_v1","yaksha_beta_sound_preference","yk.debug.fieldCollisionOff","yk.debug.encounterOff"):
              game=replace_once(game,'"'+key+'"','"yaksha_preview_'+slug+'_'+key+'"',"game setting")
          unsafe=("yaksha_beta_auto","yaksha_beta_slot","yaksha_beta_sound_preference","yaksha_hana_walk_field_variant_v1\"","yaksha_hana_walk_settlement_variant_v1\"","\"yk.debug.fieldCollisionOff\"","\"yk.debug.encounterOff\"")
          # Exact-key guards: do not confuse scoped variants that include these strings.
          if any(x in save for x in ("yaksha_beta_auto","yaksha_beta_slot","LEGACY=\"yaksha_beta\"")):
              raise SystemExit("Production save namespace leaked into preview")
          if any(('"'+x+'"') in game for x in ("yaksha_beta_sound_preference","yaksha_hana_walk_field_variant_v1","yaksha_hana_walk_settlement_variant_v1","yk.debug.fieldCollisionOff","yk.debug.encounterOff")):
              raise SystemExit("Production settings namespace leaked into preview")
          if html.count('<base href="../../">')!=1: raise SystemExit("Missing relative preview base")
          (root/"index.html").write_text(html)
          (root/"js/game.js").write_text(game)
          (root/"js/save.js").write_text(save)
          (root/"PREVIEW.txt").write_text("QA-only commit branch: "+slug+"\nBrowser saves and preferences have isolated key names.\n")
          PY
                        rm -rf "$stage"
                        test -s "$preview_root/index.html"
                        test -s "$preview_root/js/game.js"
                        test -s "$preview_root/js/save.js"
                        echo "Isolated, minimal actual-game QA preview assembled: $preview_root"
                        continue
                      fi
                    if [[ "$slug" == "natural-cave-tiles" ]]; then
              # Publish only the standalone walking QA and its required PNGs.
              stage="$(mktemp -d)"
              mv "site/previews/$slug" "$stage/branch"
              mkdir -p "site/previews/$slug/previews" "site/previews/$slug/assets/dungeons/natural-cave-v0" "site/previews/$slug/assets/characters/hizuki/field-sd-v3"
              cp "$stage/branch/previews/natural-cave-walk.html" "site/previews/$slug/previews/"
              mkdir -p "site/previews/$slug/assets/dungeons/natural-cave-v1"
              cp "$stage/branch/assets/dungeons/natural-cave-v1/cave-transitions-up-down-exit-3x1.png" "site/previews/$slug/assets/dungeons/natural-cave-v1/"
              cp "$stage/branch/assets/dungeons/natural-cave-v0/cave-layout-20x12-candidate.png" "site/previews/$slug/assets/dungeons/natural-cave-v0/"
              cp "$stage/branch/assets/characters/hizuki/field-sd-v3/walk-atlas-32.png" "site/previews/$slug/assets/characters/hizuki/field-sd-v3/"
              rm -rf "$stage"
              test -f "site/previews/$slug/previews/natural-cave-walk.html"
              continue
            fi
            # A battle-only page, never a historical game snapshot or production save.
            # A full branch archive is staged briefly, but only 9 known public
            # files are placed in the final Pages artifact.
            if [[ "$slug" == "battle-front-center-hizuki" ]]; then
              stage="$(mktemp -d)"
              mv "site/previews/$slug" "$stage/branch"
              battle_root="site/previews/$slug"
              mkdir -p "$battle_root/assets/scenes" "$battle_root/assets/enemies" \
                       "$battle_root/assets/characters/hizuki/hana-20261107/battle"
              cp "$stage/branch/previews/battle-front-center-hizuki.html" "$battle_root/index.html"
              cp "$stage/branch/assets/scenes/battle-grass-v1.png" "$battle_root/assets/scenes/"
              cp "$stage/branch/assets/enemies/redoni.png" "$battle_root/assets/enemies/"
              for pose in idle attack skill guard hit victory; do
                cp "$stage/branch/assets/characters/hizuki/hana-20261107/battle/battle-$pose-512.png" \
                   "$battle_root/assets/characters/hizuki/hana-20261107/battle/"
              done
              rm -rf "$stage"
              test -s "$battle_root/index.html"
              test -s "$battle_root/assets/characters/hizuki/hana-20261107/battle/battle-victory-512.png"
              if grep -qi 'localStorage' "$battle_root/index.html"; then
                echo "::error::Battle preview must not use or change production saves"; exit 1
              fi
              echo "Public isolated battle-only preview: $battle_root"
              continue
            fi
            # Minimal isolated 4-way walk QA: only approved public maps/sprites,
            # no save-data or full game archive in the deployed preview folder.
            if [[ "$slug" == "hizuki-hana-walk-toggle" ]]; then
              stage="$(mktemp -d)"
              mv "site/previews/$slug" "$stage/branch"
              walk_root="site/previews/$slug"
              mkdir -p "$walk_root/js" "$walk_root/assets/maps/hozuki-village-v1" \
                       "$walk_root/assets/characters/hizuki/field-sd-v3" \
                       "$walk_root/assets/characters/hizuki/hana-20261107/walk"
              cp "$stage/branch/previews/hizuki-hana-walk-toggle.html" "$walk_root/index.html"
              cp "$stage/branch/js/hizuki-hana-walk.js" "$walk_root/js/"
              cp "$stage/branch/assets/maps/hozuki-village-v1/ground.png" "$walk_root/assets/maps/hozuki-village-v1/"
              cp "$stage/branch/assets/maps/hozuki-village-v1/collision.json" "$walk_root/assets/maps/hozuki-village-v1/"
              cp "$stage/branch/assets/characters/hizuki/field-sd-v3/walk-atlas-32.png" "$walk_root/assets/characters/hizuki/field-sd-v3/"
              cp "$stage/branch/assets/characters/hizuki/hana-20261107/walk/walk-atlas-80x112.png" "$walk_root/assets/characters/hizuki/hana-20261107/walk/"
              rm -rf "$stage"
              test -s "$walk_root/index.html"
              test -s "$walk_root/assets/characters/hizuki/hana-20261107/walk/walk-atlas-80x112.png"
              if grep -qi 'localStorage' "$walk_root/index.html"; then
                echo "::error::Standalone walk QA must not share production save keys"; exit 1
              fi
              echo "Public standalone four-way walk preview: $walk_root"
              continue
            fi
            case "$slug" in
              interior-map-editor-32px|pixel-editor-touch-workspace|pixel-editor-mobile-cursor) ;;
              *) echo "::error::Non-editor full-game preview forbidden: $slug"; exit 1 ;;
            esac
            rm -rf "site/previews/$slug/assets/enemies" \
                   "site/previews/$slug/assets/prologue" \
                   "site/previews/$slug/design-reference" \
                   "site/previews/$slug/qa" \
                   "site/previews/$slug/docs" \
                   "site/previews/$slug/.agents"
            # Keep editor JS, CSS, tiles, NPC, map and related assets.


            SLUG="$slug" python3 - <<'PY'
          import os, pathlib, re
          slug = os.environ['SLUG']
          root = pathlib.Path('site/previews') / slug
          page = root / 'index.html'
          save = root / 'js/save.js'
          if not page.is_file() or not save.is_file():
              raise SystemExit('Missing preview entry point or save module for '+slug)
          src = save.read_text()
          src = src.replace('const AUTO="yaksha_beta_auto", LEGACY="yaksha_beta", VER=14;',
                            'const AUTO="yaksha_preview_'+slug+'_auto", LEGACY="yaksha_preview_'+slug+'_legacy", VER=14;')
          src = src.replace('"yaksha_beta_slot"', '"yaksha_preview_'+slug+'_slot"')
          if 'const AUTO="yaksha_preview_'+slug+'_auto"' not in src:
              raise SystemExit('Preview save namespace rewrite failed for '+slug)
          if '"yaksha_beta_auto"' in src or '"yaksha_beta_slot"' in src:
              raise SystemExit('Production save key leaked into preview '+slug)
          save.write_text(src)
          html = page.read_text()
          if re.search(r'''(?:src|href)=["']/ (?!/)'''.replace(' ', ''), html):
              raise SystemExit('Root-absolute asset path cannot be isolated in '+slug)
          (root/'PREVIEW.txt').write_text('Preview branch: '+slug+'\nProduction is isolated.\n')
          PY
          done

          if [[ -d site/previews ]]; then
            find site/previews -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
              node --check "$file"
            done
          fi
          test -f site/index.html
          test ! -d site/previews/sd-all-maps
          test ! -d site/previews/hozuki-topview
          test ! -d site/previews/ui-dpad-touch
          test ! -d site/previews/tenyo-water-gate-asset
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site')
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'Pages raw site size: {total / 1_000_000:.1f} MB')
          if total >= 900_000_000:
              raise SystemExit('Site exceeds the 900MB guardrail')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production and previews together
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify PR42 preview over public HTTP
        if: ${{ github.ref_name == 'improve/suspend-location-field-anchor-20261108' }}
        env:
          DEPLOYED_BASE: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          slug="suspend-location-field-anchor-20261108"
          base="${DEPLOYED_BASE%/}/previews/$slug"
          index="$RUNNER_TEMP/pr42-preview-index.html"
          save="$RUNNER_TEMP/pr42-preview-save.js"
          game="$RUNNER_TEMP/pr42-preview-game.js"
          ok=false
          for attempt in $(seq 1 16); do
            if curl --silent --show-error --location --fail --connect-timeout 10 "$base/index.html?qa=$GITHUB_SHA" -o "$index" \
              && grep -Fq "PR #42・検証用" "$index"; then ok=true; break; fi
            sleep 4
          done
          test "$ok" = true
          grep -Fq '<base href="../../">' "$index"
          grep -Fq "src=\"previews/$slug/js/save.js?v=" "$index"
          grep -Fq "src=\"previews/$slug/js/game.js?v=" "$index"
          curl --silent --show-error --location --fail "$base/js/save.js?qa=$GITHUB_SHA" -o "$save"
          curl --silent --show-error --location --fail "$base/js/game.js?qa=$GITHUB_SHA" -o "$game"
          grep -Fq "const AUTO=\"yaksha_preview_${slug}_auto\"" "$save"
          grep -Fq "BACKUP=\"yaksha_preview_${slug}_auto_backup\"" "$save"
          grep -Fq "yaksha_preview_${slug}_slot" "$save"
          grep -Fq "yaksha_preview_${slug}_yaksha_beta_sound_preference" "$game"
          if grep -Fq 'const AUTO="yaksha_beta_auto"' "$save"; then exit 1; fi
          if grep -Fq 'const HANA_WALK_FIELD_SETTING="yaksha_hana_walk_field_variant_v1"' "$game"; then exit 1; fi
          echo "PASS: deployed PR42 HTML + candidate JS + all scoped save keys (same-origin production data untouched)"

