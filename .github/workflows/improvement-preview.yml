name: Publish isolated branch previews
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Existing improve/* branch to preview'
        required: true
        type: string
  repository_dispatch:
    types: [refresh-improvement-preview]
permissions:
  contents: read
concurrency:
  group: improvement-preview
  cancel-in-progress: false
jobs:
  build-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          [[ "$SOURCE_BRANCH" =~ ^improve/[a-z0-9][a-z0-9-]*$ ]] || exit 1
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false
      - name: Build isolated preview bundle
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail
          slug="${SOURCE_BRANCH#improve/}"
          mkdir -p "preview/previews/$slug"
          tar --exclude=.git --exclude=.github --exclude=preview -cf - . | (cd "preview/previews/$slug" && tar -xf -)
          python3 - "$slug" <<'PY'
          import pathlib,sys
          slug=sys.argv[1]
          root=pathlib.Path('preview/previews')/slug
          # Preview stays an Actions artifact until isolated hosting and storage are verified.
          p=root/'index.html'
          if not p.is_file():
            raise SystemExit('Missing preview entry point')
          PY
      - name: Upload preview artifact (not public)
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: preview/
          retention-days: 7
