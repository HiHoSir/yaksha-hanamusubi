name: Build isolated improvement preview artifacts
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Existing improve/* branch to preview'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: improvement-preview
  cancel-in-progress: false
jobs:
  build-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          [[ "$SOURCE_BRANCH" =~ ^improve/[a-z0-9][a-z0-9-]*$ ]] || exit 1
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false
      - name: Build isolated preview bundle
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail
          slug="${SOURCE_BRANCH#improve/}"
          mkdir -p "preview/previews/$slug"
          tar --exclude=.git --exclude=.github --exclude=preview -cf - . | (cd "preview/previews/$slug" && tar -xf -)
          python3 - "$slug" <<'PY'
          import pathlib,sys
          slug=sys.argv[1]
          root=pathlib.Path('preview/previews')/slug
          # Each preview has separate save keys even if later hosted on the same origin.
          p=root/'index.html'
          save=root/'js/save.js'
          if not p.is_file() or not save.is_file():
            raise SystemExit('Missing preview entry point or save module')
          src=save.read_text()
          src=src.replace('const AUTO="yaksha_beta_auto", LEGACY="yaksha_beta", VER=14;',
                          'const AUTO="yaksha_preview_'+slug+'_auto", LEGACY="yaksha_preview_'+slug+'_legacy", VER=14;')
          src=src.replace('"yaksha_beta_slot"', '"yaksha_preview_'+slug+'_slot"')
          save.write_text(src)
          # A preview must never inherit production saves through old key fallbacks.
          assert 'localStorage.getItem("yaksha_beta_auto")' not in src
          assert '"yaksha_beta_slot"' not in src
          (root/'PREVIEW.txt').write_text('Preview branch: '+slug+'\\nProduction is not modified.\\n')
          PY
      - name: Upload preview artifact (not public)
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: preview/
          retention-days: 7
