name: Build isolated improvement preview artifacts
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Existing improve/* branch to preview'
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: improvement-preview
  cancel-in-progress: false
jobs:
  build-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          [[ "$SOURCE_BRANCH" =~ ^improve/[a-z0-9][a-z0-9-]*$ ]] || exit 1
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false
      - name: Build isolated preview bundle
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail
          slug="${SOURCE_BRANCH#improve/}"
          mkdir -p "preview/previews/$slug"
          tar --exclude=.git --exclude=.github --exclude=preview -cf - . | (cd "preview/previews/$slug" && tar -xf -)
          python3 - "$slug" <<'PY'
          import pathlib,sys
          slug=sys.argv[1]
          root=pathlib.Path('preview/previews')/slug
          # Each preview has separate save keys even if later hosted on the same origin.
          p=root/'index.html'
          save=root/'js/save.js'
          if not p.is_file() or not save.is_file():
            raise SystemExit('Missing preview entry point or save module')
          src=save.read_text()
          src=src.replace('const AUTO="yaksha_beta_auto", LEGACY="yaksha_beta", VER=14;',
                          'const AUTO="yaksha_preview_'+slug+'_auto", LEGACY="yaksha_preview_'+slug+'_legacy", VER=14;')
          src=src.replace('"yaksha_beta_slot"', '"yaksha_preview_'+slug+'_slot"')
          save.write_text(src)
          # Reject absolute root asset paths, which would escape the preview folder.
          html=p.read_text()
          import re
          if re.search(r'(?:src|href)=[\\\"\\\']/(?!/)',html):
            raise SystemExit('Root-absolute asset URL cannot be isolated')
          # A preview must never inherit production saves through old key fallbacks.
          assert 'localStorage.getItem("yaksha_beta_auto")' not in src
          assert '"yaksha_beta_slot"' not in src
          (root/'PREVIEW.txt').write_text('Preview branch: '+slug+'\\nProduction is not modified.\\n')
          PY
      - name: Check generated preview JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find preview -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Assemble Pages root from production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Assemble production plus isolated preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          tar -C production --exclude=.git --exclude=.github -cf - . | tar -C site -xf -
          mkdir -p site/previews
          cp -a preview/previews/. site/previews/
          test -f site/index.html
          test -f site/previews/ui-dpad-touch/index.html || echo 'Selected preview is not ui-dpad-touch'
      - name: Upload preview artifact (not public)
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: preview/
          retention-days: 7


      - name: Upload Pages artifact (production root preserved)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production and preview together
        id: deployment
        uses: actions/deploy-pages@v4
