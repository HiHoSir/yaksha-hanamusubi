name: Natural cave asset candidates
on:
  push:
    branches: [improve/natural-cave-tiles]
    paths:
      - 'tools/build-natural-cave-candidates.py'
      - 'tools/build-natural-cave-autotile.py'
      - 'qa/natural-cave-autotile-pixels.py'
      - 'qa/natural-cave-layout.cjs'
      - 'previews/natural-cave-walk.html'
      - '.github/workflows/natural-cave-assets.yml'
  workflow_dispatch:
concurrency:
  group: natural-cave-assets-branch
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python tools/build-natural-cave-candidates.py
      - run: python tools/build-natural-cave-autotile.py
      - run: python qa/natural-cave-autotile-pixels.py
      - run: node --test qa/natural-cave-layout.cjs
      - name: Validate interactive cave preview references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('previews/natural-cave-walk.html').read_text()
          assert "const origin='..'" in p
          assert 'data-dir="up"' in p and 'data-dir="left"' in p
          assert 'data-dir="down"' in p and 'data-dir="right"' in p
          assert "rows[y]?.[x]==='.'" in p
          assert 'cave-layout-20x12-candidate.png' in p
          assert 'field-sd-v3/walk-atlas-32.png' in p
          assert Image.open('assets/characters/hizuki/field-sd-v3/walk-atlas-32.png').size == (96,128)
          assert Image.open('assets/dungeons/natural-cave-v0/cave-layout-20x12-candidate.png').size == (640,384)
          print('Preview paths, controls and source PNG dimensions PASS')
          PY
      - name: Verify PNG dimensions and actual pixel edge continuity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/dungeons/natural-cave-v0')
          expected={'floor-base-candidate.png':(32,32),'wall-face-reference.png':(32,32),
                    'rock-source-candidate.png':(32,32),'water-frames-reference.png':(32,128),
                    'source-candidates-4x2.png':(128,64)}
          for name,size in expected.items():
              im=Image.open(p/name).convert('RGBA')
              assert im.size==size,(name,im.size)
              print(name,im.size,im.getbbox())
          im=Image.open(p/'floor-base-candidate.png').convert('RGBA')
          assert all(im.getpixel((0,y))==im.getpixel((31,y)) for y in range(32))
          assert all(im.getpixel((x,0))==im.getpixel((x,31)) for x in range(32))
          print('Floor opposite-edge pixel equality PASS (not visual approval)')
          PY
      - name: Commit generated candidates to isolated improvement branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dungeons/natural-cave-v0/floor-base-candidate.png \
                  assets/dungeons/natural-cave-v0/wall-face-reference.png \
                  assets/dungeons/natural-cave-v0/rock-source-candidate.png \
                  assets/dungeons/natural-cave-v0/water-frames-reference.png \
                  assets/dungeons/natural-cave-v0/source-candidates-4x2.png \
                  assets/dungeons/natural-cave-v0/manifest.json \
                  assets/dungeons/natural-cave-v0/cave-floor-wall-autotile-47-candidate.png \
                  assets/dungeons/natural-cave-v0/cave-layout-20x12-candidate.png \
                  assets/dungeons/natural-cave-v0/floor-repeat-3x3-qa.png \
                  assets/dungeons/natural-cave-v0/autotile-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: build reusable cave PNG candidates [skip ci]'
            git push origin HEAD:improve/natural-cave-tiles
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: natural-cave-source-candidates
          path: assets/dungeons/natural-cave-v0/

      - name: Request isolated Pages preview through existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run improvement-preview.yml --ref main -f source_branch=improve/natural-cave-tiles
