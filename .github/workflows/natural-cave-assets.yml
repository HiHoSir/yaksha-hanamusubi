name: Natural cave asset candidates
on:
  push:
    branches: [improve/natural-cave-tiles]
    paths:
      - 'tools/build-natural-cave-candidates.py'
      - 'tools/build-natural-cave-autotile.py'
      - 'tools/build-cave-straights-atlas.py'
      - 'tools/build-natural-cave-108-layout.py'
      - 'qa/natural-cave-autotile-pixels.py'
      - 'qa/natural-cave-layout.cjs'
      - 'previews/natural-cave-walk.html'
      - '.github/workflows/natural-cave-assets.yml'
  workflow_dispatch:
concurrency:
  group: natural-cave-assets-branch
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python tools/build-natural-cave-candidates.py
      - run: python tools/build-natural-cave-autotile.py
      - run: python tools/build-cave-straights-atlas.py
      - run: python tools/build-natural-cave-108-layout.py
      - run: python qa/natural-cave-autotile-pixels.py
      - run: node --test qa/natural-cave-layout.cjs
      - name: Validate embedded cave editor assets, JSON and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,struct,json
          html=Path('previews/natural-cave-walk.html').read_text()
          assert '自然洞窟 マップチップエディタ' in html
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/cave-preview.js').write_text(js)
          assets=[
            ('ATLAS_DATA','assets/dungeons/natural-cave-v1/cave-wall-straights-atlas-12x9.png',(384,288)),
            ('OVERLAY_DATA','assets/dungeons/natural-cave-v1/cave-wall-straights-overlay-12x9.png',(384,288)),
            ('ARCH_DATA','assets/dungeons/natural-cave-v1/cave-corrected-arch-2x2.png',(64,64)),
          ]
          for variable,path,expected in assets:
              match=re.search('const '+variable+"='data:image/png;base64,([^']+)';",js)
              assert match,variable+' data URL missing'
              encoded=match.group(1)
              assert not any(c.isspace() for c in encoded),variable+' base64 whitespace'
              png=base64.b64decode(encoded,validate=True)
              assert png==Path(path).read_bytes(),variable+' mismatch to committed asset'
              assert png[:8]==bytes([137,80,78,71,13,10,26,10])
              assert struct.unpack('>II',png[16:24])==expected
              print(variable,expected,'bytes',len(png))
          assert 'const SAMPLE=' in js and ';\nconst ATLAS_DATA=' in js
          sample_text=js.split('const SAMPLE=',1)[1].split(';\nconst ATLAS_DATA=',1)[0]
          obj=json.loads(sample_text)
          assert obj['tileSize']==32 and obj['width']==32 and obj['height']==22
          assert len(obj['tileIds'])==22 and all(len(r)==32 for r in obj['tileIds'])
          assert obj['elevation'] is None and obj['heightLevels'] is None
          assert obj['archOverlay']['widthCells']==2
          assert obj==json.loads(Path('assets/dungeons/natural-cave-v1/cave-map-v7.json').read_text())
          for tool in ('paint','erase','pick','fill','collision','spawn','pan','walk'):
              assert 'data-tool="'+tool+'"' in html
          assert 'yaksha.cave.mapchip.editor.wall20261106.transitions' in js
          assert 'data-tab="straight"' in html and 'data-tab="transition"' in html and '全111種' in html
          assert 'id="newWalls"' in html and 'const DEMO_URL=' in js
          assert 'cave-map-108-layout.json' in js and "'layout')==='wall108'" in js
          demo=json.loads(Path('assets/dungeons/natural-cave-v1/cave-map-108-layout.json').read_text())
          assert demo['width']==32 and demo['height']==22 and demo['atlasRows']==9
          assert sum(84<=tile<108 for row in demo['tileIds'] for tile in row)==38
          from PIL import Image
          assert Image.open('assets/dungeons/natural-cave-v1/cave-map-108-layout-preview.png').size==(1024,704)
          assert 'AC=12,AR=9' in js and 'all:Array.from({length:111}' in js
          assert 'cave-wall-straights-atlas-12x9.png' in js
          assert 'transition:[108,109,110]' in js
          assert 'transitionTiles.push' in js
          assert 'cave-transitions-up-down-exit-3x1.png' in js
          assert Image.open('assets/dungeons/natural-cave-v1/cave-transitions-up-down-exit-3x1.png').size==(96,32)
          print('Cave editor 111-chip set, original sample, stairs and exit controls PASS')
          PY
          node --check /tmp/cave-preview.js
      - name: Verify PNG dimensions and actual pixel edge continuity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/dungeons/natural-cave-v0')
          expected={'floor-base-candidate.png':(32,32),'wall-face-reference.png':(32,32),
                    'rock-source-candidate.png':(32,32),'water-frames-reference.png':(32,128),
                    'source-candidates-4x2.png':(128,64)}
          for name,size in expected.items():
              im=Image.open(p/name).convert('RGBA')
              assert im.size==size,(name,im.size)
              print(name,im.size,im.getbbox())
          im=Image.open(p/'floor-base-candidate.png').convert('RGBA')
          assert all(im.getpixel((0,y))==im.getpixel((31,y)) for y in range(32))
          assert all(im.getpixel((x,0))==im.getpixel((x,31)) for x in range(32))
          print('Floor opposite-edge pixel equality PASS (not visual approval)')
          PY
      - name: Commit generated candidates to isolated improvement branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dungeons/natural-cave-v1/cave-map-108-layout.json \
                  assets/dungeons/natural-cave-v1/cave-map-108-layout-preview.png \
                  assets/dungeons/natural-cave-v1/cave-wall-straights-new24-12x2.png \
                  assets/dungeons/natural-cave-v0/cave-orthographic-40x24-candidate.png \
                  assets/dungeons/natural-cave-v0/cave-orthographic-40x24.json \
                  assets/dungeons/natural-cave-v0/cave-elevation-20x12.json \
                  assets/dungeons/natural-cave-v0/floor-base-candidate.png \
                  assets/dungeons/natural-cave-v0/wall-face-reference.png \
                  assets/dungeons/natural-cave-v0/rock-source-candidate.png \
                  assets/dungeons/natural-cave-v0/water-frames-reference.png \
                  assets/dungeons/natural-cave-v0/source-candidates-4x2.png \
                  assets/dungeons/natural-cave-v0/manifest.json \
                  assets/dungeons/natural-cave-v0/cave-floor-wall-autotile-47-candidate.png \
                  assets/dungeons/natural-cave-v0/cave-layout-20x12-candidate.png \
                  assets/dungeons/natural-cave-v0/floor-repeat-3x3-qa.png \
                  assets/dungeons/natural-cave-v0/autotile-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: build reusable cave PNG candidates [skip ci]'
            git push origin HEAD:improve/natural-cave-tiles
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: natural-cave-source-candidates
          path: assets/dungeons/natural-cave-v0/

      - name: Request isolated Pages preview through existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run improvement-preview.yml --ref main -f source_branch=improve/natural-cave-tiles
