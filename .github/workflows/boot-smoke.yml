name: Test and QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select affected tests
        id: select
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base="$EVENT_BEFORE"
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; fi
          tests=""
          terrain=false
          equipment=false
          # First push or missing base: run everything rather than silently skip.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            tests="battle-layout settlement movement dialog residents guide-menu field-access interior-base"
            terrain=true
            equipment=true
          else
            files="$(git diff --name-only "$base" HEAD)"
            while IFS= read -r file; do
              case "$file" in
                js/game.js)
                  # game.js owns several systems; for a generic change, test all dependent scenes.
                  # Interior-only diffs can use the interior/dialog suite.
                  diff="$(git diff -U0 "$base" HEAD -- js/game.js)"
                  if printf '%s' "$diff" | grep -Eq 'indoorPerspective|indoorProjectedBlocked|INDOOR_PERSPECTIVE|drawLayeredIndoorActors|drawPaintedTeaActors|TEA_ART|drawIndoorOccluder'; then
                    tests="$tests dialog settlement"
                  else
                    tests="$tests battle-layout settlement movement dialog residents guide-menu field-access interior-base"
                  fi ;;
                js/game-state.js) : ;;
                docs/*|art-source/*) : ;;
                js/settlement.js|assets/settlement/*|assets/village/*) tests="$tests settlement residents movement" ;;
                js/input.js|css/game.css|index.html|assets/ui/*) tests="$tests dialog battle-layout guide-menu" ;;
                js/world.js|js/landscape.js|assets/terrain/*|assets/maps/*|js/autotile.js) tests="$tests movement field-access settlement";terrain=true ;;
                js/data.js|js/equipment.js|js/save.js|assets/characters/*|assets/enemies/*) tests="$tests battle-layout dialog";equipment=true ;;
                js/audio.js) tests="$tests dialog" ;;
                qa/autotile-smoke.cjs|qa/runtime-smoke.cjs) tests="$tests interior-base settlement movement";terrain=true ;;
                qa/*.cjs) name="${file#qa/}";name="${name%.cjs}";case " battle-layout settlement movement dialog residents guide-menu field-access interior-base " in *" $name "*) tests="$tests $name";; esac ;;
                .github/workflows/*) tests="$tests battle-layout settlement movement dialog residents guide-menu field-access interior-base";terrain=true;equipment=true ;;
                assets/interiors/*) tests="$tests dialog" ;;
                *) tests="$tests battle-layout settlement movement dialog residents guide-menu field-access interior-base";terrain=true;equipment=true ;;
              esac
            done <<< "$files"
          fi
          selected=""
          for test in battle-layout settlement movement dialog residents guide-menu field-access interior-base; do
            case " $tests " in *" $test "*) selected="$selected $test";; esac
          done
          echo "tests=${selected# }" >> "$GITHUB_OUTPUT"
          echo "terrain=$terrain" >> "$GITHUB_OUTPUT"
          echo "equipment=$equipment" >> "$GITHUB_OUTPUT"
          echo "Selected browser suites: ${selected# }"
      - name: JavaScript syntax
        run: |
          for f in js/*.js qa/*.cjs; do node --check "$f"; done
      - name: Visible build and cache consistency
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const title=html.match(/<title>[^<]*β([0-9.]+)/)?.[1];
          const brand=html.match(/class="brand"[^>]*>[^<]*<small>β([0-9.]+)/)?.[1];
          assert.ok(title,'missing visible version');
          assert.equal(brand,title,'header and document title version mismatch');
          const sources=html.split('\n').filter(line=>line.includes('src="js/')||line.includes('href="css/')).map(line=>line.match(/[?]v=([0-9.]+)/)?.[1]);
          assert.ok(sources.length>=15,'missing static resource versions');
          assert.ok(sources.every(v=>v===title),'stale asset cache tag differs from build version');
          console.log('Visible build version and asset cache tags match:',title);
          NODE
      - name: Module load consistency
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script src="(js\/[^"?]+)(?:\?[^"]*)?"\s*><\/script>/g)].map(x=>x[1]);
          assert(scripts.includes('js/game-state.js'));
          assert(scripts.indexOf('js/save.js')<scripts.indexOf('js/game-state.js'));
          assert(scripts.indexOf('js/game-state.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/dialogue.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/interaction.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/story-events.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/battle-rules.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/collision.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/movement-rules.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/area-transitions.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/camera-position.js')<scripts.indexOf('js/game.js'));
          assert(scripts.indexOf('js/field-hint.js')<scripts.indexOf('js/game.js'));
          for(const path of scripts)assert(fs.existsSync(path),'missing script: '+path);
          for(const path of ['qa/runtime-smoke.cjs','qa/autotile-smoke.cjs']){
            const source=fs.readFileSync(path,'utf8');
            const i=source.indexOf("'game-state.js'"),d=source.indexOf("'dialogue.js'"),e=source.indexOf("'interaction.js'"),k=source.indexOf("'story-events.js'"),b=source.indexOf("'battle-rules.js'"),j=source.indexOf("'game.js'");
            assert(i>=0&&d>i&&e>d&&k>e&&b>k&&j>b,'QA loader mismatch: '+path);
          }
          console.log('HTML and VM harness module order OK');
          NODE
      - name: Prologue completion and save safety
        run: node qa/prologue-unit.cjs
      - name: Field message priority contract
        run: node qa/field-hint-unit.cjs
      - name: Camera interpolation contract
        run: node qa/camera-position-unit.cjs
      - name: Area transitions contract
        run: node qa/area-transitions-unit.cjs
      - name: Tenyo authored movement and layer contracts
        run: |
          node qa/destination-scenes.cjs
          node qa/tenyo-input.cjs
          node qa/tenyo-layers.cjs
          node qa/tenyo-loading.cjs
      - name: Cache version consistency contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const version=html.match(/<title>[^<]*?β(\d+\.\d+\.\d+)<\/title>/)?.[1];
          assert(version,'missing visible build version');
          assert(html.includes('const loadedBuild="'+version+'"'),'cache-check build must match title');
          assert(html.includes('cache:"no-store"'),'fresh build check must bypass browser cache');
          for(const [,asset,query] of html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+\.(?:js|css))\?v=([^"]+)"/g)){
            assert.equal(query,version,'stale static asset version: '+asset);
          }
          NODE
      - name: Audio playback and lifecycle contract
        run: node qa/audio-contract.cjs
      - name: Movement geometry contract
        run: node qa/movement-rules-unit.cjs
      - name: Collision geometry contract
        run: node qa/collision-unit.cjs
      - name: Save compatibility contract
        run: node qa/save-compat-unit.cjs
      - name: Audio lifecycle contract
        run: node qa/audio-lifecycle-unit.cjs
      - name: Dialogue normalization contract
        run: node qa/dialogue-unit.cjs
      - name: NPC interaction geometry contract
        run: node qa/interaction-unit.cjs
      - name: Story event progression contract
        run: node qa/story-events-unit.cjs
      - name: Field elevation and corner contract
        run: |
          node qa/elevation.cjs
          node qa/elevation-corners.cjs
          node qa/field-elevation.cjs
          node qa/field-chunk-cache.cjs
      - name: Reference field composition contract
        run: node qa/reference-field.cjs
      - name: Battle arithmetic contract
        run: |
          node qa/battle-rules-unit.cjs
          node qa/battle-tempo.cjs
      - name: Architecture baseline guard
        run: node qa/architecture-guard.cjs
      - name: Runtime state module contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const source=fs.readFileSync('js/game-state.js','utf8');
          const env={YK_SAVE:{fresh:()=>({value:1}),migrate:x=>({...x,normalized:true})}};
          env.window=env;vm.runInNewContext(source,env);
          assert.equal(env.YK_GAME_STATE.fresh(),env.gameState);
          const original={value:2};
          assert.equal(env.YK_GAME_STATE.restore(original).normalized,true);
          assert.equal(env.gameState.value,2);
          const copy=env.YK_GAME_STATE.copy(original);
          assert.notEqual(copy,original);
          assert.deepEqual(JSON.parse(JSON.stringify(copy)),original);
          assert.equal(copy,env.gameState);
          console.log('Runtime state contract OK');
          NODE
      - name: Build version consistency
        run: node qa/runtime-build-contract.cjs
      - name: Boot dependency contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const order=['js/data.js','js/equipment.js','js/world.js','js/save.js','js/audio.js','js/input.js','js/autotile.js','js/landscape.js','js/settlement.js','js/game.js'];
          let last=-1;
          for(const p of order){const i=html.indexOf(p);if(i<0||i<=last)throw new Error('bad script order: '+p);last=i}
          const world=fs.readFileSync('js/world.js','utf8');
          if(!/(?:window\.)?YK_WORLD\s*=\s*\(\(\)=>\{/.test(world))throw new Error('YK_WORLD module missing');
          if(!/return \{start,hub,places,roads/.test(world))throw new Error('YK_WORLD export missing');
          const game=fs.readFileSync('js/game.js','utf8');
          if(!game.includes('YK_INPUT.tap($("newGame")'))throw new Error('new game handler missing');
          if(!game.includes('YK_INPUT.tap($("continueGame")'))throw new Error('continue handler missing');
          if(html.includes('id="debugMap"')||html.includes('href="debug-world.html"'))throw new Error('field debug entry must be hidden from public title');
          if(!game.includes('const DEBUG_PAGES=["landscape","landscape2x","terrainAssets","landmarks","landmarks2x","placeAssets","autotile","autotile2x","connections","assets32","overview","shore","water","ground","road","quarter","quarterNear","quarterMap"]'))throw new Error('debug page contract missing');
          if(!game.includes('const DEBUG_ART={},DEBUG_FALLBACK={}')||!game.includes('const DEBUG_ASSETS='))throw new Error('debug asset loader missing');
          if(!game.includes('world-ortho-ground-v2.png')||!game.includes('world-ortho-road-v2.png'))throw new Error('debug assets missing');
          if(!game.includes('DEBUG_FALLBACK')||!game.includes('naturalWidth!==spec.size[0]'))throw new Error('debug asset validation/fallback missing');
          if(!game.includes('drawDebugOverview')||!game.includes('drawDebugSheet'))throw new Error('debug inspection pages missing');
          if(!game.includes('if(S.area==="debugField"){moveDebug(dx,dy,dir);return;}'))throw new Error('debug movement isolation missing');
          const settlement=fs.readFileSync('js/settlement.js','utf8');
          const save=fs.readFileSync('js/save.js','utf8');
          if(!game.includes('S.area="village";S.x=768;S.y=760'))throw new Error('new game must start in village');
          if(!game.includes('S.visitedAreas.village=true'))throw new Error('new game village visit missing');
          if(!settlement.includes('お帰りなさい、緋月さま'))throw new Error('village dialogue still references old protagonist');
          if(!save.includes('area:"field"'))throw new Error('save test fixture must remain compatible');
          console.log('opening and village story contract OK');
          console.log('boot contract OK');
          NODE
      - name: Public costume privacy regression
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=fs.readFileSync('js/data.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          if(data.includes('stardust:{'))throw new Error('withheld outfit re-enabled');
          if(html.includes('value="stardust"'))throw new Error('withheld outfit in debug UI');
          for(const dir of ['front','back','left','right']){
            for(const phase of ['neutral','left-leg-up','right-leg-up']){
              if(fs.existsSync('assets/characters/yashahime/stardust-v1/'+dir+'-'+phase+'.png'))throw new Error('withheld walking image published');
            }
          }
          for(const pose of ['idle','attack','hit','guard','victory','skill']){
            if(fs.existsSync('assets/characters/yashahime/battle-v9/stardust-'+pose+'.png'))throw new Error('withheld battle image published');
          }
          console.log('public costume privacy contract OK');
          NODE
      - name: Required production assets
        run: |
          test -s assets/terrain/world-ground-qv-32.png
          test -s assets/terrain/world-road-qv-32.png
          test -s assets/terrain/world-shore-qv-32.png
          test -s assets/terrain/world-forest-qv.png
          test -s assets/terrain/world-mountain-qv.png
          test -s assets/terrain/world-landmarks-qv.png
          test -s assets/terrain/world-ortho-ground-v1.png
          test -s assets/terrain/world-ortho-road-v1.png
          test -s assets/terrain/world-ortho-road-v2.png
          test -s assets/terrain/world-ortho-road-v2.webp
          test -s assets/terrain/world-ortho-shore-v2.webp
          test -s assets/terrain/world-ortho-forest-v2.webp
          test -s assets/terrain/world-ortho-mountain-v2.webp
          test -s assets/terrain/world-ortho-landmarks-v2.webp
          test -s assets/terrain/world-ortho-shore-v1.png
          test -s assets/terrain/world-ortho-forest-v1.png
          test -s assets/terrain/world-ortho-mountain-v1.png
          test -s assets/terrain/world-ortho-landmarks-v1.png
          node - <<'NODE'
          const fs=require('fs');
          const specs={
            'world-ortho-ground-v1.png':[256,128,3000],
            'world-ortho-road-v1.png':[128,128,800],
            'world-ortho-shore-v1.png':[128,128,500],
            'world-ortho-forest-v1.png':[192,128,3000],
            'world-ortho-mountain-v1.png':[288,192,3000],
            'world-ortho-landmarks-v1.png':[384,192,3000]
          };
          for(const [name,[ew,eh,min]] of Object.entries(specs)){
            const p='assets/terrain/'+name,b=fs.readFileSync(p);
            if(b.length<min)throw new Error(name+' suspiciously small: '+b.length+' bytes');
            if(b.toString('ascii',1,4)!=='PNG')throw new Error(name+' is not PNG');
            const w=b.readUInt32BE(16),h=b.readUInt32BE(20);
            if(w!==ew||h!==eh)throw new Error(name+' dimensions '+w+'x'+h+', expected '+ew+'x'+eh);
          }
          console.log('orthogonal debug sheets OK');
          NODE

      - name: Equipment economy and save migration
        if: steps.select.outputs.equipment == 'true'
        run: node qa/equipment.cjs

      - name: Original terrain and debug boot
        if: steps.select.outputs.terrain == 'true'
        run: |
          npm install --no-save --package-lock=false @napi-rs/canvas@0.1.100
          node qa/tenyo-npc-art.cjs
          node qa/tenyo-npc-grid.cjs
          node qa/tenyo-cutouts.cjs
          node qa/autotile-smoke.cjs
          node qa/field-render-parity.cjs

      - name: Title entrance and affected browser tests
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install chromium
          failed=0
          for test in audio-track-decode title-entrance title-save-selection hizuki-art ${{ steps.select.outputs.tests }}; do
            echo "::group::Browser smoke: $test"
            if node "qa/$test.cjs"; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"


      - name: Character rendering screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hizuki-rendering
          path: qa/results/hizuki/
          if-no-files-found: ignore

      - name: Interior appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-rendering
          path: |
            qa/results/autotile/interior-*.png
            qa/results/autotile/armory-layer-*.png
          if-no-files-found: ignore


