name: Install approved horagai SE
on:
  push:
    paths:
      - .github/workflows/install-horagai.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved recording and verify exact original
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fL --connect-timeout 15 --max-time 90 'https://esffects.net/data/93.mp3' -o /tmp/horagai.mp3
          echo 'eaf92e8f329b09e781cd9555197619a7fcb82ebdc12522cac77ba4f7ee3f9420  /tmp/horagai.mp3' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p audio
          ffmpeg -hide_banner -loglevel error -y -i /tmp/horagai.mp3 -t 2.25 -af 'afade=t=out:st=1.85:d=0.40' -c:a libmp3lame -b:a 160k audio/horagai-encounter.mp3
          test "$(stat -c %s audio/horagai-encounter.mp3)" -gt 25000
      - name: Commit verified audio file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/horagai-encounter.mp3
          git commit -m 'Add verified recorded horagai encounter SE' || exit 0
          git push origin HEAD:main
