name: Install approved horagai SE
on:
  push:
    paths:
      - .github/workflows/install-horagai.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transfer exactly approved preview MP3 and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          curl --retry 2 -fL --connect-timeout 15 --max-time 60 'https://cdn.openart.ai/openart-uploads/production/attachment-transfers/08295b0d4c157bcde8673b670a4ba00d9fd4400c30c75675feac6d619120fc25.mp3' -o audio/horagai-encounter.mp3
          echo 'e38961a4915a3686bef44ddad07fa8f8b7b75a15e467cbcc056e038e93aaefb1  audio/horagai-encounter.mp3' | sha256sum -c -
          test "$(stat -c %s audio/horagai-encounter.mp3)" -eq 46542
      - name: Commit verified audio file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/horagai-encounter.mp3
          git commit -m 'Add verified recorded horagai encounter SE' || exit 0
          git push origin HEAD:main
