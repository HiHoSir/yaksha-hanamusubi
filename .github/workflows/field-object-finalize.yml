name: Finalize approved field art
on:
  push:
    paths:
      - '.github/workflows/field-object-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Normalize existing PNG artwork and loader
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for stem in ('castle','shrine'):
              p=Path('assets/field-map-objects-v3')/(stem+'.png')
              with Image.open(p) as source:
                  im=source.convert('RGBA')
              if im.size!=(64,64):
                  im.resize((64,64),Image.Resampling.NEAREST).save(p,optimize=True)
              with Image.open(p) as result:
                  assert result.size==(64,64)
                  assert result.mode=='RGBA'
          p=Path('js/landscape.js')
          text=p.read_text()
          text=text.replace('castle:[112,112]','castle:[64,64]')
          text=text.replace('shrine:[96,86]','shrine:[64,64]')
          p.write_text(text)
          p=Path('index.html')
          text=p.read_text()
          assert '16.0.105' in text
          p.write_text(text.replace('16.0.105','16.0.106'))
          PY
      - name: Commit verified assets and code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/field-map-objects-v3/castle.png assets/field-map-objects-v3/shrine.png js/landscape.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Finalize approved 64x64 field object sprites"
            git push
          fi
