name: Rare Enemy Sprite Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rare-enemy-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python qa/repair-rare-enemy-atlases.py
      - name: Commit repair candidates for visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/enemies/reviewed-candidates/
          if ! git diff --cached --quiet; then
            git commit -m "assets: store rare enemy repair candidates for visual review"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rare-enemy-repair-preview
          path: assets/enemies/reviewed-candidates/
