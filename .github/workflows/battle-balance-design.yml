name: Battle balance draft contract

on:
  push:
    paths:
      - 'docs/battle/hizuki-status-v2.json'
      - 'docs/battle/balance-v2-draft.json'
      - 'qa/battle-balance-design.cjs'
      - '.github/workflows/battle-balance-design.yml'
  pull_request:
    paths:
      - 'docs/battle/hizuki-status-v2.json'
      - 'docs/battle/balance-v2-draft.json'
      - 'qa/battle-balance-design.cjs'
      - '.github/workflows/battle-balance-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check draft balance against approved v2 source
        run: node qa/battle-balance-design.cjs
