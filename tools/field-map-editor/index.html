<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>地形マップエディタ</title><style>body{background:#122034;color:#f3f0df;font:15px system-ui;margin:0}header{padding:12px;background:#20334a}h1{font-size:19px;margin:0 0 8px}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}button,input,select{font:inherit;padding:8px;border-radius:7px;border:1px solid #879cb0}button.active{background:#f2c982}label{font-size:13px}main{padding:10px}#view{overflow:auto;height:60vh;max-height:67vh;border:2px solid #d8b77b;background:#142538;touch-action:none}canvas{display:block;image-rendering:pixelated;touch-action:none}small{color:#d1d6da}</style></head><body><header><h1>鬼哭の花契り｜地形マップエディタ v0.4</h1><small>iPhone Safari対応・ゲーム本編とは独立</small></header><main><div class="tools"><label>横 <input id="mw" type="number" min="8" max="256" value="80" style="width:65px"></label><label>縦 <input id="mh" type="number" min="8" max="256" value="80" style="width:65px"></label><button id="resize">サイズ変更</button><label>下絵 <input id="photo" type="file" accept="image/*"></label></div><div class="tools"><label>地形 <select id="tile"></select></label><label>筆 <select id="brush"><option value="paint">描く</option><option value="fill">塗りつぶし</option><option value="pan">移動</option></select></label><button id="undo">戻す</button><button id="detect">PNGから地形を自動検出</button><button id="zoomout">− 縮小</button><input id="zoom" type="range" min="3" max="48" value="12" style="width:110px"><button id="zoomin">＋ 拡大</button><button id="fit">全体表示</button><strong id="zoomLabel">12px/マス</strong></div><div class="tools"><label><input id="showRef" type="checkbox" checked> 下絵表示</label><label>下絵透明度 <input id="alpha" type="range" min="0" max="100" value="85"></label><label>下絵倍率 <input id="refScale" type="range" min="25" max="300" value="100"></label><label>横位置 <input id="refX" type="range" min="-100" max="100" value="0"></label><label>縦位置 <input id="refY" type="range" min="-100" max="100" value="0"></label><label><input id="overlay" type="checkbox" checked> タイル色を表示</label><button id="export">JSON保存</button><label>JSON読込 <input id="import" type="file" accept=".json,application/json"></label></div><div id="view"><canvas id="map"></canvas></div><p id="status">地形を選んでタップまたはドラッグしてください。</p></main><script>
const names={sea:['海','#398cbd'],grass:['草原','#95bf69'],sand:['砂浜','#dfca8d'],forest:['森林','#43754c'],mountain:['山岳','#677e70'],rockMountain:['岩山','#7e7d74'],river:['川','#58a5c4'],road:['道','#b99b6d'],bridge:['橋','#9a7551'],wildflowers:['花畑','#d3a0af']};
const $=id=>document.getElementById(id),c=$('map'),ctx=c.getContext('2d');let W=80,H=80,scale=12,data=Array.from({length:H},()=>Array(W).fill(null)),image=null,history=[],drawing=false,last=null,pointers=new Map(),pinch=null;
for(const [k,v] of Object.entries(names))$('tile').add(new Option(v[0],k));
function render(){$('zoom').value=scale;$('zoomLabel').textContent=scale+'px/マス';c.width=W*scale;c.height=H*scale;ctx.fillStyle='#1b3644';ctx.fillRect(0,0,c.width,c.height);if(image&&$('showRef').checked){const zoom=+$('refScale').value/100,iw=c.width*zoom,ih=c.height*zoom,ox=(c.width-iw)/2+c.width*(+$('refX').value)/100,oy=(c.height-ih)/2+c.height*(+$('refY').value)/100;ctx.globalAlpha=+$('alpha').value/100;ctx.drawImage(image,ox,oy,iw,ih);ctx.globalAlpha=1}if($('overlay').checked)for(let y=0;y<H;y++)for(let x=0;x<W;x++){const tile=data[y][x];if(tile==null)continue;ctx.globalAlpha=image?.72:1;ctx.fillStyle=names[tile]?.[1]||'#ff00ff';ctx.fillRect(x*scale,y*scale,scale,scale)}ctx.globalAlpha=1;if(scale>=10){ctx.strokeStyle='#ffffff18';ctx.lineWidth=.5;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*scale,0);ctx.lineTo(x*scale,H*scale);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*scale);ctx.lineTo(W*scale,y*scale);ctx.stroke()}}}
function detectTerrain(){if(!image){alert('先にPNGの下絵を選択してください');return}if(!confirm('PNGの色から地形を推定します。既存の配置は上書きされます（戻すで復元できます）。'))return;save();const tmp=document.createElement('canvas');tmp.width=W*4;tmp.height=H*4;const tc=tmp.getContext('2d',{willReadFrequently:true});const z=+$('refScale').value/100,iw=tmp.width*z,ih=tmp.height*z;tc.drawImage(image,(tmp.width-iw)/2+tmp.width*(+$('refX').value)/100,(tmp.height-ih)/2+tmp.height*(+$('refY').value)/100,iw,ih);const pixels=tc.getImageData(0,0,tmp.width,tmp.height).data;const classify=(r,g,b)=>{const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(b>r*1.1&&b>g*.93&&b>75)return 'sea';if(g>r*1.08&&g>b*1.08)return g<100?'forest':'grass';if(r>125&&g>110&&b<g*.87)return 'sand';if(d<28&&max<155)return 'rockMountain';if(r>g*1.12&&r>b*1.13)return 'road';if(g>r*.9&&g>b*.85)return g<110?'forest':'grass';return 'grass'};let counts={};for(let y=0;y<H;y++)for(let x=0;x<W;x++){let votes={};for(let sy=1;sy<4;sy++)for(let sx=1;sx<4;sx++){const i=((y*4+sy)*tmp.width+x*4+sx)*4;if(pixels[i+3]<40)continue;const kind=classify(pixels[i],pixels[i+1],pixels[i+2]);votes[kind]=(votes[kind]||0)+1}const kind=Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0]||null;data[y][x]=kind;if(kind)counts[kind]=(counts[kind]||0)+1}render();$('status').textContent='自動検出完了：'+Object.entries(counts).map(([k,n])=>(names[k]?.[0]||k)+' '+n).join(' / ')+'。誤判定は手動で修正してください。'}
function save(){history.push(data.map(r=>r.slice()));if(history.length>25)history.shift()}
function at(e){const r=c.getBoundingClientRect();return [Math.floor((e.clientX-r.left)*c.width/r.width/scale),Math.floor((e.clientY-r.top)*c.height/r.height/scale)]}
function paint(x,y){if(x<0||y<0||x>=W||y>=H)return;const kind=$('tile').value;if($('brush').value==='fill'){const target=data[y][x];if(target===kind)return;const q=[[x,y]];data[y][x]=kind;for(let i=0;i<q.length;i++){const [a,b]=q[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=a+dx,ny=b+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H&&data[ny][nx]===target){data[ny][nx]=kind;q.push([nx,ny])}}}}else data[y][x]=kind;render()}
let pan=null;function zoomTo(next,cx=$('view').clientWidth/2,cy=$('view').clientHeight/2){const view=$('view'),old=scale;next=Math.max(3,Math.min(48,Math.round(next)));if(next===old)return;const px=(view.scrollLeft+cx)/old,py=(view.scrollTop+cy)/old;scale=next;render();view.scrollLeft=px*scale-cx;view.scrollTop=py*scale-cy}function fit(){const view=$('view');zoomTo(Math.max(3,Math.min(48,Math.floor(Math.min(view.clientWidth/W,view.clientHeight/H)))),0,0);view.scrollLeft=0;view.scrollTop=0}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){drawing=false;pan=null;const pts=[...pointers.values()];pinch={dist:Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]),scale,center:[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2],scroll:[$('view').scrollLeft,$('view').scrollTop]};return}if(pointers.size>2)return;drawing=true;last=at(e);if($('brush').value==='pan'){pan=[e.clientX,e.clientY,$('view').scrollLeft,$('view').scrollTop]}else{save();paint(...last)}});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size>=2&&pinch){const pts=[...pointers.values()],dist=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]),view=$('view'),r=view.getBoundingClientRect();zoomTo(pinch.scale*dist/Math.max(1,pinch.dist),pinch.center[0]-r.left,pinch.center[1]-r.top);view.scrollLeft+=pinch.center[0]-(pts[0][0]+pts[1][0])/2;view.scrollTop+=pinch.center[1]-(pts[0][1]+pts[1][1])/2;pinch.center=[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2];pinch.scale=scale;pinch.dist=dist;return}if(!drawing)return;e.preventDefault();if(pan){$('view').scrollLeft=pan[2]+pan[0]-e.clientX;$('view').scrollTop=pan[3]+pan[1]-e.clientY;return}if($('brush').value==='fill')return;const p=at(e);const n=Math.max(Math.abs(p[0]-last[0]),Math.abs(p[1]-last[1]));for(let i=0;i<=n;i++)paint(Math.round(last[0]+(p[0]-last[0])*i/Math.max(n,1)),Math.round(last[1]+(p[1]-last[1])*i/Math.max(n,1)));last=p});
function pointerEnd(e){pointers.delete(e.pointerId);drawing=false;pan=null;if(pointers.size<2)pinch=null}c.addEventListener('pointerup',pointerEnd);c.addEventListener('pointercancel',pointerEnd);
$('detect').onclick=detectTerrain;
$('resize').onclick=()=>{const w=Math.max(8,Math.min(256,+$('mw').value||80)),h=Math.max(8,Math.min(256,+$('mh').value||80));save();data=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>data[y]?.[x]??null));W=w;H=h;render()};
$('undo').onclick=()=>{if(history.length){data=history.pop();H=data.length;W=data[0].length;$('mw').value=W;$('mh').value=H;render()}};
$('zoomin').onclick=()=>zoomTo(scale+4);$('zoomout').onclick=()=>zoomTo(scale-4);$('zoom').oninput=e=>zoomTo(+e.target.value);$('fit').onclick=fit;
for(const id of ['alpha','showRef','refScale','refX','refY','overlay'])$(id).oninput=render;
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{image=im;URL.revokeObjectURL(url);render()};im.src=url};
$('export').onclick=()=>{const obj={format:'yaksha-terrain-v1',tileSize:32,width:W,height:H,tiles:data,reference:{visible:$('showRef').checked,opacity:+$('alpha').value,scale:+$('refScale').value,x:+$('refX').value,y:+$('refY').value}};const blob=new Blob([JSON.stringify(obj)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='field-terrain.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.tiles)||obj.tiles.length!==obj.height||obj.tiles.some(r=>!Array.isArray(r)||r.length!==obj.width))throw Error('サイズ不一致');save();W=obj.width;H=obj.height;data=obj.tiles;for(const [key,id] of [['visible','showRef'],['opacity','alpha'],['scale','refScale'],['x','refX'],['y','refY']])if(obj.reference?.[key]!=null)$(id)[key==='visible'?'checked':'value']=obj.reference[key];$('mw').value=W;$('mh').value=H;render()}catch(err){alert('読み込み失敗: '+err.message)}};
render();fit();
</script></body></html>
