<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>天妖の社 歩行判定</title><style>body{margin:0;background:#16202b;color:white;font:14px sans-serif}header,.tools{padding:10px;display:flex;gap:6px;flex-wrap:wrap}button,label{background:#34475a;border:1px solid #7b91a6;color:white;padding:10px;border-radius:7px}button.sel{background:#16834e}#view{height:65vh;overflow:auto;touch-action:pan-x pan-y}canvas{display:block;touch-action:none}small{padding:8px;display:block}input{display:none}</style><header>天妖の社｜歩行可能マス指定（48×32）</header><div class="tools"><button id="walk" class="sel">歩行可能</button><button id="wall">進入不可</button><button id="pen" class="sel">ペン</button><button id="rect">矩形</button><button id="pan">スクロール</button><button id="undo">戻す</button></div><div id="view"><canvas id="c"></canvas></div><div class="tools"><button id="zin">＋</button><button id="zout">−</button><button id="fit">全体</button><button id="save">JSON保存</button><label>JSON読込<input id="load" type="file" accept=".json"></label><label>背景画像変更<input id="bg" type="file" accept="image/*"></label></div><small id="status">画像読込中…</small><script>
const W=48,H=32,T=32,c=document.getElementById('c'),ctx=c.getContext('2d'),view=document.getElementById('view'),el=id=>document.getElementById(id);let grid=Array.from({length:H},()=>Array(W).fill('#')),mode='.',tool='pen',zoom=.5,down=false,start=null,old=null,hist=[],pan=null;
const bg=new Image();bg.src='../assets/maps/tenyo/layer-background.webp';bg.onload=draw;
const tree=new Image();tree.src='../assets/maps/tenyo/layer-trees.webp';tree.onload=draw;
const torii=new Image();torii.src='../assets/maps/tenyo/layer-torii.webp?v=4';torii.onload=draw;
const shrine=new Image();shrine.src='../assets/maps/tenyo/layer-shrine.webp';shrine.onload=draw;
let custom=null;
fetch('../assets/maps/tenyo/walkability-48x32.json?v=16.1.15').then(r=>{if(!r.ok)throw Error('通行判定を読み込めません');return r.json()}).then(d=>{if(d.columns!==W||d.rows!==H||d.grid.length!==H||d.grid.some(r=>r.length!==W||/[^.#]/.test(r)))throw Error('通行判定のサイズ不一致');grid=d.grid.map(r=>r.split(''));draw()}).catch(e=>el('status').textContent=e.message);
function draw(preview){c.width=Math.round(1536*zoom);c.height=Math.round(1024*zoom);ctx.save();ctx.scale(zoom,zoom);ctx.fillStyle='#263c2a';ctx.fillRect(0,0,1536,1024);if(custom)ctx.drawImage(custom,0,0,1536,1024);else for(let im of [bg,tree,shrine,torii])if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,1536,1024);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=grid[y][x]==='.'?'#00e06a55':'#fa304022';ctx.fillRect(x*T,y*T,T,T)}if(preview){ctx.fillStyle=mode==='.'?'#00ff6a77':'#ff335577';let [a,b]=preview;ctx.fillRect(Math.min(a.x,b.x)*T,Math.min(a.y,b.y)*T,(Math.abs(a.x-b.x)+1)*T,(Math.abs(a.y-b.y)+1)*T)}ctx.beginPath();for(let x=0;x<=W;x++){ctx.moveTo(x*T,0);ctx.lineTo(x*T,1024)}for(let y=0;y<=H;y++){ctx.moveTo(0,y*T);ctx.lineTo(1536,y*T)}ctx.strokeStyle='#ffffff66';ctx.lineWidth=1/zoom;ctx.stroke();ctx.restore();el('status').textContent='緑＝歩行可能／赤＝進入不可｜歩行可能 '+grid.flat().filter(v=>v==='.').length+' マス｜倍率 '+Math.round(zoom*100)+'%'}
function p(e){let r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(47,Math.floor((e.clientX-r.left)/zoom/32))),y:Math.max(0,Math.min(31,Math.floor((e.clientY-r.top)/zoom/32)))}}function paint(q){grid[q.y][q.x]=mode}function line(a,b){let n=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y));for(let i=0;i<=n;i++)paint({x:Math.round(a.x+(b.x-a.x)*i/Math.max(1,n)),y:Math.round(a.y+(b.y-a.y)*i/Math.max(1,n))})}
function pick(id,m,t){el(id).onclick=()=>{if(m){mode=m;el('walk').classList.toggle('sel',m==='.');el('wall').classList.toggle('sel',m==='#')}else{tool=t;for(let k of ['pen','rect','pan'])el(k).classList.toggle('sel',k===t)}}}pick('walk','.');pick('wall','#');pick('pen',null,'pen');pick('rect',null,'rect');pick('pan',null,'pan');
c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);down=true;start=p(e);old=grid.map(r=>r.join(''));pan={x:e.clientX,y:e.clientY,l:view.scrollLeft,t:view.scrollTop};if(tool==='pen'){paint(start);draw()}};c.onpointermove=e=>{if(!down)return;e.preventDefault();if(tool==='pan'){view.scrollLeft=pan.l+pan.x-e.clientX;view.scrollTop=pan.t+pan.y-e.clientY}else if(tool==='rect')draw([start,p(e)]);else{line(start,p(e));start=p(e);draw()}};c.onpointerup=e=>{if(!down)return;down=false;if(tool==='rect'){let b=p(e);for(let y=Math.min(start.y,b.y);y<=Math.max(start.y,b.y);y++)for(let x=Math.min(start.x,b.x);x<=Math.max(start.x,b.x);x++)paint({x,y})}if(tool!=='pan'&&old.join('')!==grid.map(r=>r.join('')).join(''))hist.push(old);draw()};c.onpointercancel=()=>{down=false;draw()};
el('undo').onclick=()=>{if(hist.length){grid=hist.pop().map(s=>s.split(''));draw()}};el('zin').onclick=()=>{zoom=Math.min(3,zoom*1.25);draw()};el('zout').onclick=()=>{zoom=Math.max(.2,zoom/1.25);draw()};el('fit').onclick=()=>{zoom=Math.min(view.clientWidth/1536,view.clientHeight/1024);draw()};el('fit').click();
el('save').onclick=()=>{let obj={format:'yaksha-walkability-v1',map:'tenyo',sourceSize:[1536,1024],tileSize:32,columns:48,rows:32,movement:'four-directions',legend:{'.':'walkable','#':'blocked'},grid:grid.map(r=>r.join(''))};let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='tenyo_walkability_48x32.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
el('load').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(j.columns!==48||j.rows!==32||j.grid.length!==32||j.grid.some(r=>r.length!==48||/[^.#]/.test(r)))throw Error('サイズ不一致');hist.push(grid.map(r=>r.join('')));grid=j.grid.map(r=>r.split(''));draw()}catch(err){alert(err.message)}};
el('bg').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{custom=im;draw()};im.src=u};
</script></html>
