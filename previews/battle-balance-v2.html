<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鬼哭の花結び・B式v2戦闘検証</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#101821;color:#f7eedb}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-left));background:linear-gradient(180deg,#172638,#101821 45%);min-height:100dvh}
main{max-width:720px;margin:0 auto;padding:14px 0 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.25rem;margin:4px 0 8px}h2{font-size:1rem;margin:0 0 10px}
a{color:#dcd0ab}small,.note{color:#b5c4c8;font-size:.78rem;line-height:1.6}
fieldset,.panel{border:1px solid #566779;border-radius:12px;padding:14px;background:#182b3b;margin:12px 0;box-shadow:0 3px 12px #0003}
legend{padding:0 6px;color:#ead9aa;font-weight:700}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:.83rem;display:grid;gap:4px;color:#cdd9dc}
select,input{min-width:0;width:100%;border-radius:7px;border:1px solid #89949b;background:#101b25;color:#fff;padding:9px;min-height:42px;font-size:16px}
button{border:1px solid #bcad85;background:#2b4258;color:#fff6df;border-radius:10px;min-height:45px;font-size:15px;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.35}
button.primary{background:#785338;border-color:#efc990}
button.chosen{outline:3px solid #edcf8c;outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#0e1e2c;border-radius:7px;padding:8px 4px;text-align:center;font-size:.73rem}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;color:#f4e9c9}
.enemybox{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.enemy{background:#122638;padding:12px;border:1px solid #556a74;border-radius:9px;min-width:0}
.enemy.dead{opacity:.45}
.enemy b{display:block;margin-bottom:8px}
.meter{height:10px;border:1px solid #8a979d;border-radius:7px;overflow:hidden;background:#08131d;margin:7px 0}
.fill{height:100%;background:#94b16e;transition:width .12s}
.hp .fill{background:#d78875}.mp .fill{background:#87afd0}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
#log{max-height:220px;overflow:auto;white-space:pre-wrap;font-size:.87rem;line-height:1.65;color:#f1e7d1}
.muted{color:#b2c3cf}#status{font-weight:700;color:#ead8a3}
@media(min-width:570px){.controls{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main>
<header><h1>鬼哭の花結び　戦闘検証</h1><a href="../index.html">本編へ</a></header>
<p class="note">B式v2の暫定数値を用いた操作可能な検証版です。<strong>本編と別動作</strong>で、保存データは読み書きしません。正式な敵分布・装備販売は未確定です。</p>
<fieldset><legend>戦闘条件</legend><div class="controls">
<label>地域<select id="region"></select></label>
<label>段<input id="dan" type="number" min="1" max="99" value="3"></label>
<label>装備段階<select id="tier"></select></label>
<label>覚醒段階<select id="awakening"><option value="0">なし</option><option value="1">第一</option><option value="2">第二</option></select></label>
</div><div style="display:flex;gap:10px;margin-top:10px"><button id="start" class="primary" style="flex:1">条件を反映して再戦</button><button id="alternate" style="flex:1">敵の組み合わせ変更</button></div></fieldset>
<section class="panel"><h2>緋月</h2><div id="stats" class="stats"></div><div id="health"></div><div id="tech"></div></section>
<section class="panel"><h2 id="enemyHeading">敵</h2><div id="enemies" class="enemybox"></div></section>
<section class="panel"><h2>行動</h2><div id="actions" class="actions">
<button id="attack" class="primary">戦う</button><button id="heal">つむぎ（技5）</button><button id="guard">守る</button><button id="retry">もう一度</button>
</div><p id="status" aria-live="polite">読み込み中…</p></section>
<section class="panel"><h2>戦闘の記録</h2><div id="log" role="log" aria-live="polite"></div></section>
<p class="note">検算：攻撃＝floor(攻/2−守/4)、乱数±1/16、最低保証は攻の約10%。回復の「つむぎ」は最大体力30%、技5。敵は生存している各1回ずつ反撃。実戦の行動順・複雑な状態異常・レア敵は未再現。獲得両は未決なので0として扱います。</p>
</main>
<script src="../js/battle-balance-engine.js?v=20261113"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),A=window.YK_BALANCE_ENGINE;
let data=null,player=null,group=null,choiceIndex=0,targetId=null,events=[];
const defaultTier={field:'T0',shrine_approach:'T1',cove:'T2',forest:'T4',waterfall_approach:'T5',fox_shrine:'T6',late_a:'T7',late_b:'T8',late_c:'T8'};
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function meter(value,total,css){return '<div class="meter '+css+'"><div class="fill" style="width:'+Math.max(0,Math.min(100,100*value/Math.max(1,total)))+'%"></div></div>';}
function populate(){
 const regions=data.proposals.regions;$('region').innerHTML=regions.map(r=>'<option value="'+escape(r.id)+'">'+escape(r.name)+'</option>').join('');
 $('tier').innerHTML=data.proposals.tiers.map(t=>'<option value="'+escape(t.id)+'">'+escape(t.id)+'</option>').join('');
 $('region').addEventListener('change',()=>{const r=regions.find(x=>x.id===$('region').value);if(!r)return;$('dan').value=r.dan;$('tier').value=defaultTier[r.id]||'T0';$('awakening').value=r.dan>=25?'2':r.dan>=10?'1':'0';choiceIndex=0;start();});
}
function start(){
 if(!data)return;
 const regionId=$('region').value,dan=Math.max(1,Math.min(99,Number($('dan').value)||1));
 player=A.hero(data,dan,$('tier').value,Number($('awakening').value));
 group=A.encounter(data,regionId,choiceIndex);targetId=group.enemies[0].id;
 events=['敵があらわれた。'];render();
}
function render(){
 if(!player||!group)return;
 $('stats').innerHTML=[['段',player.dan],['攻',player.atk],['守',player.def],['はやさ',player.speed]].map(([k,v])=>'<div class="stat">'+k+'<b>'+v+'</b></div>').join('');
 $('health').innerHTML='<small>体 '+player.hp+' / '+player.maxhp+'</small>'+meter(player.hp,player.maxhp,'hp');
 $('tech').innerHTML='<small>技 '+player.mp+' / '+player.maxmp+'　心 '+player.xp+' / '+A.expNeeded(player.dan)+'</small>'+meter(player.mp,player.maxmp,'mp');
 $('enemyHeading').textContent=group.regionName+'（'+group.enemies.filter(e=>e.hp>0).length+'体生存）';
 $('enemies').innerHTML=group.enemies.map(e=>'<button class="enemy '+(e.hp<=0?'dead':'')+' '+(e.id===targetId?'chosen':'')+'" data-target="'+escape(e.id)+'" '+(e.hp<=0?'disabled':'')+'><b>'+escape(e.name)+'</b><small>体 '+e.hp+'/'+e.maxhp+'　攻'+e.atk+'　守'+e.def+'</small>'+meter(e.hp,e.maxhp,'hp')+'</button>').join('');
 for(const b of $('enemies').querySelectorAll('[data-target]'))b.addEventListener('click',()=>{targetId=b.dataset.target;render();});
 const active=group.phase==='active';
 for(const id of ['attack','heal','guard'])$(id).disabled=!active||id==='heal'&&(player.mp<5||player.hp>=player.maxhp);
 $('status').textContent=active?'第'+group.turn+'手　敵を選んで行動':group.phase==='victory'?'勝利！ 心を獲得しました':'敗北。所持両の25%を失い、直前の町へ戻る想定です。';
 $('log').textContent=events.slice(-28).join('\n');$('log').scrollTop=$('log').scrollHeight;
}
function act(type){
 if(!player||!group||group.phase!=='active')return;
 const r=A.fight(data,player,group,{type,targetId},Math.random);
 if(r.type==='invalid'){events.push(r.reason);render();return;}
 for(const e of r.events){
  if(e.type==='attack')events.push('緋月の攻撃：'+e.target+'へ'+e.amount);
  if(e.type==='enemy')events.push(e.target+'の攻撃：'+e.amount+'ダメージ');
  if(e.type==='heal')events.push('つむぎ：体が'+e.amount+'回復（技5）');
  if(e.type==='guard')events.push('緋月は身を守った');
  if(e.type==='victory')events.push('勝利！ 心＋'+e.exp);
  if(e.type==='levelup')events.push(e.dan+'段になった。体と技が全回復');
  if(e.type==='defeat')events.push('敗北：'+e.goldLost+'両を失った（所持0なら0）');
 }
 targetId=group.enemies.find(e=>e.hp>0)?.id||null;
 render();
}
$('start').addEventListener('click',start);
$('retry').addEventListener('click',start);
$('alternate').addEventListener('click',()=>{if(!data)return;const r=data.proposals.regions.find(x=>x.id===$('region').value);choiceIndex=(choiceIndex+1)%r.choices.length;start();});
$('attack').addEventListener('click',()=>act('attack'));
$('heal').addEventListener('click',()=>act('heal'));
$('guard').addEventListener('click',()=>act('guard'));
fetch('../docs/battle/balance-v2-draft.json?v=20261113',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw Error('データの取得に失敗しました');return r.json()})
 .then(x=>{data=A.valid(x);populate();$('region').value='forest';$('dan').value='18';$('tier').value='T4';$('awakening').value='1';start();})
 .catch(e=>{$('status').textContent='読み込み失敗：'+e.message;});
})();
</script>
</body></html>
