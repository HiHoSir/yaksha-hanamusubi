<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>花霞野・高台 | フィールドマップチップ検査</title>
<base href="../../">
<style>
:root{color-scheme:dark;font-family:DotGothic16,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:#101b22;color:#f6f0e3;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
main{position:relative;display:flex;align-items:center;justify-content:center;width:100vw;height:100dvh}
#screen{display:block;max-height:100dvh;max-width:100vw;width:auto;height:auto;aspect-ratio:640/544;image-rendering:pixelated;background:#123;}
#top{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));background:#111b2bc9;border:1px solid #9a9c8755;padding:6px 12px;font-size:13px;letter-spacing:.06em;pointer-events:none}
#top small{font-size:10px;color:#dbd1b9}
#status{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));font-size:11px;text-align:right;background:#101921b3;padding:6px 10px;pointer-events:none}
#pad{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px);gap:2px;opacity:.72}
#pad button{border:1px solid #e5d7b260;background:#0c1c24ca;color:#ffefd2;border-radius:6px;font-size:19px;touch-action:none;user-select:none}
#pad button:active{background:#7c594eaa}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#legend{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));color:#eee4ca;font-size:10px;background:#102029bb;padding:5px 8px}
#rotate{display:none}
@media (orientation:portrait){#rotate{display:block;position:absolute;inset:0;background:#101b22ef;z-index:6;display:grid;place-items:center;text-align:center;font-size:17px;padding:30px}}
</style>
<script src="js/elevation-model.js"></script>
<script src="js/landscape.js"></script>
<script src="js/elevation-view.js"></script>
</head>
<body>
<main>
  <canvas id="screen" width="640" height="544" aria-label="既存32pxマップチップで組み立てた花霞野の高台"></canvas>
  <div id="top">花霞野 <small>— 春霞の高台 —</small></div>
  <div id="status">既存フィールド素材を読み込み中…</div>
  <div id="legend">←↑↓→ / 右の方向キーで移動　・　試作配置</div>
  <div id="pad" aria-label="移動操作">
    <button class="u" data-dir="u" aria-label="北">▲</button>
    <button class="l" data-dir="l" aria-label="西">◀</button>
    <button class="d" data-dir="d" aria-label="南">▼</button>
    <button class="r" data-dir="r" aria-label="東">▶</button>
  </div>
  <div id="rotate">横画面で確認してください</div>
</main>
<script>
(()=>{
"use strict";
const W=48,H=48,CELL=32,screen=document.getElementById("screen"),ctx=screen.getContext("2d"),status=document.getElementById("status");
ctx.imageSmoothingEnabled=false;
const m=Array.from({length:H},()=>Array(W).fill("grass"));
m.heights=m.map(row=>row.map(()=>0));
m.ramps=m.map(row=>row.map(()=>null));
m.roads=new Set();m.cornerCut=30;m.cornerProtected=new Set();
m.ladders=[];m.decorations=[];m.bridgeWaterCells=new Set();
m.occupiedTiles=new Set();m.elevationEnabled=true;m.elevationRise=20;
m.referencePlacedObjects=true;m.projectedHeights=true;m.paths=[];
const grass=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
// Northern undulating uplands are authored integer height cells, not painted perspective.
for(let y=4;y<=12;y++)for(let x=2;x<W-2;x++){
  if(y<=9+Math.round(2*Math.sin(x*.24)))m.heights[y][x]=1;
}
for(let y=7;y<=10;y++)for(let x=4;x<=17;x++)m[y][x]="forest";
// Two connected, visible terrace faces frame the playable overlook.
for(let y=29;y<=40;y++)for(let x=5;x<=42;x++){
  if(y>=29+Math.max(0,Math.round((Math.abs(x-24)-13)*.31)))m.heights[y][x]=1;
}
for(let y=34;y<=39;y++)for(let x=6;x<=12;x++)m.heights[y][x]=2;
for(let y=34;y<=39;y++)for(let x=37;x<=42;x++)m.heights[y][x]=2;
// A genuine level-0 -> level-1 northward ramp, using the production height model.
m.ramps[41][24]="n";
for(let y=38;y<=44;y++)m.roads.add("24,"+y);
// The winding waterway is its own animated terrain layer. No water baked into grass chips.
function streamX(y){return 24+Math.round(6*Math.sin((y-10)*.27));}
for(let y=11;y<=27;y++){const cx=streamX(y);for(let dx=-1;dx<=1;dx++)if(grass(cx+dx,y))m[y][cx+dx]="river";}
for(let y=19;y<=27;y++)for(let x=3;x<=13;x++)if((x+y)%9===0)m[y][x]="forest";
// Crossing at row 21 is a real three-cell bridge in the logical tile layer.
const bx=streamX(21);for(let x=bx-1;x<=bx+1;x++)m[21][x]="bridge";
for(let x=bx-6;x<bx+7;x++)m.roads.add(x+",21");
function at(kind,x,y,width=32,height=32,solid=false){
  if(!grass(x,y)||m[y][x]==="river")return;
  const o={kind,x:x*CELL,y:(y+1)*CELL-height,width,height,foot:(y+1)*CELL,
    supportHeight:m.heights[y][x],contactTiles:[[x,y]],occupiedTiles:solid?[[x,y]]:[]};
  m.decorations.push(o);
  if(solid)m.occupiedTiles.add(x+","+y);
}
// A few identifiable landmarks: settlement, shrine and a distant torii.
at("newVillage",39,16,64,32,true);
at("newTorii",34,12,32,32,true);
at("newTorii",17,21,32,32,true);
at("newHouse",40,18,32,32,true);
// Existing approved field-style sakura variants; no new painting or upscaled scene.
for(let y=13;y<=27;y++)for(let x=3;x<=44;x++){
  if(m[y][x]!=="grass")continue;
  const n=(x*71+y*43+x*y*13)%43;
  if(n===0||n===2||n===9)at((x+y)%3?"sakuraPink":"sakuraPale",x,y,32,32);
  else if(n===5||n===13)at("flowers",x,y,40,24);
  else if(n===17&&y<20)at("newTrees",x,y);
}
for(let y=7;y<=12;y++)for(let x=3;x<=43;x++){
  if((x*19+y*11)%9===0)at((x+y)%2?"newTrees":"sakuraPale",x,y,32,32);
}
for(let y=29;y<=35;y++)for(let x=6;x<=43;x++){
  if(m.heights[y][x]===1&&Math.abs(x-24)>3&&((x*23+y*11)%17===0))at("flowers",x,y,40,24);
}
at("sakuraPink",12,32,32,32);
at("sakuraPale",37,31,32,32);
YK_ELEVATION.prepare(m);
const hero={x:24*CELL+16,y:32*CELL+16,dir:"u",frame:0};
const dirs={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
let art=null,moving=false,frame=0,drag=null;
function move(dir){
  if(!art)return;
  hero.dir=dir;const d=dirs[dir],nx=hero.x+d[0]*CELL,ny=hero.y+d[1]*CELL;
  if(YK_ELEVATION.canMove(m,hero.x,hero.y,nx,ny)){
    hero.x=nx;hero.y=ny;hero.frame=hero.frame===1?2:1;
  }else hero.frame=0;
  draw();
}
function draw(){
  if(!art)return;
  const h=YK_ELEVATION.height(m,hero.x,hero.y);
  YK_ELEVATION_VIEW.render(ctx,m,art,{x:hero.x,y:hero.y,height:h,dir:hero.dir,frame:hero.frame},
    {camera:{x:hero.x,y:hero.y,preset:0},rise:20});
  status.textContent="高台から花霞野を望む　｜　32pxフィールド";
}
function load(src){return new Promise((resolve,reject)=>{
  const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error("素材の読込に失敗: "+src));im.src=src;
});}
function animateWater(){
  if(!art)return;
  const frame=Math.floor(performance.now()/440)%2;
  if(frame!==lastWater){
    waterCtx.clearRect(0,0,64,64);waterCtx.drawImage(waterAtlas,frame*64,0,64,64,0,0,64,64);
    lastWater=frame;draw();
  }
}
let waterAtlas=null,waterCtx=null,lastWater=-1;
Promise.all([
  YK_ELEVATION_VIEW.load(),
  load("assets/settlement-editor/seasonal-trees-v1/trees_1cell_sakura_pink.png"),
  load("assets/settlement-editor/seasonal-trees-v1/trees_1cell_sakura_pale.png"),
  load("assets/field-map-objects-v3/village.png"),
  load("assets/field-map-objects-v3/house.png"),
  load("assets/field-map-objects-v3/torii.png"),
  load("assets/field-map-objects-v3/trees.png"),
  load("assets/terrain/landscape-v2/flowers.png"),
  load("assets/characters/hizuki/field-sd-v2/walk-atlas-32.png"),
  load("assets/animation/fluid-v1/field-water.png")
]).then(([base,sakuraPink,sakuraPale,newVillage,newHouse,newTorii,newTrees,flowers,fieldHero,water])=>{
  art={...base,sakuraPink,sakuraPale,newVillage,newHouse,newTorii,newTrees,flowers,hero:fieldHero,
    waterAnimated:true,river:base.sea};
  waterAtlas=water;const canvas=document.createElement("canvas");canvas.width=canvas.height=64;
  waterCtx=canvas.getContext("2d");waterCtx.imageSmoothingEnabled=false;
  art.sea=art.river=canvas;
  animateWater();draw();setInterval(animateWater,440);
}).catch(err=>{status.textContent="読み込み失敗";console.error(err);
  ctx.fillStyle="#201e26";ctx.fillRect(0,0,640,544);
  ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.fillText(err.message,18,70);
});
window.addEventListener("keydown",e=>{
  const dir={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r"}[e.key];
  if(dir){e.preventDefault();move(dir);}
});
let repeat=null;function stop(){if(repeat){clearInterval(repeat);repeat=null;}}
document.querySelectorAll("[data-dir]").forEach(b=>{
  b.addEventListener("pointerdown",e=>{e.preventDefault();stop();move(b.dataset.dir);repeat=setInterval(()=>move(b.dataset.dir),175);b.setPointerCapture(e.pointerId);});
  b.addEventListener("pointerup",stop);b.addEventListener("pointercancel",stop);b.addEventListener("lostpointercapture",stop);
});
screen.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];});
screen.addEventListener("pointerup",e=>{
  if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
});
})();
</script>
</body>
</html>
