<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10202a">
<title>鬼哭の花結び｜緋月・左寄り戦闘画面プレビュー</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081724;color:#f7e7c8;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
#battle{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;overflow:hidden;isolation:isolate;
 padding:calc(env(safe-area-inset-top,0px) + 7px) calc(env(safe-area-inset-right,0px) + 9px) calc(env(safe-area-inset-bottom,0px) + 9px) calc(env(safe-area-inset-left,0px) + 9px);
 background:linear-gradient(180deg,rgba(8,22,31,.13) 0%,rgba(12,26,38,.10) 47%,rgba(5,11,25,.66) 100%),url("assets/scenes/battle-grass-v1.png") center /cover no-repeat}
#battle:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 53%,#0a17252a 100%);pointer-events:none}
#hero{position:absolute;z-index:1;left:36%;bottom:5%;width:min(124vw,540px);height:auto;aspect-ratio:512/384;
 transform:translateX(-50%);transform-origin:center 62%;object-fit:contain;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(1px 2px 1px rgba(5,9,18,.75))}
#enemy{position:absolute;z-index:0;left:70%;top:31%;width:min(27vw,210px);max-height:34dvh;object-fit:contain;transform:translate(-50%,-50%);image-rendering:pixelated;filter:drop-shadow(2px 4px 3px #111b);pointer-events:none}
header,.stats,.message,.commands,.notice{position:relative;z-index:3}
header{display:flex;align-items:center;justify-content:space-between;min-height:27px;padding:5px 10px;border:1px solid #e5c38d88;border-radius:4px;background:#081727a6}
header span:last-child{font-size:11px;color:#ead6b0}
.stats{align-self:flex-start;display:flex;justify-content:space-between;align-items:center;gap:14px;width:min(100%,480px);min-height:41px;padding:5px 12px;background:#081823d9;border:1px solid #e9c990b3;border-radius:4px;white-space:nowrap;font-size:13px}
.stats strong{font-size:14px}
.message{min-height:37px;display:flex;align-items:center;padding:7px 12px;border:1px solid #f1d59acc;background:#081522db;border-radius:4px;font-size:14px}
.commands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.commands button{min-height:44px;border:1px solid #edd098c2;border-radius:4px;background:#091929e1;color:#fff5e1;font-size:14px;font-weight:600;padding:8px 3px}
.commands button.selected{outline:2px solid #f8dc9e;outline-offset:-2px;background:#753347e6}
.notice{align-self:flex-end;display:inline-flex;gap:6px;padding:3px 7px;background:#0817249c;font:10px sans-serif;color:#d8e4e8;pointer-events:none}
@media (orientation:portrait){
 #hero{left:22%;width:min(128vw,540px);bottom:9%}
 #enemy{left:68%;top:35%;width:min(35vw,180px)}
 .stats{width:100%;min-height:38px}
 .message{min-height:34px;font-size:13px}
 .commands button{min-height:43px}
}
@media (orientation:landscape){
 #hero{left:36%;width:min(56vw,510px);bottom:3%}
 .stats{margin-top:auto;width:min(43%,420px);min-height:35px}
 .message{min-height:32px;padding:4px 10px;font-size:13px}
 .commands{grid-template-columns:repeat(6,minmax(0,1fr))}
 .commands button{min-height:41px;max-height:45px;font-size:clamp(12px,1.8vw,15px)}
 #battle{gap:4px}
}
@media (orientation:landscape) and (max-height:400px){
 #hero{width:min(51vw,470px);bottom:0%}
 .stats{min-height:31px;padding:2px 7px}
 .message{min-height:27px;padding:3px 9px}
 .commands button{min-height:36px}
 #battle{gap:3px}
}
</style>
</head>
<body>
<main id="battle" aria-label="緋月の戦闘画面・位置確認用">
<header><strong>戦闘</strong><span>左寄せレイアウト検査用</span></header>
<img id="enemy" src="assets/enemies/redoni.png" alt="敵のサンプル">
<img id="hero" src="assets/characters/hizuki/hana-20261107/battle/battle-idle-512.png" alt="緋月の待機ポーズ">
<section class="stats" aria-label="緋月の能力値"><strong>緋月 12段</strong><span>体 86/100</span><span>技 22/30</span></section>
<section class="message" id="message" aria-live="polite">どうする？</section>
<nav class="commands" aria-label="モーションの検査">
<button type="button" class="selected" data-pose="idle">待機</button>
<button type="button" data-pose="attack">攻撃</button>
<button type="button" data-pose="skill">術</button>
<button type="button" data-pose="guard">防御</button>
<button type="button" data-pose="hit">被弾</button>
<button type="button" data-pose="victory">勝利</button>
</nav>
<aside class="notice">※戦闘レイアウト・6ポーズ確認専用。ゲーム処理・セーブなし。</aside>
</main>
<script>
const root="assets/characters/hizuki/hana-20261107/battle/";
const poseLabels={idle:"どうする？",attack:"緋月の攻撃！",skill:"緋月の花結び！",guard:"緋月は身を守っている！",hit:"緋月は攻撃を受けた！",victory:"緋月の勝利！"};
const art=document.querySelector("#hero"),msg=document.querySelector("#message");
for(const pose of Object.keys(poseLabels)){const i=new Image();i.src=root+"battle-"+pose+"-512.png";}
document.querySelectorAll("[data-pose]").forEach(button=>button.addEventListener("click",()=>{
 const pose=button.dataset.pose;art.src=root+"battle-"+pose+"-512.png";art.alt="緋月・"+button.textContent;
 msg.textContent=poseLabels[pose];document.querySelectorAll("[data-pose]").forEach(b=>b.classList.toggle("selected",b===button));
}));
</script>
</body>
</html>
