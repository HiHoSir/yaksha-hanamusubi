<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12212a"><title>鬼哭の花結び | 新旧歩行アセット実動プレビュー</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e1b21;color:#f3e4c7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
h1{font-size:17px;font-weight:700;margin:0}p{margin:0;font-size:12px;color:#c9cdbf;line-height:1.4}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
select,button{background:#213742;color:#fff7d6;border:1px solid #bd9b6a;border-radius:7px;min-height:44px;font-size:14px;padding:6px 10px}
.stage{position:relative;flex:1;min-height:240px;max-height:70dvh;border:2px solid #b4a17c;border-radius:8px;overflow:hidden;background:#233e42;touch-action:none}
canvas{display:block;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated}
.tag{position:absolute;top:5px;left:6px;font-size:11px;padding:3px 7px;border-radius:4px;background:#0a1925cc;pointer-events:none}
.sourceProof{position:absolute;top:6px;right:6px;width:min(170px,52%);padding:5px;border:1px solid #f2d378;border-radius:6px;background:#091727ec;color:#ffeed1;pointer-events:none;z-index:2;text-align:center;font-size:11px}
.sourceProof[hidden]{display:none}
.sourceProof strong{display:block;margin-bottom:4px;font-size:11px;font-weight:600}
.sourceProof canvas{width:100%;height:auto;aspect-ratio:240/112;display:block;object-fit:contain;image-rendering:pixelated}
.sourceProof small{display:block;margin-top:3px;font-size:10px;line-height:1.35;color:#f6ebcb}
@media(max-width:390px){.sourceProof{width:148px}.sourceProof small{font-size:9px}}
.controls{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,46px);gap:4px;justify-content:center;align-items:center;touch-action:manipulation}
.controls button{font-size:20px;font-weight:700;min-width:64px;min-height:44px;padding:4px}
.controls button:active{background:#8b5361}
#status{min-height:21px}
@media(orientation:landscape){main{max-width:none;padding-top:5px;display:grid;grid-template-columns:1fr 248px;grid-template-rows:auto 1fr auto;gap:7px}h1{grid-column:1/3}.stage{grid-column:1;grid-row:2/4;max-height:86dvh}.toolbar,.controls,#status,.helper{grid-column:2}.toolbar{align-self:start}.helper{display:none}}
</style>
</head>
<body>
<main>
<h1>鬼哭の花結び — 緋月・歩行グラフィック比較・連続歩行対応</h1>
<div class="toolbar"><label>歩行画像：
<select id="variant"><option value="hana">新・80×112原画</option><option value="sd">旧・32px SD</option></select>
</label><label>速度：<select id="walkSpeed"><option value="slow" selected>ゆっくり</option><option value="normal">通常</option></select></label>
<label>歩行：<select id="walkCycle" aria-label="歩行コマの再生方法"><option value="neutral" selected>足揃えあり</option><option value="direct">足揃えなし</option></select></label>
<span id="pose">正面・待機</span></div>
<div class="stage" id="stage" aria-label="鬼灯村のマップで歩行画像を比較">
<canvas id="screen" width="768" height="640"></canvas><span class="tag">32px移動格子・画像は選択時のみ変更</span>
<div class="sourceProof" id="sourceProof" aria-label="実際に描画されるアトラス元コマ">
<strong>使用中の元コマ（黄枠）</strong>
<canvas id="sourceProofCanvas" width="240" height="112" aria-label="現在の向きの静止・A・Bを並べた元画像"></canvas>
<small id="sourceProofLabel">読込中</small>
</div>
</div>
<div class="controls" role="group" aria-label="4方向移動">
<span></span><button data-dir="u" aria-label="上へ歩く">↑</button><span></span>
<button data-dir="l" aria-label="左へ歩く">←</button><button data-dir="d" aria-label="下へ歩く">↓</button><button data-dir="r" aria-label="右へ歩く">→</button>
</div>
<p class="helper">歩行方式を「足揃えあり／なし」で切替。長押しで連続歩行し、黄枠で使用中のコマを確認できます。移動速度・32px格子・アセットは同じです。</p>
<p id="status" role="status">地面と歩行素材を読み込んでいます。</p>
</main>
<script src="js/hizuki-hana-walk.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),view=$("screen"),ctx=view.getContext("2d");
const proofCanvas=$("sourceProofCanvas"),proofCtx=proofCanvas.getContext("2d");
const ground=new Image(),sd=new Image();
let terrainReady=false,sdReady=false,collision=new Set(),collisionReady=false;
// Comparison only: movement and 32px collisions are unchanged in both modes.
// "neutral": A -> feet-together -> B -> feet-together, once per walking tile.
// "direct": A -> B without an intermediate neutral frame.
const SPEEDS={slow:{step:340,slide:300},normal:{step:190,slide:166}};
let cadence=SPEEDS.slow,gaitMode="neutral";
function stepFrame(at=performance.now()){
 // Same cadence helper is now used in the actual game, avoiding preview drift.
 return YK_HANA_WALK.frameAt(state.frame,at-state.stepAt,cadence.step,gaitMode==="neutral");
}
const state={x:336,y:528,fromX:336,fromY:528,stepAt:-1000,stride:0,dir:"d",frame:1,mode:"hana"};
$("walkCycle").value=gaitMode;
let holdOwner=null,heldDir=null,repeatTimer=null,idleTimer=null,animationFrame=null;
const key={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},labels={u:"背面",d:"正面",l:"左向き",r:"右向き"};
ground.onload=()=>{terrainReady=true;draw()};ground.onerror=()=>{$("status").textContent="背景読み込みエラー";draw()};
ground.src="assets/maps/hozuki-village-v1/ground.png";
sd.onload=()=>{sdReady=true;draw()};sd.src="assets/characters/hizuki/field-sd-v3/walk-atlas-32.png";
YK_HANA_WALK.ensure(draw);
fetch("assets/maps/hozuki-village-v1/collision.json").then(r=>{if(!r.ok)throw Error("collision");return r.json()})
 .then(m=>{collision=new Set(m.blocked.map(([x,y])=>x+","+y));collisionReady=true;draw();})
 .catch(()=>{$("status").textContent="衝突データを読めません（移動検査制限あり）";});
function visiblePosition(at=performance.now()){
 const t=Math.min(1,Math.max(0,(at-state.stepAt)/cadence.slide));
 return {x:state.fromX+(state.x-state.fromX)*t,y:state.fromY+(state.y-state.fromY)*t};
}
function animate(){
 animationFrame=null;draw();
 if(performance.now()-state.stepAt<cadence.slide)
  animationFrame=requestAnimationFrame(animate);
}
function scheduleIdle(){
 clearTimeout(idleTimer);
 idleTimer=setTimeout(()=>{if(heldDir===null){state.frame=1;draw();}},cadence.step+120);
}
function tryMove(dir){
 if(!collisionReady){$("status").textContent="通行判定を読み込んでいます。";return false;}
 const [dx,dy]=key[dir],nx=state.x+dx*32,ny=state.y+dy*32;
 state.dir=dir;
 if(nx<16||ny<16||nx>=672||ny>=576||collision.has(Math.floor(nx/32)+","+Math.floor(ny/32))){
  $("status").textContent="その方向は通行できません。";draw();return false;
 }
 const at=performance.now(),from=visiblePosition(at);
 state.fromX=from.x;state.fromY=from.y;
 state.x=nx;state.y=ny;state.stepAt=at;
 // Keep the stride counter through the idle pose; otherwise each tap repeats
 // step A and the approved step B can never be inspected.
 state.stride++;state.frame=state.stride%2===1?0:2;
 $("status").textContent=(state.mode==="hana"?"新歩行":"旧SD")+" ／ "+labels[dir]+
  " ／ "+(state.frame===0?"一歩目":"二歩目")+" ／ "+state.stride+"歩 ／ マス ("+
  Math.floor(nx/32)+","+Math.floor(ny/32)+")";
 clearTimeout(idleTimer);
 if(!animationFrame)animationFrame=requestAnimationFrame(animate);
 draw();
 if(heldDir===null)scheduleIdle();
 return true;
}
function stopHold(owner=null){
 if(owner!==null&&owner!==holdOwner)return;
 clearInterval(repeatTimer);repeatTimer=null;heldDir=null;holdOwner=null;
 scheduleIdle();
}
function startHold(owner,dir){
 if(!key[dir])return;
 if(holdOwner===owner&&heldDir===dir)return;
 stopHold();
 holdOwner=owner;heldDir=dir;
 tryMove(dir);
 repeatTimer=setInterval(()=>{if(heldDir!==null)tryMove(heldDir);},cadence.step);
}
function draw(){
 const width=view.width,height=view.height,zoom=1.65;
 ctx.clearRect(0,0,width,height);
 ctx.save();ctx.imageSmoothingEnabled=false;
 ctx.fillStyle="#284a43";ctx.fillRect(0,0,width,height);
 const visual=visiblePosition();
 ctx.translate(width/2-visual.x*zoom,height*.56-visual.y*zoom);ctx.scale(zoom,zoom);
 if(terrainReady)ctx.drawImage(ground,0,0);
 const foot=visual.y+16,poseFrame=stepFrame();
 ctx.fillStyle="#10182062";ctx.beginPath();ctx.ellipse(visual.x,foot,12,4,0,0,Math.PI*2);ctx.fill();
 if(state.mode==="hana"&&YK_HANA_WALK.ready()){
  YK_HANA_WALK.draw(ctx,visual.x,foot,state.dir,poseFrame,48);
 }else if(sdReady){
  const row={d:0,u:1,r:2,l:3}[state.dir],col=poseFrame===1?0:poseFrame===0?1:2;
  ctx.drawImage(sd,col*32,row*32,32,32,visual.x-16,foot-32,32,32);
 }
 ctx.restore();
 const poseName=poseFrame===1?"直立":poseFrame===0?"歩行A":"歩行B";
 $("pose").textContent=labels[state.dir]+"・"+poseName;
 // Proof calls the same sourceCell() as the production sprite drawing.
 // The yellow outline is not a second independently computed frame index.
 $("sourceProof").hidden=state.mode!=="hana";
 if(state.mode==="hana"){
  const actualCell=YK_HANA_WALK.drawSourceProof(proofCtx,state.dir,poseFrame);
  if(actualCell){
   $("sourceProofLabel").textContent=labels[state.dir]+" "+poseName+"："+
     (actualCell.row+1)+"行目 "+(actualCell.col+1)+"列目";
  }
 }
 if(state.mode==="hana"&&!YK_HANA_WALK.ready())$("status").textContent="新歩行アトラスを読み込んでいます。";
}
$("variant").addEventListener("change",e=>{state.mode=e.target.value;draw();$("status").textContent=(state.mode==="hana"?"新歩行":"旧SD")+"に切り替えました（マス座標と衝突判定は不変）。"});
$("walkSpeed").addEventListener("change",e=>{
 cadence=SPEEDS[e.target.value]||SPEEDS.slow;
 if(heldDir!==null){
  const owner=holdOwner,dir=heldDir;
  stopHold();startHold(owner,dir);
 }
 draw();
});
$("walkCycle").addEventListener("change",e=>{
 gaitMode=e.target.value==="direct"?"direct":"neutral";
 draw();
 $("status").textContent=gaitMode==="neutral"?"足揃えあり：A → 直立 → B → 直立":"足揃えなし：A → B";
});
// iPhone: pointer capture keeps held input active while the thumb moves out of
// a 44px button. No click handler for pointer-activated taps (prevents double steps).
document.querySelectorAll("[data-dir]").forEach(button=>{
 button.addEventListener("pointerdown",e=>{
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  button.setPointerCapture?.(e.pointerId);
  startHold(button,button.dataset.dir);
 });
 button.addEventListener("pointerup",()=>stopHold(button));
 button.addEventListener("pointercancel",()=>stopHold(button));
 button.addEventListener("lostpointercapture",()=>stopHold(button));
 button.addEventListener("click",e=>{if(e.detail===0)tryMove(button.dataset.dir);});
});
const keyboardDirs={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"};
document.addEventListener("keydown",e=>{
 const dir=keyboardDirs[e.key];if(!dir)return;e.preventDefault();
 if(holdOwner!=="keyboard"||heldDir!==dir)startHold("keyboard",dir);
});
document.addEventListener("keyup",e=>{
 if(keyboardDirs[e.key]===heldDir&&holdOwner==="keyboard")stopHold("keyboard");
});
// Drag in the map: a thumb held beyond 18px moves repeatedly and changes
// direction with the drag, instead of taking exactly one step on pointerup.
let drag=null;
const stage=$("stage");
stage.addEventListener("pointerdown",e=>{
 if(e.button!==undefined&&e.button!==0)return;
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,active:false};
 stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.hypot(dx,dy)<18){if(drag.active)stopHold(stage);drag.active=false;return;}
 const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u");
 drag.active=true;
 if(holdOwner!==stage||heldDir!==dir)startHold(stage,dir);
});
stage.addEventListener("pointerup",e=>{
 if(!drag||drag.id!==e.pointerId)return;
 // A short flick that ends before pointermove still moves one grid cell.
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.active&&Math.hypot(dx,dy)>=18)
  tryMove(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
 drag=null;stopHold(stage);
});
stage.addEventListener("pointercancel",()=>{drag=null;stopHold(stage)});
stage.addEventListener("lostpointercapture",()=>{drag=null;stopHold(stage)});
window.addEventListener("blur",()=>{drag=null;stopHold();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){drag=null;stopHold();}});
})();
</script>
</body>
</html>
