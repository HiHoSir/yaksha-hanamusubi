<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101a18"><title>鬼哭の花結び｜冒険風景・一画面美術検証</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#101a18;color:#f3ead4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 5%,#29362a 0%,#101a18 72%)}header{width:min(100%,760px);padding:15px 17px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}h1{font-size:16px;letter-spacing:.08em;margin:0;font-weight:700}header small{font-size:10px;white-space:nowrap;color:#b8c7b1}.viewer{width:min(100%,760px);position:relative;overflow:hidden;background:#0d292a;border:1px solid #475947;box-shadow:0 14px 36px #0009}.viewer canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;touch-action:none}.viewer .light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 24% 4%,rgba(255,235,174,.2),transparent 54%),linear-gradient(122deg,rgba(255,208,136,.08),transparent 36%,rgba(31,84,87,.09) 98%);mix-blend-mode:screen;opacity:.85}.viewer.ambient-off .light{opacity:0}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#122528e8;font-size:13px;color:#eee6c7;white-space:pre-line;text-align:center;padding:22px}.loading[hidden]{display:none}.bar{width:min(100%,760px);padding:11px 12px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}.hint{font-size:12px;color:#e5dec0;line-height:1.6;min-height:33px}.toggles{display:flex;gap:7px}button{border:1px solid #6c7a61;border-radius:8px;background:#283930;color:#f3ead4;padding:9px 12px;font:inherit;touch-action:manipulation}.toggles button{font-size:11px;white-space:nowrap}button:active{background:#52684e}.controls{margin:0 auto;width:min(100%,760px);padding:0 12px 18px;display:flex;justify-content:center;gap:20px;align-items:center}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,49px);gap:5px}.dpad button{padding:0;font-size:22px;font-weight:bold}.dpad button:first-child{grid-column:2;grid-row:1}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}.note{max-width:330px;color:#b4c5ac;font-size:11px;line-height:1.65}footer{padding:0 20px 20px;font-size:10px;color:#82968a;text-align:center}@media (max-width:420px){header{padding:12px}h1{font-size:13px}.bar{align-items:flex-start}.dpad{grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,43px)}.note{max-width:190px}.toggles button{padding:8px}}
</style></head><body>
<header><h1>鬼哭の花結び <span style="font-weight:400">｜冒険風景</span></h1><small>美術検証 v0.2 · 村用素材統一</small></header>
<div class="viewer" id="viewer"><canvas id="scene" width="640" height="480" aria-label="緋月が歩ける和風フィールドの美術検証"></canvas><div class="light" aria-hidden="true"></div><div class="loading" id="loading">採用済みのゲーム素材を読み込み中…</div></div>
<div class="bar"><div class="hint" id="hint">緋月と一緒に、村外れの花道を歩いてみよう。</div><div class="toggles"><button id="lightButton" type="button" aria-pressed="true">光：ON</button><button id="gridButton" type="button" aria-pressed="false">検査：OFF</button></div></div>
<div class="controls"><div class="dpad" aria-label="移動操作"><button data-dir="up" aria-label="上へ">↑</button><button data-dir="left" aria-label="左へ">←</button><button data-dir="down" aria-label="下へ">↓</button><button data-dir="right" aria-label="右へ">→</button></div><div class="note">方向ボタン・キーボード・画面スワイプで移動。<br>移動は32px単位、現行の緋月SD v3と村用の統一素材を使用。ゲーム本体のマップ・セーブ・イベントは変更しません。</div></div>
<footer>旧ワールド地図用アイコン・別世代の鳥居や橋を除外した、村用素材統一の歩行検証です。美術採用前の候補です。</footer>
<script>
(()=>{'use strict';
 const ROOT='https://hihosir.github.io/yaksha-hanamusubi/';
 const TILE=32,W=30,H=23;const CAN=document.getElementById('scene'),ctx=CAN.getContext('2d');ctx.imageSmoothingEnabled=false;
 const viewer=document.getElementById('viewer'),hint=document.getElementById('hint'),loading=document.getElementById('loading');
 const assets={
  hero:['assets/characters/hizuki/field-sd-v3/walk-atlas-32.png',96,128],
  grass:['assets/terrain/grass-v1/grass.png',256,256],
  tree:['assets/settlements/common-v1/tree.png',192,158],
  home:['assets/settlements/common-v1/home.png',256,175],
  rocks:['assets/settlements/common-v1/rocks.png',112,67],
  well:['assets/settlements/common-v1/well.png',80,98],
  garden:['assets/settlements/common-v1/garden.png',160,95],
  fence:['assets/settlements/common-v1/fence.png',128,72],
  flower:['assets/settlements/common-v1/wildflowers-4x4.png',128,128]
 };
 const images={},errors=[];
 // Art-direction lock: world-map landmarks, old quarter-view props and
 // one-off waterfall imagery are NEVER mixed with village walk-scale objects.
 const OBJECT_FAMILY='assets/settlements/common-v1/';
 const ground=Array.from({length:H},()=>Array.from({length:W},()=> 'grass'));
 const objects=[];
 // Author each render rectangle independently of ground-contact and blocking cells.
 // All occupiedTiles are explicitly specified; nothing is deduced from PNG bounds.
 const put=(kind,centerX,footRow,width,occupiedTiles,contactTiles=occupiedTiles)=>{
  const [,sw,sh]=assets[kind];
  const h=Math.round(width*sh/sw),footY=(footRow+1)*32;
  objects.push({kind,x:Math.round((centerX+.5)*32-width/2),y:footY-h,w:width,h,
   footY,contactTiles,occupiedTiles,sourceFamily:OBJECT_FAMILY,layer:'object'});
 };
 // A small countryside destination: one home, a well and fields.
 // The house entrance at (15,8) and approach at (15,9) remain walkable.
 put('home',15,8,192,
  [[13,7],[14,7],[15,7],[16,7],[17,7],[18,7],[13,8],[14,8],[16,8],[17,8],[18,8]],
  [[13,8],[14,8],[15,8],[16,8],[17,8],[18,8]]);
 put('well',9,12,64,[[9,12]]);
 put('garden',20,12,128,[[19,12],[20,12],[21,12]]);
 put('fence',20,14,96,[[19,14],[20,14],[21,14]]);
 put('rocks',7,15,72,[[7,15]]);
 put('rocks',23,17,80,[[23,17]]);
 // The canopy of a tree is allowed to overhang passable adjacent cells.
 // Only its authored single-trunk cell blocks walking.
 const treeSlots=[[2,4,144],[7,3,132],[10,3,144],[23,4,140],
  [3,11,144],[3,17,136],[6,21,148],[10,21,132],
  [25,10,140],[26,18,138],[21,21,144]];
 for(const [cx,row,w] of treeSlots)put('tree',cx,row,w,[[cx,row]]);
 const occupiedTiles=new Set();for(const o of objects)for(const [x,y] of o.occupiedTiles)occupiedTiles.add(`${x},${y}`);
 function passable(x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<W&&y>=0&&y<H&&!occupiedTiles.has(`${x},${y}`);}
 // Wildflowers use the same village family, appear only on unoccupied floor,
 // and leave the principal walking corridor clear for readable composition.
 const authoredFlowers=[];for(let y=3;y<H-1;y++)for(let x=1;x<W-1;x++){
  const edge=(x<=7||x>=23||y>=18);
  const beside=(x===11&&y>=10&&y<=17)||(x>=18&&x<=22&&y<=16);
  if((edge||beside)&&((x*37+y*19)%11===0||(x*17+y*7)%23===2)
   &&passable(x,y))authoredFlowers.push({x,y,index:(x*3+y*7)%16});
 }
 function validate(){const issues=[],seen=new Set();
  for(const o of objects){
   if(o.sourceFamily!==OBJECT_FAMILY)issues.push('mixed object family '+o.kind);
   if(!Number.isFinite(o.footY)||!Number.isFinite(o.w)||!Number.isFinite(o.h))issues.push('render anchor '+o.kind);
   for(const [x,y] of o.occupiedTiles){const k=x+','+y;
    if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||x>=W||y<0||y>=H)issues.push('invalid occupied tile '+o.kind);
    if(seen.has(k))issues.push('overlap '+k);seen.add(k);
   }
  }
  if(!passable(15,15))issues.push('blocked start');
  const q=[[15,15]],visited=new Set(['15,15']);
  for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
    const a=x+dx,b=y+dy,k=a+','+b;
    if(!visited.has(k)&&passable(a,b)){visited.add(k);q.push([a,b]);}
  }}
  for(const [x,y,name] of [[15,9,'home approach'],[15,8,'home entrance'],[9,13,'well approach'],[23,14,'garden approach'],[14,20,'south trail']])if(!visited.has(x+','+y))issues.push('unreachable '+name);
  return {issues,reachable:visited.size,objects:objects.length,source:OBJECT_FAMILY};
 }
 const audit=validate();console.info('FIELD_ART_PILOT_AUDIT',audit);if(audit.issues.length)console.error('FIELD_ART_PILOT_ISSUES',audit.issues);
 const start={x:15,y:15},hero={x:start.x,y:start.y,fromX:start.x,fromY:start.y,toX:start.x,toY:start.y,dir:0,moving:false,t0:0};
 const order={down:0,up:1,right:2,left:3};const step=[[0,1],[0,-1],[1,0],[-1,0]];
 const overlay={grid:false,light:true};document.getElementById('gridButton').onclick=()=>{overlay.grid=!overlay.grid;document.getElementById('gridButton').textContent='検査：'+(overlay.grid?'ON':'OFF');document.getElementById('gridButton').setAttribute('aria-pressed',String(overlay.grid));};
 document.getElementById('lightButton').onclick=()=>{overlay.light=!overlay.light;viewer.classList.toggle('ambient-off',!overlay.light);document.getElementById('lightButton').textContent='光：'+(overlay.light?'ON':'OFF');document.getElementById('lightButton').setAttribute('aria-pressed',String(overlay.light));};
 function attempt(dir,time=performance.now()){const nd=order[dir];if(nd===undefined)return;hero.dir=nd;if(hero.moving)return;const [dx,dy]=step[nd],nx=hero.x+dx,ny=hero.y+dy;if(!passable(nx,ny))return;hero.fromX=hero.x;hero.fromY=hero.y;hero.toX=nx;hero.toY=ny;hero.t0=time;hero.moving=true;}
 let pressed=null,pressTimer=0;for(const button of document.querySelectorAll('[data-dir]')){const d=button.dataset.dir;button.addEventListener('pointerdown',e=>{e.preventDefault();pressed=d;button.setPointerCapture(e.pointerId);attempt(d);});button.addEventListener('pointerup',()=>{pressed=null});button.addEventListener('pointercancel',()=>{pressed=null});}
 const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
 window.addEventListener('keydown',e=>{const d=keyMap[e.key];if(d){e.preventDefault();pressed=d;attempt(d)}});window.addEventListener('keyup',e=>{if(keyMap[e.key]===pressed)pressed=null});
 let touch=null;CAN.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});CAN.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const p=e.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;attempt(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));},{passive:true});
 const drawTile=(im,cx,cy,x,y,n)=>ctx.drawImage(im,(cx%n)*32,(cy%n)*32,32,32,x,y,32,32);
 const compact=(n)=>Math.floor(n);
 function update(time){if(hero.moving){const progress=Math.min(1,(time-hero.t0)/185);if(progress>=1){hero.x=hero.toX;hero.y=hero.toY;hero.moving=false;}}
  if(pressed&&!hero.moving&&time-pressTimer>=160){attempt(pressed,time);pressTimer=time;}
  const hx=hero.moving?hero.fromX+(hero.toX-hero.fromX)*Math.min(1,(time-hero.t0)/185):hero.x;
  const hy=hero.moving?hero.fromY+(hero.toY-hero.fromY)*Math.min(1,(time-hero.t0)/185):hero.y;
  const camX=Math.max(0,Math.min(W*32-CAN.width,(hx+.5)*32-CAN.width/2));
  const camY=Math.max(0,Math.min(H*32-CAN.height,(hy+.5)*32-CAN.height/2));
  return {hx,hy,camX,camY};
 }
 function draw(now){const {hx,hy,camX,camY}=update(now);ctx.clearRect(0,0,640,480);ctx.save();ctx.translate(-Math.round(camX),-Math.round(camY));
  const left=Math.max(0,Math.floor(camX/32)),right=Math.min(W-1,Math.ceil((camX+640)/32));const top=Math.max(0,Math.floor(camY/32)),bottom=Math.min(H-1,Math.ceil((camY+480)/32));
  for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){
   drawTile(images.grass,x,y,x*32,y*32,8);
  }
  // Naturally varied grass paths are intentionally open cells, not a paved-road overlay.
  for(const f of authoredFlowers)if(f.x>=left-1&&f.x<=right+1&&f.y>=top-1&&f.y<=bottom+1)ctx.drawImage(images.flower,(f.index%4)*32,Math.floor(f.index/4)*32,32,32,f.x*32,f.y*32,32,32);
  const drawObject=o=>{if(images[o.kind])ctx.drawImage(images[o.kind],o.x,o.y,o.w,o.h);};
  // Depth order from actual object ground contact. Collision is explicit integer tiles.
  const sprites=objects.filter(o=>o.layer==='object').map(o=>({o,foot:o.footY}));
  sprites.push({hero:true,foot:(hy+1)*32});sprites.sort((a,b)=>a.foot-b.foot||((a.hero?1:0)-(b.hero?1:0)));
  for(const entry of sprites){if(entry.hero){const frame=hero.moving?(Math.floor((now-hero.t0)/65)%2?1:2):0;ctx.drawImage(images.hero,frame*32,hero.dir*32,32,32,Math.round(hx*32),Math.round(hy*32),32,32)}else drawObject(entry.o);}
  if(overlay.grid){ctx.lineWidth=1;ctx.strokeStyle='#efffd966';for(let x=left;x<=right+1;x++){ctx.beginPath();ctx.moveTo(x*32+.5,top*32);ctx.lineTo(x*32+.5,(bottom+1)*32);ctx.stroke()}for(let y=top;y<=bottom+1;y++){ctx.beginPath();ctx.moveTo(left*32,y*32+.5);ctx.lineTo((right+1)*32,y*32+.5);ctx.stroke()}
   ctx.fillStyle='#dc6b6b7d';for(const k of occupiedTiles){const [x,y]=k.split(',').map(Number);if(x>=left&&x<=right&&y>=top&&y<=bottom)ctx.fillRect(x*32,y*32,32,32)}

  }
  ctx.restore();
  if(hero.y<11&&hero.x>=12&&hero.x<=19)hint.textContent='森の向こうに人の気配。村外れの家に辿り着いた。';
  else if(hero.x>=18)hint.textContent='花と畑が広がる里の外れ。道はまだ先へ続く。';
  else hint.textContent='草花を抜けて、小さな家へ続く野道を進もう。';
  requestAnimationFrame(draw);
 }
 function load(){return Promise.all(Object.entries(assets).map(([key,[path,w,h]])=>new Promise(resolve=>{const im=new Image();im.onload=()=>{if(im.naturalWidth!==w||im.naturalHeight!==h)errors.push(`${key}: サイズ ${im.naturalWidth}×${im.naturalHeight} (想定 ${w}×${h})`);else images[key]=im;resolve()};im.onerror=()=>{errors.push(`${key}: 読込失敗`);resolve()};im.src=ROOT+path;})));}
 window.FIELD_ART_PILOT={validate,ground,objects,passable,assets,hero,OBJECT_FAMILY};
 load().then(()=>{if(errors.length){loading.textContent='既存素材を読み込めませんでした。\n'+errors.join('\n')+'\n\nネット接続とPages上の素材公開を確認してください。';console.error('FIELD_ART_PILOT_ASSETS',errors);return;}loading.hidden=true;requestAnimationFrame(draw)});
})();
</script></body></html>
