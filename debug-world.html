<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>全体フィールド DEBUG 256×256</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d29;color:#eee;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;padding:10px;background:#1c3446;flex-wrap:wrap}button,a{font:inherit;border:1px solid #9bb4bb;border-radius:7px;background:#284b61;color:white;padding:11px;min-height:43px;touch-action:none}a{text-decoration:none}.wrap{max-width:830px;margin:auto;padding:8px}canvas{image-rendering:pixelated;display:block;width:100%;background:#207484;border:2px solid #526d76;border-radius:7px;touch-action:none}#game{aspect-ratio:4/3}#mini{width:160px;height:160px}#controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:10px auto}#pad{display:grid;grid-template-columns:repeat(3,53px);gap:4px}#pad button{min-height:49px;padding:0}#info{padding:8px;color:#cbdce0}.legend{font-size:12px;color:#adc8cb;line-height:1.6}.right{display:flex;flex-direction:column;gap:8px}#modal{padding:9px;background:#213c49;border-radius:6px;margin-top:10px}</style></head><body>
<header><b>全体フィールド DEBUG（256×256）</b><a href="index.html">本編へ戻る</a><button id="swap">詳細マップへ</button><button id="ship">乗船 / 下船</button><button id="reset">開始地点</button></header>
<div class="wrap"><canvas id="game" width="640" height="480"></canvas><div id="info"></div><div id="controls"><div id="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,0">●</button><button data-dir="1,0">▶</button><span></span><button data-dir="0,1">▼</button><span></span></div><div class="right"><canvas id="mini" width="256" height="256"></canvas><button id="action">A：上陸・出航</button></div></div><div id="modal">既存の地形画像を流用した全体世界の仮実装。地形形状は新規作画の検査用配置で、ROM画像・ROMタイルデータは不使用。海岸の立体側面は水扱いとします。</div><p class="legend">方向キー / WASD / タッチ十字キーで8方向移動できます。全体世界の左下に新大陸の代表島（7×7マス）があり、近づいてAで既存80×80新大陸に切り替わります。船で海上を移動できます。新大陸の仮上陸はデバッグ限定。記録は本編のセーブと独立しています。</p></div>
<script src="js/world.js"></script><script>
(()=>{
"use strict";const T=32,N=256,cv=document.getElementById("game"),c=cv.getContext("2d"),mini=document.getElementById("mini"),mc=mini.getContext("2d"),info=document.getElementById("info");c.imageSmoothingEnabled=false;
const polygons=[
[[85,194],[117,132],[182,108],[255,133],[307,118],[349,169],[330,220],[359,266],[329,308],[365,350],[329,378],[280,360],[245,400],[188,389],[139,354],[108,290],[69,266]],
[[566,96],[628,78],[687,109],[747,100],[801,121],[867,135],[931,169],[934,230],[899,275],[915,316],[882,353],[826,349],[809,391],[761,369],[711,397],[657,357],[588,352],[554,303],[571,267],[538,229],[556,193],[527,143]],
[[101,517],[135,502],[175,493],[204,509],[232,538],[216,570],[228,604],[210,637],[220,671],[205,703],[227,746],[208,780],[227,813],[210,848],[228,884],[203,927],[209,1000],[186,997],[175,949],[144,929],[145,894],[125,861],[134,829],[113,792],[134,754],[125,725],[142,688],[120,651],[127,611],[115,577]],
[[684,457],[734,432],[778,452],[816,442],[857,454],[895,477],[909,506],[890,530],[920,550],[925,586],[904,613],[934,633],[904,663],[876,687],[903,730],[873,769],[851,810],[874,861],[833,889],[789,837],[765,898],[722,869],[705,812],[675,793],[694,740],[661,697],[638,652],[654,604],[614,548],[634,495]],
[[420,731],[434,702],[467,677],[494,672],[528,677],[550,690],[576,708],[587,732],[595,753],[585,773],[597,801],[546,816],[505,809],[468,818],[434,791]],
[[489,475],[499,469],[516,467],[532,470],[540,479],[541,497],[538,514],[527,526],[509,528],[491,523],[483,511],[482,490]]
];const kinds=['snow','grass','grass','grass','grass','barren'];const color={sea:'#26768b',grass:'#589946',snow:'#e7ece8',forest:'#245f36',mountain:'#73795a',barren:'#9b8065',sand:'#bea76a',river:'#3b92b7',shallow:'#7cb8ba'};
function poly(x,y,vs){let v=false;for(let i=0,j=vs.length-1;i<vs.length;j=i++){const a=vs[i],b=vs[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])v=!v;}return v}
function hash(x,y){let a=(x*374761393+y*668265263)>>>0;a=Math.imul(a^(a>>>13),1274126177);return ((a^(a>>>16))>>>0)/4294967296}
const cells=new Uint8Array(N*N),types=['sea','grass','snow','forest','mountain','barren','sand','river','shallow'];const at=(x,y)=>x>=0&&x<N&&y>=0&&y<N?cells[y*N+x]:0;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let region=-1;for(let i=0;i<polygons.length;i++)if(poly(x*4+2,y*4+2,polygons[i])){region=i;break}if(region<0)continue;let t=region===0?2:region===5?5:1;const h=hash(x>>2,y>>2),n=hash(x,y);if(region!==5){if(h>.85)t=4;else if(h>.68)t=3;if(region===0&&h>.74)t=2;if(region===3&&y>185&&h>.95)t=5;if(region===2&&n>.985)t=6;}cells[y*N+x]=t}
for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(at(x,y)!==0&&at(x,y)!==5&&[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(x+dx,y+dy)===0)&&hash(x,y)>.58)cells[y*N+x]=6;
// Newly authored small representation of New Continent in global map. Detailed terrain remains existing 80x80 YK_WORLD.
const islandX=94,islandY=215;for(let y=0;y<7;y++)for(let x=0;x<7;x++){const dx=x-3,dy=y-3;if(dx*dx+dy*dy<11)cells[(islandY+y)*N+islandX+x]=hash(x+7,y+3)>.7?3:1;}
const IM={};const assets={grass:'assets/terrain/grass-v1/grass.png',sea:'assets/terrain/landscape-v1/water.png',snow:'assets/terrain/landscape-v1/snow.png',sand:'assets/terrain/landscape-v1/sand.png',barren:'assets/terrain/landscape-v1/barren.png',forest:'assets/terrain/landscape-v2/greenMountain.png',mountain:'assets/terrain/landscape-v1/mountain.png'};
let loading=0;for(const [name,url] of Object.entries(assets)){const im=new Image();im.onload=()=>{loading++;draw()};im.onerror=()=>{loading++;draw()};im.src=url;IM[name]=im}
function texture(t,x,y,sx,sy){const kind=types[t],img=IM[kind];c.fillStyle=color[kind]||'#748575';c.fillRect(sx,sy,T,T);if(!img?.complete||!img.naturalWidth)return;const w=img.naturalWidth,h=img.naturalHeight;if(kind==='forest'||kind==='mountain')c.drawImage(img,0,0,w,h,sx,sy-8,T,40);else c.drawImage(img,(x*32)%w,(y*32)%h,Math.min(T,w-((x*32)%w)),Math.min(T,h-((y*32)%h)),sx,sy,T,T)}
const saved=(()=>{try{return JSON.parse(sessionStorage.getItem('yk_world_debug_v1'))}catch{return null}})();let state=saved&&saved.map?{map:saved.map,x:saved.x,y:saved.y,ship:!!saved.ship}:{map:'global',x:102,y:218,ship:true};if(state.map==='global'&&(state.x<0||state.x>=256||state.y<0||state.y>=256))state={map:'global',x:102,y:218,ship:true};
function location(){return state.map==='global'?{get:(x,y)=>at(x,y),w:256,h:256}:{get:(x,y)=>{const t=window.YK_WORLD?.mapData?.[y]?.[x];return t==='sea'?0:t==='sand'?6:t==='snow'?2:t==='forest'?3:t?.includes('Mountain')||t==='mountain'?4:t==='river'?7:t==='barren'?5:1},w:80,h:80}}
function save(){try{sessionStorage.setItem('yk_world_debug_v1',JSON.stringify(state))}catch{}}
function can(x,y){const m=location(),tx=Math.round(x),ty=Math.round(y);if(tx<0||ty<0||tx>=m.w||ty>=m.h)return false;const t=m.get(tx,ty);return state.ship?(t===0||t===8):(t!==0&&t!==4&&t!==7)}
function move(dx,dy){if(!dx&&!dy)return;const f=dx&&dy?Math.SQRT1_2:1;const x=state.x+dx*f*.16,y=state.y+dy*f*.16;if(can(x,y)){state.x=x;state.y=y}else if(can(x,state.y)){state.x=x}else if(can(state.x,y)){state.y=y}save()}
function transition(){if(state.map==='global'){if(Math.abs(state.x-(islandX+3))<6&&Math.abs(state.y-(islandY+3))<6){state.map='local';state.x=17;state.y=65;state.ship=false;save();draw();return}document.getElementById('modal').textContent='新大陸の小島の近くまで進み、Aで上陸してください。'}else{state.map='global';state.x=islandX+3;state.y=islandY+9;state.ship=true;save();draw()}}
function draw(){const m=location();c.clearRect(0,0,640,480);const xx=state.x*T-320,yy=state.y*T-240,fromX=Math.max(0,Math.floor(xx/T)-1),toX=Math.min(m.w-1,Math.ceil((xx+640)/T)+1),fromY=Math.max(0,Math.floor(yy/T)-1),toY=Math.min(m.h-1,Math.ceil((yy+480)/T)+1);for(let y=fromY;y<=toY;y++)for(let x=fromX;x<=toX;x++)texture(m.get(x,y),x,y,Math.round(x*T-xx),Math.round(y*T-yy));c.fillStyle='#fff2bb';c.strokeStyle='#1f2732';c.lineWidth=3;c.beginPath();c.ellipse(320,237,11,9,0,0,7);c.fill();c.stroke();c.fillStyle='#142531';c.fillRect(317,234,6,5);info.textContent=(state.map==='global'?'全体 256×256':'新大陸 80×80')+'　座標 '+Math.round(state.x)+','+Math.round(state.y)+'　'+(state.ship?'船':'徒歩')+'　素材読み込み '+loading+'/'+Object.keys(assets).length;document.getElementById('swap').textContent=state.map==='global'?'新大陸へ（デバッグ）':'全体地図へ';}
function miniDraw(){const image=mc.createImageData(256,256);for(let i=0;i<cells.length;i++){let col=at(i%256,Math.floor(i/256));let rgb=col===0?[27,105,124]:col===2?[228,233,231]:col===3?[41,111,64]:col===4?[98,104,79]:col===5?[164,106,83]:[102,154,75];for(let k=0;k<3;k++)image.data[i*4+k]=rgb[k];image.data[i*4+3]=255}mc.putImageData(image,0,0)}miniDraw();let pressed=new Set();document.addEventListener('keydown',e=>{const d={ArrowUp:'0,-1',ArrowDown:'0,1',ArrowLeft:'-1,0',ArrowRight:'1,0',w:'0,-1',s:'0,1',a:'-1,0',d:'1,0'}[e.key];if(d){pressed.add(d);e.preventDefault()}else if(e.key==='Enter'||e.key===' '){transition();e.preventDefault()}});document.addEventListener('keyup',e=>{const d={ArrowUp:'0,-1',ArrowDown:'0,1',ArrowLeft:'-1,0',ArrowRight:'1,0',w:'0,-1',s:'0,1',a:'-1,0',d:'1,0'}[e.key];if(d)pressed.delete(d)});
for(const b of document.querySelectorAll('[data-dir]')){const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{pressed.add(d);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>pressed.delete(d))}
document.getElementById('swap').onclick=transition;document.getElementById('action').onclick=transition;document.getElementById('ship').onclick=()=>{state.ship=!state.ship;save();draw()};document.getElementById('reset').onclick=()=>{state={map:'global',x:102,y:218,ship:true};save();draw()};let last=0;function frame(t){if(t-last>35){let dx=0,dy=0;for(const d of pressed){const v=d.split(',').map(Number);dx+=v[0];dy+=v[1]}move(Math.sign(dx),Math.sign(dy));draw();last=t}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
