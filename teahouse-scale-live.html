<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茶店・サイズ実機確認</title><style>body{margin:0;background:#152126;color:#eef;font:15px -apple-system,sans-serif}main{max-width:740px;margin:auto;padding:12px}canvas{display:block;width:100%;background:#242c30;touch-action:none;border:1px solid #677}button,input{font:inherit;padding:9px;border-radius:7px}button{color:white;background:#36545a;border:1px solid #789}p{line-height:1.5}label{display:inline-block;padding:4px}</style><main><h2>茶店の家具・主人公サイズ比較</h2><p>iPhone Safariで直接操作できます。茶店の仮配置図、家具の配置枠、実ゲーム主人公画像（読み込み可能な場合）を表示します。</p><label>遠近 <input type="range" min="0" max="160" value="85" id="depth"></label><label>ズーム <input type="range" min="75" max="170" value="115" id="zoom"></label><canvas id="c" width="640" height="550"></canvas><p><button id="up">奥へ</button><button id="down">手前へ</button><button id="left">左へ</button><button id="right">右へ</button><button id="reset">戻す</button></p><p id="info"></p><p>注意：家具の実PNGはまだ未登録のため、仮のシルエット表示です。実画像の外観確認には、前の配置プレビュー画像をご覧ください。</p><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);let pos={x:10,y:11},hero=new Image,ok=false;hero.onload=()=>{ok=true;draw()};hero.onerror=()=>{ok=false;draw()};hero.src='assets/characters/hizuki/bluebob-v1/walk-atlas-256.png?v=15.57.116';function P(x,y){let a= +$('#depth').value/100,z= +$('#zoom').value/100,s=z*(1+(y-7)*a*.075);return {x:320+(x-10)*32*s,y:260+(y-7)*32*z*(1+(y-7)*a*.038),s};}function sprite(x,y,w,h,kind){let p=P(x+w/2,y+h),dw=w*32*p.s,dh=h*32*p.s;g.save();g.translate(p.x,p.y);g.fillStyle=kind==='table'?'#986341':kind==='cushion'?'#426d3d':'#899496';g.strokeStyle='#302a26';g.lineWidth=2;if(kind==='table'){g.fillRect(-dw/2,-dh*.75,dw,dh*.8);g.strokeRect(-dw/2,-dh*.75,dw,dh*.8);g.fillStyle='#d3ba83';g.beginPath();g.arc(-dw*.12,-dh*.35,5*p.s,0,7);g.arc(dw*.17,-dh*.35,5*p.s,0,7);g.fill()}else{g.beginPath();g.ellipse(0,-dh*.35,dw*.48,dh*.42,0,0,7);g.fill();g.stroke()}g.restore()}
function draw(){g.fillStyle='#1c2a30';g.fillRect(0,0,640,550);for(let y=0;y<14;y++)for(let x=0;x<20;x++){let p=P(x,y),q=P(x+1,y+1);g.fillStyle=y<5?'#ac946a':'#987d54';g.fillRect(p.x,p.y,q.x-p.x+1,q.y-p.y+1);g.strokeStyle='#ffffff16';g.strokeRect(p.x,p.y,q.x-p.x,q.y-p.y)}sprite(5,5,2,1,'table');sprite(4,5,1,1,'cushion');sprite(7,5,1,1,'cushion');sprite(11,5,2,1,'table');sprite(10,5,1,1,'cushion');sprite(13,5,1,1,'cushion');sprite(9,12,2,1,'stone');let p=P(pos.x+.5,pos.y+.8),h=58*p.s;g.save();if(ok){g.imageSmoothingEnabled=false;g.drawImage(hero,0,0,256,256,p.x-(256/232)*h/2,p.y-(248/232)*h,(256/232)*h,(256/232)*h)}else{g.fillStyle='#a43d5b';g.fillRect(p.x-14*p.s,p.y-h,28*p.s,h)}g.restore();g.fillStyle='#cffff2';g.fillText('主人公：58px基準',Math.max(8,p.x-25),Math.min(540,p.y+22));$('#info').textContent='主人公位置 '+pos.x+','+pos.y+'／'+(ok?'正式ブルーボブ主人公アトラス読込成功':'ゲーム用アトラス読込待機・仮表示')+'／家具は配置用シルエット'}function move(dx,dy){pos.x=Math.max(0,Math.min(19,pos.x+dx));pos.y=Math.max(0,Math.min(13,pos.y+dy));draw()}$('#up').onclick=()=>move(0,-1);$('#down').onclick=()=>move(0,1);$('#left').onclick=()=>move(-1,0);$('#right').onclick=()=>move(1,0);$('#reset').onclick=()=>{pos={x:10,y:11};draw()};for(let id of ['depth','zoom'])$('#'+id).oninput=draw;draw();
</script></main>
