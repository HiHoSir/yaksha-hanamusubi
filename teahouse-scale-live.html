<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>茶店・サイズ実機確認</title><style>body{margin:0;background:#152126;color:#eef;font:15px -apple-system,sans-serif}main{max-width:740px;margin:auto;padding:12px}canvas{display:block;width:100%;background:#242c30;touch-action:none;border:1px solid #677}button,input{font:inherit;padding:9px;border-radius:7px}button{color:white;background:#36545a;border:1px solid #789}p{line-height:1.5}label{display:inline-block;padding:4px}</style><main><h2>茶店の家具・主人公サイズ比較</h2><p>iPhone Safariで直接操作できます。間取りエディタの茶店初期配置図に合わせ、縮小後の10×8マスに4卓・座布団8枚・踏み石に加えて、柱4本を試験配置します。</p><label>遠近 <input type="range" min="0" max="160" value="85" id="depth"></label><label>ズーム <input type="range" min="75" max="170" value="115" id="zoom"></label><canvas id="c" width="640" height="550"></canvas><p><button id="up">奥へ</button><button id="down">手前へ</button><button id="left">左へ</button><button id="right">右へ</button><button id="reset">戻す</button></p><p id="info"></p><p>家具は生成済みPNGを軽量化して直接埋め込んでいます。柱は四隅に配置。外壁と柱の占有マスへは入れず、家具の占有も通行禁止です。160px高さは試験寸法、接地位置は1マス扱いです。10×8マスの縮小配置です。テーブル4卓は各2×1マスです。通路が狭い箇所は今後の調整候補です。主人公はゲーム本編の正規ブルーボブ画像です。</p><script>

lfOgpdUzLLNNZFPN7gLpkR6xQKNMxMcOxxl7FEcyeIvWCAKBBV8gBiw7k5rp+YAOxx6T9Kv949hjOs1rp5St28EDKAbi1lw2rvtkXes0AvG5x/owf/hB9+BEQQUwhK5AAAAAElFTkSuQmCC';realAssets.cushion=new Image;realAssets.cushion.onload=()=>draw();realAssets.cushion.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAAYFBMVEUAAABzh0o4RyVmekJVaTdgcz6Hl1VIWS8oNhoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArDpsqAAAAIHRSTlMA//////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAORL9MUAAADKSURBVHja3ZILDoMwDEPJn/ufeHY7JBK2A2xGULV5OGna4/gdSdZYMdP7NCXCojw8wjlQd0AtU0QiIeErrs1BdwQMwwRMzzvgO3gJk+oOJZkNsJnC6ArJGvCpFj9q5zDHXgxIDAMUsVNgi86w10fAmLkAgHgAO7mXKUuJLwCdFc385hDm+BdVSswaKpIZIsRkswPQ9y7BkAIw+uCrk4hRvk62W7BPxmedsz8BRepYBuhRoVuzU6IUQnrp1GiAadep0i6hjqK5cvyRXuK3BRk4FpAUAAAAAElFTkSuQmCC';const pillar=new Image();let pillarOK=false;pillar.onload=()=>{pillarOK=true;draw()};pillar.onerror=()=>{pillarOK=false;draw()};pillar.src='assets/interiors/prototypes/pillar-32x160.png?v=3684894b';function P(x,y){let a= +$('#depth').value/100,z= +$('#zoom').value/100,s=z*(1+(y-4)*a*.075);return {x:320+(x-5)*32*s,y:260+(y-4)*32*z*(1+(y-4)*a*.038),s};}function sprite(x,y,w,h,kind){const image=realAssets[kind],p=P(x+w/2,y+h),dw=w*32*p.s,dh=(kind==='table'?40:h*32)*p.s;if(!image?.complete||!image.naturalWidth)return;g.save();g.imageSmoothingEnabled=false;g.drawImage(image,p.x-dw/2,p.y-dh,dw,dh);g.restore()}
const W=10,H=8,pillars=[[0,0],[9,0],[0,7],[9,7]];function plan(){const a=Array.from({length:H},()=>Array(W).fill('road'));const put=(x,y,v)=>{if(x>=0&&x<W&&y>=0&&y<H)a[y][x]=v},rect=(x,y,X,Y,v)=>{for(let b=y;b<=Y;b++)for(let k=x;k<=X;k++)put(k,b,v)};for(let x=0;x<W;x++)put(x,0,'wall');for(let y=0;y<H;y++){put(0,y,'wall');put(W-1,y,'wall')}for(let x=1;x<W-1;x++)if(x<3||x>6)put(x,H-1,'wall');rect(4,7,5,7,'entrance');rect(1,1,8,5,'wood');rect(1,5,8,5,'raised');put(4,6,'stone');put(5,6,'stone');for(const [x,y] of [[2,2],[6,2],[2,4],[6,4]]){put(x,y,'table');put(x+1,y,'table');put(x-1,y,'cushion');put(x+2,y,'cushion')}return a}const tiles=plan();
let blockedCount=0;function draw(){g.fillStyle='#1c2a30';g.fillRect(0,0,640,550);const zoom= +$('#zoom').value/100;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=P(x,y),q=P(x+1,y+1),t=tiles[y][x];g.fillStyle=t==='wall'?'#63452b':t==='wood'?'#be965c':t==='raised'?'#dfb676':t==='entrance'?'#806f54':'#93764f';g.fillRect(p.x,p.y,q.x-p.x+1,q.y-p.y+1);g.strokeStyle='#ffffff14';g.strokeRect(p.x,p.y,q.x-p.x,q.y-p.y)}
// Furniture positions faithfully derive from the four template table centers.

// Extend rightward and move only the right cushion one cell to avoid overlap.
const furniture=[];for(const [x,y] of [[2,2],[6,2],[2,4],[6,4]]){furniture.push({x:x-1,y,w:1,h:1,k:'cushion'});furniture.push({x:x+2,y,w:1,h:1,k:'cushion'});furniture.push({x,y,w:2,h:1,k:'table'})}furniture.push({x:4,y:6,w:2,h:1,k:'stone'});
furniture.sort((a,b)=>(a.y+a.h)-(b.y+b.h));for(const f of furniture)sprite(f.x,f.y,f.w,f.h,f.k);
// Actor/pillars in one foot-depth queue, without increasing collision to sprite height.
const queue=[{type:'hero',depth:pos.y+.8},...pillars.map(([x,y])=>({type:'pillar',x,y,depth:y+1}))];
queue.sort((a,b)=>a.depth-b.depth);
for(const item of queue){
 if(item.type==='pillar'){
  if(!pillarOK)continue;const q=P(item.x+.5,item.y+1);g.save();g.imageSmoothingEnabled=false;g.drawImage(pillar,q.x-16*q.s,q.y-160*q.s,32*q.s,160*q.s);g.restore();
 }else{
  const p=P(pos.x+.5,pos.y+.8),h=58*p.s;g.save();if(ok){g.imageSmoothingEnabled=false;g.drawImage(hero,0,0,256,256,p.x-(256/232)*h/2,p.y-(248/232)*h,(256/232)*h,(256/232)*h)}else{g.fillStyle='#a43d5b';g.fillRect(p.x-14*p.s,p.y-h,28*p.s,h)}g.restore();g.fillStyle='#cffff2';g.fillText('緋月：58px基準',Math.max(8,p.x-25),Math.min(540,p.y+22));
 }
}

function blocked(x,y){return x<1||x>8||y<1||y>6||pillars.some(([a,b])=>a===x&&b===y)||tiles[y]?.[x]==='table'}function move(dx,dy){const nx=pos.x+dx,ny=pos.y+dy;if(blocked(nx,ny)){blockedCount++;draw();return}pos.x=nx;pos.y=ny;draw()}$('#up').onclick=()=>move(0,-1);$('#down').onclick=()=>move(0,1);$('#left').onclick=()=>move(-1,0);$('#right').onclick=()=>move(1,0);$('#reset').onclick=()=>{pos={x:4,y:6};blockedCount=0;draw()};for(let id of ['depth','zoom'])$('#'+id).oninput=draw;draw();
