<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天妖の社 · 48×32マス歩行判定検査</title><style>body{margin:0;background:#15231f;color:#f3f0e7;font:14px system-ui}main{max-width:820px;margin:auto;padding:8px}h2{font-size:18px;margin:8px 0}canvas{width:100%;height:auto;display:block;touch-action:none;border:1px solid #52665b}button{width:64px;height:51px;touch-action:none;background:#3e5c51;color:white;border:1px solid #849d90;border-radius:9px;font-size:22px}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:5px}#status{min-height:20px}label{display:block;margin:8px 0}</style></head><body><main><h2>天妖の社 · 48×32マス歩行検査</h2><canvas id="scene" width="768" height="768"></canvas><p id="status">読み込み中</p><div class="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><label><input id="debug" type="checkbox">歩行判定を表示（緑：歩行可能／赤：進入不可）</label><p>南側のマス中央から開始。十字キーを1回押すと1マス（元画像の32px）移動、長押しで連続マス移動。本編と同じ48×32の通行判定を使用します。カメラは緋月を追従し、画像の外へ出ません。地面→木々→社の上に人物を描画。鳥居は設置面を境に人物との前後が切り替わります。</p></main><script src="js/tenyo-main-scene.js?v=16.1.15"></script><script src="js/tenyo-three-layer-demo.js?v=16.1.15"></script></body></html>
