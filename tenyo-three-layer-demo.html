<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天妖の社 · 3層歩行判定検査</title><style>body{margin:0;background:#15231f;color:#f3f0e7;font:14px system-ui}main{max-width:820px;margin:auto;padding:8px}h2{font-size:18px;margin:8px 0}canvas{width:100%;height:auto;display:block;touch-action:none;border:1px solid #52665b}button{width:64px;height:51px;touch-action:none;background:#3e5c51;color:white;border:1px solid #849d90;border-radius:9px;font-size:22px}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:5px}#status{min-height:20px}label{display:block;margin:8px 0}</style></head><body><main><h2>天妖の社 · 3層歩行検査</h2><canvas id="scene" width="768" height="512"></canvas><p id="status">読み込み中</p><div class="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><label><input id="debug" type="checkbox">歩行判定を表示（緑：通路／橙：葉／赤：社）</label><p>南側のマス中央から開始。十字キーを1回押すと1マス（32px）移動、長押しで連続マス移動。木々は前景レイヤー、社は進入禁止です。</p></main><script type="module" src="js/tenyo-three-layer-demo.js?v=6"></script></body></html>
