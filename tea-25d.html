<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>茶屋 2.5D 空間検証 — 鬼哭の花契り</title>
<style>
*{box-sizing:border-box}body{background:#091728;color:#f5e8c8;font-family:system-ui,sans-serif;margin:0}
header{padding:12px 15px;max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}header a{color:#e3bb77}
#stage{width:min(100vw,690px);aspect-ratio:1;margin:auto;position:relative;overflow:hidden;border:2px solid #b99a67;background:#241c19}
#back,#screen{position:absolute;inset:0;width:100%;height:100%}#back{object-fit:cover}#screen{pointer-events:none}
#notice{position:absolute;left:2%;top:2%;background:#101f31d9;padding:8px;font-size:12px;border-radius:7px;max-width:75%}
.controls{width:min(100vw,690px);margin:12px auto;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,54px);gap:3px}.dpad button:nth-child(1){grid-column:2}
button{touch-action:none;border:1px solid #c9a86c;color:#fff2d8;background:#24405a;border-radius:9px;padding:11px 13px;font-size:18px;cursor:pointer}
p{max-width:690px;margin:10px auto;line-height:1.6;padding:0 12px;font-size:13px;color:#d5cbb6}
#status{font-family:monospace;color:#e8c482}
</style></head><body>
<header><strong>茶屋 2.5D 実験版</strong><a href="./">本編へ戻る</a></header>
<div id="stage"><img id="back" src="assets/interiors/tea-bg-25d-experiment.webp?v=1" alt="茶屋の背景画像"><div id="screen"></div>
<div id="notice">3D柱＋2D緋月。柱の前後を移動して深度テスト<br><span id="status">読み込み中…</span></div></div>
<div class="controls"><div class="dpad"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div>
<button id="wire">3D位置ガイド</button><button id="reset">初期位置</button></div>
<p>操作：十字キー、または画面内の方向ボタン。カメラは固定、床・柱は実際の3D座標、緋月は既存アトラスから切り出した2Dビルボードです。柱の前後はWebGLの深度テストで処理し、ポリゴン遮蔽マスクは使いません。実験用背景の柱跡・パースは仮補完であり、完成アートではありません。</p>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const screen=document.getElementById('screen'),status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(768,768,false);renderer.setClearColor(0,0);
renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';screen.append(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-6.4,6.4,6.4,-6.4,0.1,100);
camera.position.set(0,8.5,13);camera.lookAt(0,0,0);camera.updateProjectionMatrix();
scene.add(new THREE.HemisphereLight(0xffe4b8,0x36251e,2.2));
const sun=new THREE.DirectionalLight(0xffcf91,2);sun.position.set(-5,10,4);scene.add(sun);
const pillarMat=new THREE.MeshStandardMaterial({color:0x795031,roughness:0.92});
const trimMat=new THREE.MeshStandardMaterial({color:0x4e3125,roughness:1});
const objects=[];
function pillar(name,x,z,height,width){
 const root=new THREE.Group();
 const wood=new THREE.Mesh(new THREE.BoxGeometry(width,height,width),pillarMat);
 wood.position.y=height/2;root.add(wood);
 const base=new THREE.Mesh(new THREE.BoxGeometry(width*1.35,.22,width*1.35),trimMat);
 base.position.y=.11;root.add(base);root.position.set(x,0,z);root.userData={name};
 scene.add(root);objects.push(root);return root;
}
pillar('左柱',-4.55,-.9,6.5,.34);
pillar('中央柱',1.13,-.48,6.8,.42);
let grid=new THREE.GridHelper(12,12,0x9fc9c5,0x6d807c);grid.position.y=.018;grid.visible=false;scene.add(grid);
const hero=new THREE.Sprite(new THREE.SpriteMaterial({color:0xffffff,transparent:true,depthTest:true,depthWrite:true,alphaTest:.18}));
hero.scale.set(1.25,1.85,1);
let pos={x:1.2,z:1.8};scene.add(hero);
function setHero(){hero.position.set(pos.x,.92,pos.z);status.textContent='X '+pos.x.toFixed(2)+' / Z '+pos.z.toFixed(2)+' ／ 奥行き判定：WebGL';}
setHero();
const im=new Image();im.onload=()=>{
 const canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
 const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 const cols=Math.floor(im.naturalWidth/128),rows=Math.floor(im.naturalHeight/128);
 // 8 directional rows with 3 walk phases; take front-neutral frame.
 ctx.drawImage(im,Math.min(1,cols-1)*128,0,128,128,0,0,128,128);
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
 texture.magFilter=THREE.NearestFilter;texture.minFilter=THREE.LinearFilter;
 hero.material.map=texture;hero.material.needsUpdate=true;
};
im.onerror=()=>status.textContent='スプライト読み込み失敗';
im.src='assets/characters/hizuki/shortbob-8dir/walk-atlas-128.png';
const pressed=new Set();let last=performance.now();
for(const btn of document.querySelectorAll('[data-move]')){
 const key=btn.dataset.move;btn.addEventListener('pointerdown',ev=>{ev.preventDefault();pressed.add(key);btn.setPointerCapture(ev.pointerId)});
 for(const e of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(e,()=>pressed.delete(key));
}
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();pressed.add(keys[e.key])}});
window.addEventListener('keyup',e=>{if(keys[e.key])pressed.delete(keys[e.key])});
document.getElementById('wire').onclick=()=>{grid.visible=!grid.visible;objects.forEach(o=>o.children.forEach(m=>{m.material=grid.visible?new THREE.MeshNormalMaterial({wireframe:true}):m===o.children[0]?pillarMat:trimMat}))};
document.getElementById('reset').onclick=()=>{pos={x:1.2,z:1.8};setHero()};
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;
 let x=(pressed.has('right')?1:0)-(pressed.has('left')?1:0),z=(pressed.has('down')?1:0)-(pressed.has('up')?1:0);
 const n=Math.hypot(x,z);if(n){x/=n;z/=n;const nx=THREE.MathUtils.clamp(pos.x+x*dt*2.3,-5.4,5.4),nz=THREE.MathUtils.clamp(pos.z+z*dt*2.3,-4.6,4.8);
 const hit=objects.some(o=>Math.abs(nx-o.position.x)<.36&&Math.abs(nz-o.position.z)<.36);if(!hit){pos.x=nx;pos.z=nz};setHero();}
 renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
