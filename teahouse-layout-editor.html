<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>間取りタイル指示エディタ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#13191b;color:#f3f5f4;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:1060px;margin:auto;padding:12px 12px 35px}h1{font-size:21px;margin:8px 0}h2{font-size:16px;margin:12px 0 8px}p,small{color:#c7d0d0;line-height:1.5}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}button,select,input,textarea{font:inherit;color:inherit}button,select,input{background:#303c40;border:1px solid #64777a;border-radius:8px;padding:9px}button{cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{outline:3px solid #e8d18e;background:#495a54}button:disabled{opacity:.4}.tools{display:flex;flex-wrap:wrap;gap:7px}.tool{display:inline-flex;align-items:center;gap:6px;font-size:14px}.sw{height:17px;width:17px;display:inline-block;border:1px solid #c6c6c6;border-radius:3px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}section{border:1px solid #475456;background:#1e282a;border-radius:12px;padding:11px;margin-top:12px}.wrap{overflow:auto;width:100%;background:#101516;border:1px solid #546365;border-radius:8px;padding:8px;touch-action:pan-x pan-y}canvas{display:block;image-rendering:pixelated;touch-action:none;max-width:none}textarea{width:100%;min-height:180px;background:#0d1517;border:1px solid #64777a;border-radius:8px;padding:10px;font-size:13px;line-height:1.5}label{display:inline-flex;gap:5px;align-items:center}.muted{color:#afc4c5}.summary{margin:7px 0;font-size:13px;white-space:pre-wrap}.hide{display:none}
</style></head><body><main>
<header><div><h1>間取りタイル指示エディタ</h1><small>茶屋：20列 × 14行 ／ 1マス32px ／ スマホでタップ・なぞり塗り</small></div><a href="teahouse-ground-test.html" style="color:#bde6c6">地面のみ確認</a></header>
<section><h2>1. 塗る種類を選ぶ</h2><div id="tools" class="tools"></div><p>「選択」→「マップ上をタップ／なぞる」で配置します。矩形表示は<strong>配置指定用</strong>で、ゲーム素材を代用するものではありません。</p>
<div class="actions"><label><input type="checkbox" id="showGrid" checked>マス目</label><label><input type="checkbox" id="roadImage" checked>既存の道タイルを背景に表示</label><label>表示倍率<select id="zoom"><option value="1">等倍</option><option value="1.5" selected>1.5倍</option><option value="2">2倍</option></select></label></div>
<div class="wrap"><canvas id="map" width="640" height="448" aria-label="20列14行の間取りマップ"></canvas></div><div id="info" class="summary"></div></section>
<section><h2>2. 操作・保存</h2><div class="actions">
<button id="undo">元に戻す</button><button id="redo">やり直し</button><button id="fillRoad">全面を土・道に戻す</button>
<button id="export">JSON書き出し</button><label style="background:#303c40;border:1px solid #64777a;border-radius:8px;padding:9px">JSON読み込み<input type="file" id="import" accept=".json,application/json" style="display:none"></label>
</div><p>ブラウザ内に自動保存します。別の端末やチャットへの引き継ぎにはJSONファイルを書き出してください。</p>
<label>制作メモ <input id="notes" placeholder="例：入口中央4マス、奥は板の間" style="width:min(80vw,480px)"></label></section>
<section><h2>3. 新規タイル制作リクエスト</h2><p>必要な種類・数量と、現在の配置を含む文章を自動生成します。ボタンでコピーできます。</p><div class="actions"><button id="makeRequest">依頼文を更新</button><button id="copyRequest">依頼文をコピー</button><button id="copyJson">JSONをコピー</button></div><textarea id="request" spellcheck="false"></textarea></section>
</main><script>
(()=>{'use strict';
const W=20,H=14,N=W*H,S=32,key='yaksha.roomEditor.v1';
const types=[
{id:'road',name:'土・道（既存）',color:'#a87f51',newArt:false,walk:true},
{id:'wall',name:'木壁',color:'#674529',newArt:true,walk:false},
{id:'raised',name:'上がり框',color:'#d4b376',newArt:true,walk:true},
{id:'wood',name:'板の間',color:'#c39157',newArt:true,walk:true},
{id:'stone',name:'踏み石',color:'#9fa5a0',newArt:true,walk:true},
{id:'entrance',name:'出入口',color:'#78aabf',newArt:true,walk:true},
{id:'pillar',name:'柱',color:'#66452f',newArt:true,walk:false},
{id:'table',name:'卓（位置指示）',color:'#975546',newArt:true,walk:false},
{id:'cushion',name:'座布団（位置指示）',color:'#9a4b6a',newArt:true,walk:true},
{id:'npc',name:'NPC配置',color:'#b2a2ef',newArt:false,walk:true}
];
const byId=Object.fromEntries(types.map(t=>[t.id,t]));const $=id=>document.getElementById(id);
let cells=Array(N).fill('road'),selected='wall',undo=[],redo=[],painting=false,last=-1;
const c=$('map'),ctx=c.getContext('2d'),road=new Image();let roadReady=false;const encode=()=>JSON.stringify({version:1,project:'yaksha-hanamusubi',room:'teahouse',tileSize:32,width:W,height:H,notes:$('notes').value,legend:types.map(t=>({id:t.id,name:t.name,walkable:t.walk,needsArt:t.newArt})),tiles:Array.from({length:H},(_,y)=>cells.slice(y*W,(y+1)*W))},null,2);
const save=()=>{try{localStorage.setItem(key,encode())}catch(e){}};
function push(){undo.push([...cells]);if(undo.length>80)undo.shift();redo=[];}
function draw(){
 const z=Number($('zoom').value);c.style.width=W*S*z+'px';c.style.height=H*S*z+'px';
 ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W*S,H*S);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let t=byId[cells[y*W+x]]||types[0],px=x*S,py=y*S;
  if(roadReady&&$('roadImage').checked){ctx.drawImage(road,(x%2)*32,(y%2)*32,32,32,px,py,32,32)}
  else{ctx.fillStyle=byId.road.color;ctx.fillRect(px,py,S,S)}
  if(t.id!=='road'){ctx.fillStyle=t.color+'d9';ctx.fillRect(px,py,S,S);if(t.id==='wall'||t.id==='raised'){ctx.fillStyle='#f9dc9c';ctx.fillRect(px+3,py+12,26,7)}else if(t.id==='npc'){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(px+16,py+16,8,0,Math.PI*2);ctx.fill()}}
  if($('showGrid').checked){ctx.strokeStyle='#eef8ef55';ctx.lineWidth=.7;ctx.strokeRect(px+.35,py+.35,31.3,31.3)}
 }
 const counts=Object.fromEntries(types.map(t=>[t.name,cells.filter(v=>v===t.id).length]));$('info').textContent='配置数：'+Object.entries(counts).filter(([,n])=>n>0).map(([name,n])=>name+' '+n+'マス').join(' ／ ');
}
function paint(evt){const r=c.getBoundingClientRect(),x=Math.floor((evt.clientX-r.left)*W*S/r.width),y=Math.floor((evt.clientY-r.top)*H*S/r.height),idx=y*W+x;if(x<0||x>=W||y<0||y>=H||idx===last)return;if(cells[idx]===selected)return;cells[idx]=selected;last=idx;draw();save();}
c.addEventListener('pointerdown',e=>{e.preventDefault();painting=true;last=-1;push();c.setPointerCapture(e.pointerId);paint(e)});
c.addEventListener('pointermove',e=>{if(painting){e.preventDefault();paint(e)}});
for(const n of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(n,()=>{painting=false;last=-1});
const tools=$('tools');for(const t of types){let b=document.createElement('button');b.className='tool';b.type='button';b.innerHTML='<span class="sw" style="background:'+t.color+'"></span>'+t.name;b.onclick=()=>{selected=t.id;for(const a of tools.children)a.setAttribute('aria-pressed',String(a===b))};b.setAttribute('aria-pressed',String(t.id===selected));tools.appendChild(b)}
$('undo').onclick=()=>{if(!undo.length)return;redo.push([...cells]);cells=undo.pop();draw();save()};
$('redo').onclick=()=>{if(!redo.length)return;undo.push([...cells]);cells=redo.pop();draw();save()};
$('fillRoad').onclick=()=>{if(!confirm('全マスを土・道に戻しますか？'))return;push();cells.fill('road');draw();save()};
for(const id of ['showGrid','roadImage','zoom'])$(id).onchange=draw;
$('notes').oninput=save;
function download(name,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('export').onclick=()=>download('teahouse-layout-20x14.json',encode());
function importData(v){if(v.width!==W||v.height!==H||v.tileSize!==S||!Array.isArray(v.tiles)||v.tiles.length!==H||!v.tiles.every(r=>Array.isArray(r)&&r.length===W&&r.every(t=>byId[t])))throw Error('20×14・32px・既知の種類である必要があります');push();cells=v.tiles.flat();$('notes').value=typeof v.notes==='string'?v.notes:'';draw();save()}
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{importData(JSON.parse(await f.text()));alert('読み込みました')}catch(err){alert('読み込み失敗：'+err.message)}e.target.value=''};
function prompt(){const counts=types.filter(t=>cells.includes(t.id));const missing=counts.filter(t=>t.newArt);
const pos=id=>cells.flatMap((v,i)=>v===id?['('+i%W+','+Math.floor(i/W)+')']:[]);
return '【茶屋内装マップタイル制作・実装依頼】\n対象：yaksha-hanamusubi／20列×14行、1マス32×32px、合計640×448px。\n視点：真上の正投影。カメラの遠近・斜め見下ろしは禁止。\n既存地面：assets/terrain/landscape-v3/road.png を流用。地面を再生成しない。\n\n【新規アートが必要な種類】\n'+(missing.length?missing.map(t=>'・'+t.name+'：'+pos(t.id).length+'マス'+(pos(t.id).length?'（座標 '+pos(t.id).join(' ')+'）':'')).join('\n'):'新規アート指定なし')+'\n\n【配置（0始まり、左上がx=0,y=0）】\n'+counts.map(t=>'・'+t.name+'：'+pos(t.id).join(' ')).join('\n')+'\n\n【制作仕様】\n・各タイルは32×32px。接続方向と角・端部を考慮する。\n・壁/柱は接地セルを衝突判定に利用。上がり框/踏み石は原則通行可能。\n・床・壁・家具・前景は別レイヤーに分け、地面の32pxグリッドと同一原点で重ねる。\n・矩形塗りつぶしを完成素材に使わず、AGENTS.mdの内装スキルに従う。\n・承認済みキャラクター表示スケール・セーブ・村内移動を維持する。\n\n【補足】\n'+($('notes').value||'なし')+'\n\n【完全データ】別途JSONを添付/貼り付け。';}
$('makeRequest').onclick=()=>{$('request').value=prompt()};
async function copy(text){try{await navigator.clipboard.writeText(text);alert('コピーしました')}catch(e){const ta=$('request');ta.value=text;ta.focus();ta.select();alert('コピー許可がない場合は選択した文章を手動コピーしてください')}}
$('copyRequest').onclick=()=>copy($('request').value||prompt());$('copyJson').onclick=()=>copy(encode());
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.width===W&&saved?.height===H&&saved.tiles?.length===H&&saved.tiles.every(r=>r.length===W&&r.every(v=>byId[v]))){cells=saved.tiles.flat();$('notes').value=saved.notes||''}}catch(e){}
road.onload=()=>{roadReady=road.naturalWidth===64&&road.naturalHeight===64;draw()};road.onerror=()=>{roadReady=false;draw()};road.src='assets/terrain/landscape-v3/road.png';draw();$('request').value=prompt();
})();
</script></body></html>
