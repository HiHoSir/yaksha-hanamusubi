*{box-sizing:border-box}body{margin:0;padding:14px;background:#0e1b25;color:#e9efe8;font:15px system-ui,-apple-system,sans-serif;max-width:1100px;margin:auto}h1{font-size:22px;margin:12px 0 6px}p{color:#bacdd1;line-height:1.55}.panel{padding:12px;background:#182e3a;border:1px solid #668591;border-radius:12px}svg{display:block;width:100%;height:auto;background:#1e6681;border-radius:8px}.shore{fill:#a7b88a;stroke:#e9e7bc;stroke-width:3;stroke-linejoin:round}.candidate{stroke:#f2c78a;stroke-width:2.5;stroke-dasharray:7 7}.shore.active{stroke:#fff0a2;stroke-width:7}.label{fill:#fff;font-size:20px;font-weight:700;paint-order:stroke;stroke:#153943;stroke-width:5;pointer-events:none}.small{font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}button{color:#fff;background:#2a5366;border:1px solid #9ab9bd;border-radius:8px;padding:9px;min-height:42px}button[aria-pressed=true]{background:#83622d}#info{min-height:64px;padding:12px;background:#233b48;border-radius:8px}small{color:#bdcfd0}</style></head><body>
<h1>夜叉姫の花結び奇譚｜世界外形 v3.0</h1>
<p>原寸4096px地図と確認済みの6地域を基準に、大陸の輪郭だけを独自作図。道路・橋・山・川・森は描画しません。原作ROMのピクセル、輪郭のトレース、タイルは含みません。</p><div class="panel"><div class="controls" id="buttons"></div><svg id="map" viewBox="0 0 1000 1000" role="img" aria-label="西と東に縦長の陸地がある世界地図のオリジナル外形案"><rect width="1000" height="1000" fill="#21647d"/><g id="shores">

</g><g id="labels"><text class="label" x="285" y="306" text-anchor="middle">冬と星の国</text><text class="label" x="170" y="730" text-anchor="middle">花と木の国</text><text class="label" x="791" y="257" text-anchor="middle">ほほえみの大地</text><text class="label" x="753" y="697" text-anchor="middle">希望と絶望の国</text><text class="label small" x="495" y="728" text-anchor="middle">愛と勇気の国（竹島）</text><text class="label small" x="523" y="455" text-anchor="middle">鬼ヶ島</text><text class="label small" x="342" y="668" text-anchor="middle">新大陸（追加）</text></g></svg><p><small>島や陸地の名称は原作地図との照合済み。表示外形はすべて本作向けの試作であり、海岸線の最終確定ではありません。西側の南北接続部分、東側の細い接続部分は次の原寸確認対象です。</small></p><div id="info" aria-live="polite"></div></div>
<script>
'use strict';
const items={western:['西側北部','冬と星の国を含む西方北部。南西方面への地形接続の細部は原寸検査対象。'],west_south:['西側南方','花と木の国。西側北部と同一の大陸か、海峡で分離するかは断定しない。'],east:['東側の陸地','北東のほほえみの大地と南東の希望と絶望の国を含む。細い地峡の判定は保留。'],bamboo:['愛と勇気の国','中央南側の竹が多い島。地名はユーザー確認済み。'],oni:['鬼ヶ島','竹の島の北にある赤い鬼面状の島。地名はユーザー確認済み。'],new:['新大陸','本作だけの追加島。位置・縮尺は仮。既存の80×80実プレイマップを変更しない。']};
const controls=document.getElementById('buttons');function select(id){document.querySelectorAll('.shore').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));document.getElementById('info').textContent=items[id][0]+'：'+items[id][1]}
for(const id of Object.keys(items)){const b=document.createElement('button');b.dataset.id=id;b.textContent=items[id][0];b.onclick=()=>select(id);controls.append(b);document.getElementById(id).style.cursor='pointer';document.getElementById(id).addEventListener('click',()=>select(id))}select('oni');
</script></body></html>
