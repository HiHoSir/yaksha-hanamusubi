<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜叉姫 世界地図設計デバッグ v0.6</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#ebf0db;background:#101e28}*{box-sizing:border-box}body{margin:0;padding:14px;max-width:1050px;margin-inline:auto}h1{font-size:22px;margin:12px 0 6px}p{line-height:1.5} .muted{color:#bbcec8;font-size:13px}.panel{background:#192c36;border:1px solid #476674;border-radius:12px;padding:12px;margin:12px 0}svg{display:block;width:100%;height:auto;background:#13506b;border:2px solid #7597a5;border-radius:8px} .land{stroke:#a4c18a;stroke-width:2.5;stroke-linejoin:round}.region{cursor:pointer;outline:none}.region:focus .land,.region.active .land{stroke:#ffe18d;stroke-width:5}.route{stroke:#ffe9a3;stroke-width:3.5;stroke-dasharray:7 7;fill:none;opacity:.85;pointer-events:none}.route.faded{opacity:.13}.label{font-size:15px;fill:#fff;paint-order:stroke;stroke:#102733;stroke-width:4;stroke-linejoin:round;font-weight:bold;pointer-events:none}.small{font-size:11px}.chapter{fill:#f4d38a;stroke:#493f30;stroke-width:1.5}button{font-size:15px;border:1px solid #89acae;border-radius:8px;background:#284957;color:white;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#7b5d29;border-color:#ead693} .controls{display:flex;flex-wrap:wrap;gap:7px}#info{min-height:80px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #4c6770;padding:8px;text-align:left} a{color:#a8dbec}</style></head><body><h1>夜叉姫の花結び奇譚｜世界図 設計デバッグ v0.6</h1><p class="muted">地形は本作向けに独自作図した模式図です。原作ROMの画像・海岸線座標・タイルは含みません。地域形状・港の位置は仮案です。</p><div class="panel"><div class="controls" id="chapters"></div><p class="muted">章を選ぶか、地図上の地域をタップしてください。点線は物語の想定経路（地理的接続が確定したことを示すものではありません）。</p><svg id="map" viewBox="0 0 960 650" role="img" aria-label="章ごとの冒険地域を表示した独自世界模式地図"><defs><pattern id="water" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 2 18 Q 9 14 16 18" stroke="#6dabb8" stroke-width="1" fill="none" opacity=".28"/></pattern></defs><rect width="960" height="650" fill="#165471"/><rect width="960" height="650" fill="url(#water)"/><g id="regions"></g><g id="links"></g></svg></div><div class="panel" id="info" aria-live="polite"></div><div class="panel"><strong>制作上の確度</strong><table><tr><th>項目</th><th>状態</th></tr><tr><td>既存新大陸ローカルマップ</td><td>確定（80×80維持）</td></tr><tr><td>7章の進行順</td><td>確定（シナリオ設計）</td></tr><tr><td>原作地方の相対配置</td><td>高確度（別資料照合待ち）</td></tr><tr><td>本図の陸地ポリゴン</td><td>仮・完全オリジナル</td></tr><tr><td>港・峠・橋の実座標</td><td>未確定</td></tr></table></div><script>
const NS='http://www.w3.org/2000/svg';
const data=[
{id:'new_continent',name:'新大陸',chapter:1,shape:'M112 500 L154 471 201 483 223 514 217 556 191 578 148 565 119 543 Z',fill:'#66985e',point:[167,530],label:[168,537],desc:'鬼灯の里 → 天妖の社 → 海の入り江 → 忘れの森 → 龍神の滝 → 九尾の祠 → 入り江再訪。船で本土へ。',move:'船（第一章クリア後）'},
{id:'flower_tree',name:'花と木の国',chapter:2,shape:'M65 263 L95 214 164 196 213 225 247 219 266 246 311 269 301 314 263 320 248 359 189 349 152 379 104 354 80 322 Z',fill:'#73a95d',point:[194,291],label:[176,301],desc:'旅立ちの村をはじめとする和風の里と花の景観。北方の山・洞窟へ。',move:'山・洞窟（位置は未確定）'},
{id:'winter_star',name:'冬と星の国',chapter:3,shape:'M128 156 L147 100 209 64 275 83 298 114 352 110 389 160 352 204 296 222 245 207 198 195 170 209 Z',fill:'#bed8d5',point:[278,146],label:[274,146],desc:'雪原・湖・山岳。金太郎の村、足柄山の物語。',move:'東の橋（位置は未確定）'},
{id:'smile',name:'ほほえみの大地',chapter:4,shape:'M462 141 L504 109 554 120 588 96 661 115 689 163 656 199 615 201 598 253 541 241 512 224 470 234 444 197 Z',fill:'#80b56a',point:[559,178],label:[560,181],desc:'寝太郎の村を中心に、人の感情を操る装置の謎を追う。',move:'南の橋（位置は未確定）'},
{id:'hope_despair',name:'希望と絶望の大地',chapter:5,shape:'M719 180 L760 158 811 176 833 219 855 257 830 292 861 325 846 385 813 419 766 402 748 369 730 339 753 294 720 259 700 215 Z',fill:'#aa9b66',point:[788,286],label:[788,295],desc:'希望の都と五重の塔。繁栄と荒廃が対照的な地域。',move:'海路（港位置は未確定）'},
{id:'love_courage',name:'愛と勇気の国',chapter:6,shape:'M447 385 L503 364 553 376 589 407 612 440 592 496 559 526 511 517 483 538 443 509 415 470 428 429 Z',fill:'#72a66a',point:[519,446],label:[515,450],desc:'竹取の村と月に関わる手がかり。鬼ヶ島への道を開く。',move:'最終航路（位置は未確定）'},
{id:'onigashima',name:'鬼ヶ島',chapter:7,shape:'M689 474 L715 451 738 460 760 445 777 484 804 513 797 554 757 575 712 554 679 522 Z',fill:'#795b67',point:[745,504],label:[743,524],desc:'地獄深層、機巧カルラとの最終決戦。',move:'終章'}
];
const routeInfo=['船','山・洞窟','東の橋','南の橋','海路','最終航路'];
function el(tag,attrs={},text=''){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
const rg=document.getElementById('regions'),lg=document.getElementById('links');
for(const d of data){const g=el('g',{class:'region',tabindex:'0',role:'button','aria-label':`第${d.chapter}章 ${d.name}`});g.dataset.id=d.id;g.appendChild(el('path',{class:'land',d:d.shape,fill:d.fill}));const t=el('text',{x:d.label[0],y:d.label[1],class:'label','text-anchor':'middle'},d.name);g.appendChild(t);g.appendChild(el('circle',{class:'chapter',cx:d.point[0],cy:d.point[1]-33,r:13}));g.appendChild(el('text',{x:d.point[0],y:d.point[1]-29,class:'label small','text-anchor':'middle'},String(d.chapter)));g.onclick=()=>choose(d.chapter);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d.chapter)}};rg.append(g)}
for(let i=0;i<6;i++){const a=data[i].point,b=data[i+1].point;let midx=(a[0]+b[0])/2,midy=(a[1]+b[1])/2;let path=el('path',{class:'route',d:`M${a[0]} ${a[1]} Q${midx} ${midy-38} ${b[0]} ${b[1]}`});path.dataset.link=i+1;lg.appendChild(path)}
const buttons=document.getElementById('chapters');for(const d of data){const b=document.createElement('button');b.textContent=`${d.chapter}章 ${d.name}`;b.onclick=()=>choose(d.chapter);b.dataset.chapter=d.chapter;buttons.appendChild(b)}
function choose(n){const d=data[n-1];document.querySelectorAll('.region').forEach(e=>e.classList.toggle('active',e.dataset.id===d.id));document.querySelectorAll('.route').forEach(e=>e.classList.toggle('faded',+e.dataset.link!==n&&+e.dataset.link!==n-1));document.querySelectorAll('button[data-chapter]').forEach(e=>e.setAttribute('aria-pressed',+e.dataset.chapter===n));document.getElementById('info').innerHTML=`<strong>第${n}章｜${d.name}</strong><p>${d.desc}</p><p class="muted">次への移動：${d.move}／地理ポリゴン：仮</p>`}
choose(1);
</script></body></html>
