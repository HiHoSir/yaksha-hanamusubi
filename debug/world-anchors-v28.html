<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜叉姫 地理確定アンカー v2.8</title><style>
*{box-sizing:border-box}body{background:#11202c;color:#eef1e8;margin:0;padding:14px;font:15px system-ui,-apple-system,sans-serif;max-width:1050px;margin-inline:auto}h1{font-size:21px}p{line-height:1.6;color:#c6d5d7}.panel{padding:12px;border-radius:12px;border:1px solid #557f8b;background:#1b3441;margin:12px 0}svg{display:block;width:100%;height:auto;background:#205875;border-radius:8px}.land{fill:#9cb78b;stroke:#dae7ba;stroke-width:3}.snow{fill:#cbdad8}.red{fill:#9e6d72}.bamboo{fill:#88b77a}.label{font-size:18px;fill:white;paint-order:stroke;stroke:#18353e;stroke-width:5;font-weight:700;pointer-events:none}.small{font-size:14px}.mark{stroke:#3c543f;stroke-width:2;fill:#ffe8a0}.region{cursor:pointer}.region.active .land{stroke:#ffe492;stroke-width:7}.buttons{display:flex;flex-wrap:wrap;gap:6px}button{background:#2c5365;color:#fff;border:1px solid #95b5b9;border-radius:8px;padding:9px;min-height:42px}button[aria-pressed=true]{background:#8d682a}#detail{min-height:56px}small{color:#bfd0d0}</style></head><body><h1>夜叉姫｜原作地理アンカー v2.8</h1><p>4096pxのROM地図で名称が確認された6地域を配置。海岸線はコピーせず、位置・隣接関係を読み取るために独自の図形で表現しています。形状・地峡・海峡は未確定のため、外形完成図ではありません。</p><div class="panel"><div id="buttons" class="buttons"></div><svg id="map" viewBox="0 0 1080 800" role="img" aria-label="確認済み6地域の位置関係と追加する新大陸"><rect width="1080" height="800" fill="#1c5b78"/><g id="regions">
<g id="winter" class="region"><path class="land snow" d="M75 110Q123 62 183 75L238 92 269 158 257 246 223 299 157 314 104 273 69 202Z"/><text class="label" x="163" y="190" text-anchor="middle">冬と星の国</text></g>
<g id="smile" class="region"><path class="land" d="M697 90Q762 48 826 78L914 65 986 120 978 211 920 296 867 330 779 304 714 227Z"/><text class="label" x="849" y="192" text-anchor="middle">ほほえみの大地</text></g>
<g id="flower" class="region"><path class="land" d="M113 327Q161 294 209 320L250 357 237 410 276 447 263 514 223 566 214 642 178 703 136 667 119 597 83 556 99 487 73 422Z"/><text class="label" x="183" y="472" text-anchor="middle">花と木の国</text></g>
<g id="hope" class="region"><path class="land" d="M736 349Q784 310 844 339L930 337 1004 384 1010 468 976 537 995 604 960 685 872 696 798 650 761 589 718 520Z"/><text class="label" x="864" y="478" text-anchor="middle">希望と絶望の国</text></g>
<g id="oni" class="region"><path class="land red" d="M476 382Q488 341 528 330L565 344 584 380 558 415 516 426 486 406Z"/><text class="label small" x="535" y="376" text-anchor="middle">鬼ヶ島</text></g>
<g id="love" class="region"><path class="land bamboo" d="M425 551Q450 520 483 516L516 527 539 509 572 530 585 578 557 628 498 644 462 620 429 636 405 594Z"/><text class="label small" x="502" y="580" text-anchor="middle">愛と勇気の国</text><text class="label small" x="502" y="605" text-anchor="middle">竹の島</text></g>
<g id="new" class="region"><path class="land" d="M330 604L349 593 367 608 362 628 339 636 323 623Z"/><text class="label small" x="353" y="657" text-anchor="middle">新大陸（追加・仮）</text></g>
</g><g><path d="M502 524Q501 474 535 428" stroke="#ffe49a" stroke-width="4" stroke-dasharray="9 8" fill="none"/><text class="label small" x="580" y="476">海割り（方向のみ）</text><circle cx="238" cy="575" r="6" class="mark"/><text class="label small" x="241" y="561">旅立ちの村（場所は仮）</text></g></svg><p><small>凡例：地名の対応は確認済み／輪郭・村の位置・距離・新大陸の座標は仮。地形座標やROM画像は含みません。</small></p><div id="detail" aria-live="polite"></div></div><script>
'use strict';
const data=[['winter','北西の雪原と山岳地域。地名の対応は確認済み。'],['smile','北東の雪原・山岳を含む地域。地名の対応は確認済み。'],['flower','南西へ長く延びる地域。旅立ちの村の正確な位置は別検証。'],['hope','南東の広い緑地と赤い地形を含む地域。'],['oni','愛と勇気の国の北側の赤い鬼面状の島。'],['love','中央南側にある竹の多い島。'],['new','原作には存在しない第1章の新大陸。縮尺と配置は仮。']];
const buttons=document.querySelector('#buttons');
function choose(id){document.querySelectorAll('.region').forEach(g=>g.classList.toggle('active',g.id===id));document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));const d=data.find(x=>x[0]===id);document.querySelector('#detail').textContent=d[1]}
for(const [id,label] of data){const b=document.createElement('button');b.dataset.id=id;b.textContent=({winter:'冬と星',smile:'ほほえみ',flower:'花と木',hope:'希望と絶望',oni:'鬼ヶ島',love:'愛と勇気',new:'新大陸'})[id];b.onclick=()=>choose(id);buttons.append(b);document.getElementById(id).onclick=()=>choose(id)}
choose('oni');
</script></body></html>
