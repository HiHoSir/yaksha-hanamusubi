<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜叉姫 世界外形 v2.4 二大陸の検証</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#10212d;color:#f0f4ed;font:15px system-ui,-apple-system,sans-serif;max-width:1020px;margin-inline:auto}h1{font-size:21px}p{line-height:1.6;color:#cbd7da}section{background:#1d3441;border:1px solid #668391;padding:12px;border-radius:12px;margin:12px 0}svg{display:block;width:100%;height:auto;border-radius:8px;background:#205c7c}.land{fill:#a9b783;stroke:#e2e5bb;stroke-width:3;stroke-linejoin:round}.concept{stroke:#edc789;stroke-width:2;stroke-dasharray:6 6;fill:none}.text{fill:white;stroke:#10364a;stroke-width:4;paint-order:stroke;font-weight:700;font-size:18px;pointer-events:none}.small{font-size:13px}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{background:#315668;color:white;border:1px solid #94b6bb;border-radius:8px;padding:10px;min-height:44px}button[aria-pressed=true]{background:#86602c}.focus{stroke:#ffe18c!important;stroke-width:7!important}#detail{min-height:65px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #4a6471;text-align:left}</style></head><body><h1>夜叉姫の花結び奇譚｜外形検証 v2.4</h1><p>ROM復元地図を参照して、前版の「ひとつの巨大な本土」という仮定を撤回しました。これは地理の接続関係のみを参考に独自に描いた外形模式図で、海岸線の転写ではありません。</p>
<section><div id="buttons" class="buttons"></div><svg viewBox="0 0 960 720" id="map" role="img" aria-label="西の陸地、東の陸地、南方の小島群、新大陸と鬼ヶ島候補の独自外形図"><defs><pattern id="wave" width="50" height="42" patternUnits="userSpaceOnUse"><path d="M3 26Q16 19 29 26" stroke="#8bbaca" stroke-width="1.5" fill="none" opacity=".22"/></pattern></defs><rect width="960" height="720" fill="#215c7d"/><rect width="960" height="720" fill="url(#wave)"/><g id="lands">
<path id="west" class="land" d="M119 91Q142 66 168 88L188 122Q239 124 254 162L302 152Q347 157 361 206L359 263 381 302 359 348 346 395Q320 409 321 452L348 486Q346 523 303 535L282 587 260 607 238 584 223 543 191 517 167 475 134 460 111 426 113 387 81 362 93 318 70 285Q75 239 112 213L107 168Z"/>
<path id="east" class="land" d="M602 82L661 70 694 85 737 59 787 75 823 105 819 143 840 178 822 221 806 265 826 301 820 334 792 372 772 417 739 434 737 465 764 498 805 524 826 562 808 611 769 619 743 599 703 604 678 581 691 536 657 512 652 470 670 434 653 398 667 367 642 332 658 295 627 257 602 225 579 190 595 148Z"/>
<path id="central" class="land" d="M442 528Q449 496 483 480L509 504 526 479 549 489 559 532 538 567 501 578 473 566 449 573Z"/>
<path id="southwest" class="land" d="M150 540L176 549 202 571 214 607 228 629 209 675 177 677 150 649 131 609Z"/>
<path id="oni" class="land" d="M488 369Q492 340 514 326L539 328 552 346 551 372 528 388 503 383Z"/>
<path id="new" class="land" d="M416 469Q429 458 441 468L450 484 440 501 423 495Z"/>
</g><g id="labels"></g><path class="concept" d="M369 416Q400 433 431 478"/></svg><p id="detail" aria-live="polite"></p></section>
<section><strong>外形の検証状況</strong><table><tr><th>判断</th><th>状況</th></tr><tr><td>大きな西側・東側の陸地</td><td>ROM復元地図で視認</td></tr><tr><td>南側と中央の独立陸塊</td><td>存在は視認。地名同定は未確定</td></tr><tr><td>鬼ヶ島の地理座標</td><td>未確定（表示位置は仮）</td></tr><tr><td>新大陸</td><td>本作独自。南西側から見た東方沖に仮配置</td></tr><tr><td>原作の海岸線との一致</td><td>保証しない。公開用にすべて独自作図</td></tr></table></section>
<script>
'use strict';
const sites={west:['西側の大きな陸地','復元地図の西方に大きな陸塊があることを確認。国名と地域境界の正確な割当は別途検証する。'],east:['東側の大きな陸地','復元地図の東方にも大きな陸塊が存在。西方とは海域で分かれている。'],central:['中央南方の独立陸塊','中央南寄りの特徴的な小陸塊。鬼ヶ島と同定しない。'],southwest:['南西の別陸塊','南西に延びた陸地。接続と海峡の精密な判定は保留。'],oni:['鬼ヶ島（位置未確定）','勇気の岬から海を割って渡る相対関係のみ確認。ここでの島の場所は仮のマーカー。'],new:['新大陸（本作独自）','既存の新大陸80×80を縮小表示。旅立ちの村の東方沖という案は仮の位置。']};
const buttons=document.querySelector('#buttons'),label=document.querySelector('#labels'),shores=document.querySelectorAll('#lands path'),detail=document.querySelector('#detail');let selected='west';
const coords={west:[209,250],east:[729,257],central:[492,546],southwest:[176,628],oni:[515,363],new:[426,480]};
const ns='http://www.w3.org/2000/svg';
for(const [id,[name]] of Object.entries(sites)){const b=document.createElement('button');b.dataset.id=id;b.textContent=name.split('（')[0];b.onclick=()=>choose(id);buttons.append(b);const [x,y]=coords[id],t=document.createElementNS(ns,'text');t.setAttribute('class','text '+(id==='oni'||id==='new'?'small':''));t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.textContent=name;label.append(t)}
function choose(id){selected=id;shores.forEach(p=>p.classList.toggle('focus',p.id===id));buttons.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));detail.textContent=sites[id][0]+'：'+sites[id][1]}
shores.forEach(p=>{p.style.cursor='pointer';p.addEventListener('click',()=>choose(p.id))});choose('west');
</script></body></html>
