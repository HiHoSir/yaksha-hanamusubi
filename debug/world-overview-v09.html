<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜叉姫 世界地形32px検証 v0.9</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d28;color:#eaf1e8;font:15px system-ui,-apple-system,sans-serif;padding:12px;max-width:1050px;margin-inline:auto}h1{font-size:20px}p{line-height:1.55;color:#cbd8d8}.panel{background:#192f3c;border:1px solid #597784;border-radius:10px;padding:12px;margin:10px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#18537b;border-radius:6px}button{background:#284c5e;border:1px solid #94b5bb;border-radius:8px;color:white;padding:9px;min-height:40px}button[aria-pressed=true]{background:#866127}#chapters{display:flex;flex-wrap:wrap;gap:6px}label{display:inline-flex;align-items:center;gap:6px;margin:5px 12px 5px 0}.key{font-size:12px;color:#cbd8d8}.detail{min-height:45px}</style></head><body>
<h1>夜叉姫の花結び奇譚｜32px世界地形検証 v0.9</h1>
<p>独自制作の模式輪郭を32×32pxタイルに変換した独立デバッグ画面です。原作の実際の海岸線・地形データは含みません。橋・港・地理境界はすべて仮案。ゲーム本体とセーブは読み込みません。</p>
<div class="panel"><div id="chapters"></div><label><input id="routes" type="checkbox" checked>章進行ルート</label><label><input id="grid" type="checkbox">32pxグリッド</label><canvas id="map" width="960" height="640" aria-label="32ピクセル地形タイルによる世界図"></canvas><p class="key">凡例：海＝青／草原＝緑／森＝濃緑／山＝灰／雪＝白／荒野＝黄土／鬼ヶ島＝暗紫。章間移動は黄色の線。</p></div><div class="panel detail" id="info"></div>
<script>
'use strict';
const TILE=32,W=30,H=20,regions=[
{id:'new',name:'新大陸',chapter:1,poly:[[10,13],[11,13],[12,14],[12,15],[11,16],[10,15]],terrain:'grass',center:[11,14],description:'鬼灯の里→天妖の社→海の入り江→忘れの森→龍神の滝→九尾の祠→入り江へ帰還。旅立ちの村東方沖から船出。'},
{id:'flower',name:'花と木の国',chapter:2,poly:[[2,8],[3,7],[5,6],[7,7],[9,8],[9,10],[8,11],[6,11],[5,12],[3,11],[2,10]],terrain:'grass',center:[5,9],description:'旅立ちの村から、北方の山・洞窟を抜ける。'},
{id:'winter',name:'冬と星の国',chapter:3,poly:[[4,5],[5,3],[7,2],[9,3],[12,4],[12,6],[10,7],[8,6],[6,7]],terrain:'snow',center:[8,4],description:'雪原・山地・湖。東の橋を開放する。'},
{id:'smile',name:'ほほえみの大地',chapter:4,poly:[[15,4],[17,3],[20,3],[22,5],[21,7],[19,8],[16,7],[14,6]],terrain:'grass',center:[18,5],description:'寝太郎の村を巡り、南の橋へ。'},
{id:'hope',name:'希望と絶望の大地',chapter:5,poly:[[24,5],[26,5],[28,7],[27,10],[28,12],[27,14],[25,13],[24,11],[23,9]],terrain:'barren',center:[26,9],description:'希望の都・五重の塔。船で南の大陸へ。'},
{id:'love',name:'愛と勇気の国',chapter:6,poly:[[14,12],[16,11],[18,12],[20,13],[19,16],[17,17],[14,16],[13,14]],terrain:'grass',center:[17,14],description:'竹取の村などを巡り、鬼ヶ島への道を開く。'},
{id:'oni',name:'鬼ヶ島',chapter:7,poly:[[22,15],[23,14],[25,14],[26,16],[25,18],[23,18],[22,17]],terrain:'oni',center:[24,16],description:'地獄深層・機巧カルラとの最終決戦。'}
];
const links=[{a:0,b:1,kind:'船'},{a:1,b:2,kind:'山・洞窟'},{a:2,b:3,kind:'東の橋'},{a:3,b:4,kind:'南の橋'},{a:4,b:5,kind:'船'},{a:5,b:6,kind:'最終航路'}];
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let chosen=1;
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c}
const cell=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{let r=regions.find(r=>inside(x+.5,y+.5,r.poly));if(!r)return {t:'sea',r:-1};let t=r.terrain;const n=(x*31+y*47+ r.chapter*23)%13;if(t==='grass'){if(n<=2)t='forest';else if(n===3)t='mountain'}if(t==='snow'&&n<4)t='snowMountain';if(t==='barren'&&n<3)t='mountain';if(t==='oni'&&n===2)t='mountain';return {t,r:r.chapter-1}})));
function paint(x,y,c){let X=x*TILE,Y=y*TILE,t=c.t;const colors={sea:'#145985',grass:'#87b85c',forest:'#366b44',mountain:'#817f69',snow:'#d8e9e7',snowMountain:'#abbfc5',barren:'#b5a16d',oni:'#775c6b'};ctx.fillStyle=colors[t];ctx.fillRect(X,Y,TILE,TILE);if(t==='sea'){ctx.fillStyle='#367ba2';if((x*7+y*3)%4===0){ctx.fillRect(X+7,Y+13,10,2);ctx.fillRect(X+18,Y+15,7,2)}}else if(t==='forest'){ctx.fillStyle='#245637';ctx.fillRect(X+9,Y+8,12,14);ctx.fillStyle='#509157';ctx.fillRect(X+11,Y+5,8,8);ctx.fillStyle='#503b2c';ctx.fillRect(X+14,Y+22,3,5)}else if(t==='mountain'||t==='snowMountain'){ctx.fillStyle=t==='mountain'?'#c0baa1':'#fff';ctx.beginPath();ctx.moveTo(X+4,Y+24);ctx.lineTo(X+16,Y+5);ctx.lineTo(X+28,Y+24);ctx.fill();ctx.fillStyle=t==='mountain'?'#64695e':'#aab7c2';ctx.beginPath();ctx.moveTo(X+16,Y+5);ctx.lineTo(X+28,Y+24);ctx.lineTo(X+16,Y+24);ctx.fill()}else if((x+y*3)%5===0){ctx.fillStyle=t==='snow'?'#fff':t==='oni'?'#be6871':'#b1cb72';ctx.fillRect(X+6,Y+15,5,3);ctx.fillRect(X+19,Y+22,3,3)}}
function render(){ctx.clearRect(0,0,960,640);cell.forEach((row,y)=>row.forEach((c,x)=>paint(x,y,c)));const selected=regions[chosen-1];ctx.save();if(document.querySelector('#routes').checked){links.forEach((l,i)=>{const a=regions[l.a].center,b=regions[l.b].center;ctx.beginPath();ctx.setLineDash([7,7]);ctx.strokeStyle=(i===chosen-1||i===chosen-2)?'#ffe3a0':'#c4ad70';ctx.lineWidth=(i===chosen-1||i===chosen-2)?4:2;ctx.moveTo((a[0]+.5)*32,(a[1]+.5)*32);ctx.lineTo((b[0]+.5)*32,(b[1]+.5)*32);ctx.stroke()});ctx.setLineDash([])}regions.forEach(r=>{let [x,y]=r.center;ctx.fillStyle=r.chapter===chosen?'#ffdc75':'#e5ecdf';ctx.fillRect(x*32+4,y*32+2,24,25);ctx.fillStyle='#183044';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(String(r.chapter),x*32+16,y*32+21)});ctx.lineWidth=4;ctx.strokeStyle='#ffdf83';ctx.beginPath();selected.poly.forEach((p,i)=>i?ctx.lineTo(p[0]*32,p[1]*32):ctx.moveTo(p[0]*32,p[1]*32));ctx.closePath();ctx.stroke();if(document.querySelector('#grid').checked){ctx.strokeStyle='#ffffff33';ctx.lineWidth=.7;for(let x=0;x<=960;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,640);ctx.stroke()}for(let y=0;y<=640;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}}ctx.restore();document.querySelector('#info').textContent='第'+chosen+'章：'+selected.name+'｜'+selected.description+'　※地形と橋・港は独自模式図の暫定位置';document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.chapter)===chosen))}
const controls=document.querySelector('#chapters');regions.forEach(r=>{let b=document.createElement('button');b.dataset.chapter=r.chapter;b.textContent=r.chapter+'章 '+r.name;b.onclick=()=>{chosen=r.chapter;render()};controls.appendChild(b)});canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left)/rect.width*W),y=Math.floor((e.clientY-rect.top)/rect.height*H);const c=cell[y]?.[x];if(c&&c.r>=0){chosen=c.r+1;render()}});document.querySelector('#routes').onchange=render;document.querySelector('#grid').onchange=render;render();
</script></body></html>
