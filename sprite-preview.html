<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜叉姫 β15.28 歩行確認</title>
<style>body{background:#17212c;color:#f4efe8;font:16px system-ui;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:23px}p{line-height:1.7}button,select{font:inherit;padding:10px;margin:5px;border-radius:8px}canvas{width:100%;background:#a0a6ad;border-radius:16px}label{display:inline-block}input{vertical-align:middle}</style>
<main><h1>夜叉姫・歩行確認 β15.28</h1><p>4方向×3枚。衣装を首・腰・手首へ追従させ、脚と靴は共通ベースに合わせています。「ベースと並べる」で位置を比較できます。</p><select id="outfit" aria-label="衣装"><option value="normal-v9">花守り装束</option><option value="light-v9">軽装・薄紅</option><option value="white-v9">水辺の白装束</option><option value="navy-v9">水辺の藍装束</option><option value="yukata-v9">宵桜の浴衣</option><option value="demon-v9">小鬼の戯れ着</option><option value="basewear">白の稽古着</option></select><label><input id="compare" type="checkbox">ベースと並べる</label><button id="play">再生</button><button id="step">1コマ</button><label>間隔 <input id="speed" type="range" min="150" max="650" value="300"></label><canvas id="c" width="768" height="720"></canvas><p id="status" role="status">画像を読み込み中…</p><p>これは素材確認用です。<a href="battle-preview.html">攻撃・被弾確認</a> ／ 通常のゲームは <a href="index.html">index.html</a> から起動します。</p></main>
<script>
const $=id=>document.getElementById(id),ctx=$('c').getContext('2d'),sets={},dirs=['front','back','left','right'],phases=['neutral','right-leg-up','neutral','left-leg-up'];let phase=0,playing=false,last=0,ready=0,failed=0;
for(const outfit of ['normal-v9','light-v9','white-v9','navy-v9','yukata-v9','demon-v9','basewear']){sets[outfit]={};for(const d of dirs){sets[outfit][d]={};for(const p of new Set(phases)){const im=new Image();im.onload=()=>{ready++;draw()};im.onerror=()=>{failed++;draw()};im.src=`assets/characters/yashahime/${outfit}/${d}-${p}.png`;sets[outfit][d][p]=im;}}}
function draw(){ctx.clearRect(0,0,768,720);ctx.fillStyle='#192530';ctx.font='20px system-ui';dirs.forEach((d,i)=>{const x=(i%2)*384,y=Math.floor(i/2)*360;ctx.fillText(['正面','背面','左','右'][i]+' / '+phases[phase],x+20,y+30);const im=sets[$('outfit').value]?.[d]?.[phases[phase]];if($('compare').checked){const base=sets.basewear[d][phases[phase]];ctx.font='16px system-ui';ctx.fillText('ベース',x+34,y+68);ctx.fillText('衣装',x+224,y+68);if(base?.complete&&base.naturalWidth)ctx.drawImage(base,64,140,384,352,x+4,y+110,184,169);if(im?.complete&&im.naturalWidth)ctx.drawImage(im,64,140,384,352,x+196,y+110,184,169);ctx.font='20px system-ui';}else if(im?.complete&&im.naturalWidth)ctx.drawImage(im,64,140,384,352,x+24,y+44,336,308);});$('status').textContent=failed?`${failed}枚の読み込みに失敗しました。assetsフォルダも一緒に配置してください。`:`${ready}/84枚読み込み済み`;}
$('outfit').onchange=draw;$('compare').onchange=draw;$('step').onclick=()=>{phase=(phase+1)%4;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'停止':'再生';last=0};function tick(t){if(playing&&t-last>+$('speed').value){last=t;phase=(phase+1)%4;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
